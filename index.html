      g.restore();
    }
  }
  for (const f of S.fx) drawFx(f);
  for (const p of S.parts) drawPart(p);
  for (const s of S.suns) {
    if (s.fly) {
      const k = Math.min(1, s.flyT / 0.5), e = 1 - (1 - k) * (1 - k);
      drawSun(s.sx + (20 - s.sx) * e, s.sy + (20 - s.sy) * e, t, 1 - k * 0.6);
    } else drawSun(s.x, s.y, t, s.life < 2 ? 0.4 + 0.6 * Math.abs(Math.sin(s.life * 8)) : 1);
  }
  g.restore();
  if (!S.demo) drawHUD();
  // 飘字画在顶栏上层，永远不会被挡住
  for (const tx of S.texts) {
    const k = tx.t;
    g.save(); g.globalAlpha = 1 - clamp01((k - 0.6) / 0.4);

  if (S.flashA > 0) { g.fillStyle = `rgba(255,250,230,${S.flashA})`; g.fillRect(0, 0, W, H); }
  if (S.tut && S.intro >= INTRO && !S.demo) drawTut();
  if (!S.demo && S.intro < INTRO) {
    const step = Math.min(2, Math.floor(S.intro / (INTRO / 3)));

  if (S.banner) {

    bigText(S.banner.text, W / 2, H / 2, 46, '#ff6b8a', '#fffaf4', 0.6 + 0.4 * k);

// 在一个 100×100 的逻辑画布上画图标
function drawIcon(canvas, kind, key, opt = {}) {
  const c2 = canvas.getContext('2d');
  const prev = g; g = c2;
  const s = canvas.width / 100;
  c2.setTransform(s, 0, 0, s, 0, 0);
  c2.clearRect(0, 0, 100, 100);
  if (kind === 'plant') {
    g.translate(46, 90); g.scale(1.05, 1.05);
    drawPlant(key, 0, 0, 0, null);
  } else if (kind === 'zombie') {
    const s = key === 'balloon' ? 0.78 : key === 'garg' ? 0.6 : key === 'zomboni' ? 0.8 : key === 'pole' ? 0.95 : 1.15;
    g.translate(key === 'zomboni' ? 66 : 52, key === 'balloon' ? 96 : 90); g.scale(s, s);
    const d = ZDEF[key];
    drawZombie({ type: key, hp: d.hp, maxHp: d.hp, armor: d.armor, maxArmor: d.armor, armorType: d.armorType, pole: !!d.pole, jumping: 0, frozen: 0, slow: 0, flash: 0, anim: 0, eating: false, dead: false,
      shield: d.shield || 0, fly: !!d.fly, thrown: false, smashT: 0, stop: 0, bounce: 0, landT: 0 }, 0, 0);
  } else if (kind === 'sun') {
    g.translate(50, 50); g.scale(1.05, 1.05); drawSun(0, 0, 0);
  } else if (kind === 'dart') {
    // 牙签飞镖：牙签 + 粉色尾羽
    line(24, 78, 76, 26, '#e8c08a', 6);
    poly([76, 26, 86, 14, 80, 32], '#c9d6e3', '#7a8fa3', 2);
    poly([24, 78, 12, 74, 18, 90], '#ff9ec0', '#c2607e', 2);
    poly([24, 78, 28, 92, 14, 88], '#ffb3c7', '#c2607e', 2);
  } else if (kind === 'shovel') {
    line(30, 74, 64, 34, '#8a5a2e', 8);
    line(22, 82, 36, 66, '#3b3a35', 9);
    poly([58, 24, 84, 18, 80, 44, 64, 44], '#b8c0c4', '#4b5257', 3);
  }
  if (opt.locked) {
    c2.setTransform(1, 0, 0, 1, 0, 0);
    c2.globalCompositeOperation = 'source-atop';
    c2.fillStyle = '#4a3a24'; c2.fillRect(0, 0, canvas.width, canvas.height);
    c2.globalCompositeOperation = 'source-over';
  }
  g = prev;
}
function iconCanvas(kind, key, px, opt) {
  const c = document.createElement('canvas');
  c.width = c.height = Math.round(px * Math.min(3, window.devicePixelRatio || 1));
  drawIcon(c, kind, key, opt);
  return c;
}

function buildBelt() {

/* ---------- 浮层通用 ---------- */
function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, '');
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null) e.append(kid);
  return e;
}
function btn(label, fn, cls = '') { return el('button', { class: 'btn ' + cls, onclick: () => { sfx('select'); fn(); } }, label); }
function openOverlay(node, soft = false) {
  overlay.innerHTML = '';
  overlay.className = soft ? 'soft' : '';
  overlay.append(node);
  overlay.hidden = false;
  const f = overlay.querySelector('button:not(:disabled)');
  if (f) f.focus({ preventScroll: true });
}
function closeOverlay() { overlay.hidden = true; overlay.innerHTML = ''; }
function panel(cls, ...kids) { return el('div', { class: 'panel ' + cls }, ...kids); }
function head(title, back) {
  return el('div', { class: 'phead' }, el('h1', {}, title), back ? btn('返回', back, 'alt small') : null);
}

// 关卡情报：这关会来哪些团子、各自特点、用谁克制（已解锁的克制小伙伴会标成"推荐"）
function intelBlock(cfg) {
  const types = [...new Set([...(cfg.flags && cfg.flags.length || cfg.flagEvery ? ['flag'] : []), ...cfg.pool])].filter(t => ZINFO[t]);
  const owned = new Set(cfg.plants);
  const rec = new Set();
  const rows = types.map(t => {
    const info = ZINFO[t];
    const counters = info.counters.filter(k => PLANTS[k]);
    counters.forEach(k => { if (owned.has(k)) rec.add(k); });
    return el('div', { class: 'intel-row' },
      iconCanvas('zombie', t, 46),
      el('div', { class: 'intel-txt' }, el('b', {}, ZDEF[t].name + (info.badge ? ` ·「${info.badge}」` : '')), el('span', {}, info.trait)),
      el('div', { class: 'intel-ctr' }, el('small', {}, '克制'),
        ...counters.slice(0, 4).map(k => { const c = iconCanvas('plant', k, 30, { locked: !plantUnlocked(k) && !owned.has(k) }); c.title = PLANTS[k].name; return c; })));
  });
  return { node: el('div', { class: 'intel' }, el('h2', {}, '关卡情报'), ...rows), rec };
}
function startFlow(cfg) {
  running = false;
  bankEl.hidden = true;
  const intel = intelBlock(cfg);
  if (cfg.plants.length <= MAX_SLOTS) {
    openOverlay(panel('wide', head(cfg.label, showMenu), intel.node,
      el('div', { class: 'btns' }, btn('开始', () => startGame(cfg, cfg.plants.slice())))));
    return;
  }
  let pick = save.pick.filter(k => cfg.plants.includes(k)).slice(0, MAX_SLOTS);
  if (!pick.length) pick = cfg.plants.slice(0, MAX_SLOTS);
  const slots = el('div', { class: 'slots' });
  const tiles = el('div', { class: 'tiles' });
  const go = btn('开始战斗', () => { save.pick = pick.slice(); persist(); startGame(cfg, pick.slice()); });
  function render() {
    slots.innerHTML = ''; tiles.innerHTML = '';
    pick.forEach(k => slots.append(el('button', { class: 'tile', 'aria-label': `移出${PLANTS[k].name}`, onclick: () => { pick = pick.filter(x => x !== k); sfx('select'); render(); } },
      iconCanvas('plant', k, 44), el('span', { class: 'tn' }, PLANTS[k].cost))));
    for (let i = pick.length; i < MAX_SLOTS; i++) slots.append(el('div', { class: 'tile', style: 'opacity:.35;pointer-events:none' }, el('span', { class: 'tn', style: 'padding:16px 0' }, '空')));
    cfg.plants.forEach(k => {
      const on = pick.includes(k);
      tiles.append(el('button', { class: 'tile' + (on ? ' used' : ''), 'aria-label': `${on ? '已选' : '选择'}${PLANTS[k].name}`, onclick: () => {
        if (on) pick = pick.filter(x => x !== k);
        else if (pick.length < MAX_SLOTS) pick.push(k);
        else { sfx('cant'); return; }
        sfx('select'); render();
      } }, iconCanvas('plant', k, 52), el('span', { class: 'tn' }, PLANTS[k].name), el('span', { class: 'tn' }, `☀${PLANTS[k].cost}`),
        intel.rec.has(k) ? el('span', { class: 'rec' }, '推荐') : null));
    });
    go.disabled = pick.length === 0;
  }
  render();
  openOverlay(panel('wide', head('选择小伙伴', showMenu), intel.node, el('p', { class: 'sub' }, `${cfg.label} · 最多带 ${MAX_SLOTS} 种小伙伴，标着「推荐」的能克制这关的团子`), slots, tiles, el('div', { class: 'btns' }, go)));
}

function showAlmanac(tab) {
  const tabs = el('div', { class: 'tabs' },
    ...[['plants', '小伙伴'], ['zombies', '团子'], ['ach', '成就']].map(([k, n]) =>
      el('button', { class: 'tab' + (tab === k ? ' on' : ''), onclick: () => { sfx('select'); showAlmanac(k); } }, n)));
  let body;
  if (tab === 'ach') {
    body = el('div', { class: 'achs' }, ...ACH.map(a => el('div', { class: 'ach' + (save.ach[a.id] ? ' got' : '') },
      el('div', { class: 'medal' }, save.ach[a.id] ? '★' : '？'), el('div', {}, el('b', {}, a.name), el('span', {}, a.desc)))));
  } else {
    const isP = tab === 'plants';
    const keys = isP ? PLANT_ORDER : ZOMBIE_ORDER;
    const known = k => isP ? plantUnlocked(k) : !!save.seen[k];
    const detail = el('div', { class: 'detail' });
    const grid = el('div', { class: 'tiles' });
    const show = k => {
      grid.querySelectorAll('.tile').forEach(t => t.classList.toggle('cur', t.dataset.k === k));
      detail.innerHTML = '';
      const ok = known(k);
      const big = iconCanvas(isP ? 'plant' : 'zombie', k, 96, { locked: !ok });
      if (isP) {
        const d = PLANTS[k];
        const lv = LEVELS.find(L => L.reward === k);
        const rar = RARITY[rarityOf(k)];
        const how = d.luckyOnly ? (ok ? '甜品盲盒限定 · 已开出过' : '甜品盲盒限定：从盒子里开出来后解锁')
          : ok ? '冒险模式可用' : `通关冒险 ${lv.id} 解锁（挑战和无尽模式可先试用）`;
        detail.append(el('div', { class: 'dtop' }, big, el('div', {}, el('h3', {}, d.name),
          el('div', { class: 'tag' }, `☀ ${d.cost} · 冷却 ${d.cd} 秒 · 职能：${ROLES[ROLE_OF[k]] ? ROLES[ROLE_OF[k]].name : '—'} · `, el('span', { class: 'rar', style: `--rar:${rar.color}` }, `盲盒稀有度：${rar.name}`)),
          el('div', { class: 'tag' }, how))),
          el('div', { class: 'stat' }, d.stat), el('div', { class: 'lore' }, d.lore));
      } else {
        const d = ZDEF[k];
        const spd = d.speed >= 25 ? '很快' : d.speed >= 18 ? '较快' : '慢';
        detail.append(el('div', { class: 'dtop' }, big, el('div', {}, el('h3', {}, ok ? d.name : '？？？'),
          el('div', { class: 'tag' }, ok ? '团子' : '还没遇到'))),
          ok ? el('div', { class: 'stat' }, `耐久 ${d.hp + d.armor}${d.armor ? `（护甲 ${d.armor}）` : ''} · 速度${spd}`) : null,
          el('div', { class: 'lore' }, ok ? d.lore : '在关卡里遇到它之后，这里会记录它的资料。'));
      }
    };
    keys.forEach(k => {
      const ok = known(k);
      grid.append(el('button', { class: 'tile', 'data-k': k, onclick: () => { sfx('select'); show(k); } },

    });
    body = el('div', { class: 'alm' }, grid, detail);

  }

function gameOver(won) {
  if (S.over) return;
  S.over = true; S.selected = null;
  Sound.music(null);
  const body = [];
  const btns = [];
  if (CFG.mode === 'endless' || CFG.mode === 'lucky') {
    const key = CFG.mode === 'lucky' ? 'luckyBest' : 'bestWave';
    const wave = S.waveNum;
    const best = wave > save[key];
    if (best) save[key] = wave;
    persist();
    sfx('lose');
    body.push(el('p', {}, `撑到了第 ${wave} 波，喂饱 ${S.kills} 只团子。${best ? '刷新了最高纪录！' : `最高纪录：第 ${save[key]} 波。`}`));
    if (CFG.mode === 'lucky') body.push(el('p', {}, `图鉴里已经开出过 ${Object.keys(save.boxGot).length}/${PLANT_ORDER.length} 种小伙伴${S.boxZombies ? `，这局盒子里跳出过 ${S.boxZombies} 只团子` : ''}。`));
    btns.push(btn('再来一局', () => startGame(CFG, S.deck)), btn('主菜单', showMenu, 'alt'));
    setTimeout(() => openOverlay(panel('', el('h1', {}, '蛋糕失守啦'), el('p', { class: 'sub' }, CFG.label), ...body, el('div', { class: 'btns' }, ...btns))), 700);
    return;
  }
  if (!won) {
    persist();
    sfx('lose');
    S.shake = 10;
    setTimeout(() => openOverlay(panel('', el('h1', {}, '蛋糕被偷吃了一口！'), el('p', { class: 'sub' }, CFG.label),
      el('p', {}, `坚持了 ${Math.floor(S.t)} 秒，喂饱 ${S.kills} 只团子。试试先多放几朵荷包蛋花攒方糖。`),
      el('div', { class: 'btns' }, btn('再试一次', () => startGame(CFG, S.deck)), btn('主菜单', showMenu, 'alt')))), 900);
    return;
  }
  sfx('win');
  for (let i = 0; i < 40; i++) part({ x: rnd(LX, W), y: TOP - 10, vx: rnd(-40, 40), vy: rnd(0, 120), grav: 150, life: rnd(1.2, 2), size: rnd(3, 6), color: ['#ffd23f', '#e3263a', '#7fd14a', '#7fd3ff', '#fff3d1'][i % 5], shape: 'rect', vr: rnd(-8, 8) });
  if (CFG.mode === 'adventure') {
    const i = CFG.idx, first = !save.cleared.includes(i);
    if (first) save.cleared.push(i);
    if (i === 0) unlockAch('first');
    if (LEVELS[i].id === '1-16') unlockAch('master');
        if (!S.mowerUsed) unlockAch('nomower');
    persist();
    if (first) {
      const k = LEVELS[i].reward;
      body.push(el('div', { class: 'reward' }, iconCanvas('plant', k, 64), el('div', {}, el('b', {}, `获得新小伙伴：${PLANTS[k].name}`), el('p', {}, PLANTS[k].desc))));
      setTimeout(() => sfx('unlock'), 700);
    }
    body.unshift(el('p', {}, `守住了 ${CFG.waves} 波进攻，喂饱 ${S.kills} 只团子${S.mowerUsed ? '' : '，扫地机器人一台没动'}。`));
    if (i + 1 < LEVELS.length) btns.push(btn(`下一关 ${LEVELS[i + 1].id}`, () => startFlow(advCfg(i + 1))));
    btns.push(btn('关卡列表', showLevels, 'alt'), btn('主菜单', showMenu, 'alt'));
  } else if (CFG.mode === 'lucky') {
    save.luckyWin = true;
    unlockAch('luckywin');
    persist();
    body.push(el('p', {}, `守住了 ${CFG.waves} 波，喂饱 ${S.kills} 只团子${S.boxZombies ? `，盒子里跳出过 ${S.boxZombies} 只团子` : ''}。`));
    body.push(el('p', {}, `图鉴里已经开出过 ${Object.keys(save.boxGot).length}/${PLANT_ORDER.length} 种小伙伴。`));
    btns.push(btn('再开一局', () => startGame(CFG, S.deck)), btn('主菜单', showMenu, 'alt'));
  } else if (CFG.mode === 'mini') {
    save.mini[CFG.id] = true;
    if (MINIGAMES.every(m => save.mini[m.id])) unlockAch('minigamer');
    persist();
    body.push(el('p', {}, `完成！喂饱 ${S.kills} 只团子。`));
    btns.push(btn('小游戏列表', showMinigames), btn('主菜单', showMenu, 'alt'));
  } else {
    save.chal[CFG.id] = true;
    if (CHALLENGES.every(c => save.chal[c.id])) unlockAch('challenger');
    persist();
    body.push(el('p', {}, `挑战完成，喂饱 ${S.kills} 只团子。`));
    btns.push(btn('挑战列表', showChallenges), btn('主菜单', showMenu, 'alt'));
  }
  setTimeout(() => openOverlay(panel('', el('h1', {}, '守住了！'), el('p', { class: 'sub' }, CFG.label), ...body, el('div', { class: 'btns' }, ...btns))), 1200);
}

function startGame(cfg, deck) {
  S = newState(cfg, deck);
  // 开局赠送的小伙伴（目前没有模式使用）
  if (cfg.freeRow) for (let r = 0; r < ROWS; r++) { const p = makePlant(cfg.freeRow); p.age = 1; S.plants[r][0] = p; }
  if (cfg.conveyor) buildBelt(); else buildCards(deck);
  sunbox.hidden = !!cfg.conveyor;
  bankEl.hidden = false;
  running = true; paused = false; lastUI = {};
  pauseBtn.textContent = '暂停';
  closeOverlay();
  S.tut = cfg.mode === 'adventure' && cfg.idx === 0 && !save.tutorialDone ? { step: 0, t: 0, sun: false } : null;
  tutSkip.hidden = !S.tut;
  wantMusic = 'game'; Sound.music('game');
  requestAnimationFrame(fit);
}

/* ---------- 牙签飞镖：戳破离点击位置最近的气球 ---------- */
function throwDart(x, y) {
  let best = null, bd = 120;
  for (const z of S.zombies) {
    if (!z.fly || z.dead) continue;
    const zy = zombieY(z);
    const d = Math.min(Math.hypot(z.x - x, zy - 20 - y), Math.hypot(z.x + 10 - x, zy - 100 - y));
    if (d < bd) { bd = d; best = z; }
  }
  if (!best) { floatText(x, y, '这里没有气球', '#fffaf4', 16); sfx('cant'); return; }
  S.sun -= DART_COST; S.dartCd = DART_CD; S.selected = null;
  const zy = zombieY(best);
  for (let i = 0; i < 6; i++) part({ x: best.x + 10, y: zy - 100, vx: rnd(-200, 200), vy: rnd(-200, 100), grav: 300, life: 0.4, size: rnd(3, 5), color: i % 2 ? '#ffb3c7' : '#ffffff', shape: 'sparkle' });
  hurtZombie(best, 15);
  S.fx.push({ type: 'ring', x: best.x + 10, y: zy - 100, t: 0, dur: 0.35, color: '#ff9ec0', r: 60 });
  sfx('pop');
}

/* ---------- 输入 ---------- */
const rotatedMQ = window.matchMedia('(orientation:portrait) and (max-width:600px)');
function toWorld(e) {
  const r = cv.getBoundingClientRect();
  // 竖屏时整个游戏顺时针转了 90°：画布的 x 轴朝下，y 轴朝左
  if (rotatedMQ.matches) return { x: (e.clientY - r.top) / r.height * W, y: (r.right - e.clientX) / r.width * H };
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
function cellAt(x, y) {
  const c = Math.floor((x - LX) / CW), r = Math.floor((y - TOP) / CH);
  return c >= 0 && c < COLS && r >= 0 && r < ROWS ? { r, c } : null;
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (!playable()) return;
  if (S.tut && TUT[S.tut.step].tap) { nextTut(); return; }
  const { x, y } = toWorld(e);
  let best = null, bd = 52;
  for (const s of S.suns) {
    if (s.fly) continue;
    const d = Math.hypot(s.x - x, s.y - y);
    if (d < bd) { bd = d; best = s; }
  }
  if (best) {
    best.fly = true; best.sx = best.x; best.sy = best.y;
    S.sun += best.value;
    floatText(best.x, best.y - 10, '+' + best.value, '#ffe36b', 22);
    for (let i = 0; i < 12; i++) part({ x: best.x, y: best.y, vx: rnd(-180, 180), vy: rnd(-180, 120), grav: 120, life: 0.5, size: rnd(3, 6), color: i % 2 ? '#ffd56a' : '#ffffff', shape: 'sparkle', vr: 8 });
    S.fx.push({ type: 'ring', x: best.x, y: best.y, t: 0, dur: 0.35, color: '#ffd56a' });
    sfx('sun');
    if (S.tut) S.tut.sun = true;
    return;
  }
  if (S.selected === 'dart') { throwDart(x, y); return; }
  const cell = cellAt(x, y);
  S.hover = e.pointerType === 'mouse' ? cell : null;
  if (!cell || !S.selected) return;
  const { r, c } = cell;
  if (S.selected === 'shovel') {
    if (S.plants[r][c]) {
      S.plants[r][c] = null;
      S.fx.push({ type: 'plant', x: cellCX(c), y: cellCY(r) + 28, t: 0, dur: 0.4 });
      sfx('plant');
    }
    S.selected = null;
    return;
  }
  const k = S.selected, d = PLANTS[k];
  const free = !!CFG.conveyor;
  if (CFG.bowling && c > 2) { sfx('cant'); floatText(cellCX(c), cellCY(r), '放在红线左边', '#fff3d1', 18); return; }
  if (!d.special && (S.plants[r][c] || S.graves[r][c])) { sfx('cant'); return; }
  if (S.craters[r][c] > 0) { sfx('cant'); floatText(cellCX(c), cellCY(r), '坑还没填好', '#fff3d1', 16); return; }
  if (!free && S.sun < d.cost) { nope(); S.selected = null; return; }
  if (d.special) S.rollers.push({ row: r, x: cellCX(c), y: cellCY(r) + 20, kind: k, spin: 0, hits: 0, dir: 0, last: null });
  else S.plants[r][c] = makePlant(k);
  if (free) { S.belt = S.belt.filter(i => i.id !== S.selBelt); S.selBelt = null; beltDirty = true; }
  else { S.sun -= d.cost; S.cd[k] = d.cd; }
  S.selected = null;
  S.fx.push({ type: 'plant', x: cellCX(c), y: cellCY(r) + 28, t: 0, dur: 0.4 });
  S.fx.push({ type: 'ring', x: cellCX(c), y: cellCY(r) + 20, t: 0, dur: 0.4, color: '#ff9ec0' });
  for (let i = 0; i < 8; i++) part({ x: cellCX(c) + rnd(-20, 20), y: cellCY(r) + 30, vx: rnd(-90, 90), vy: rnd(-200, -80), life: 0.5, size: rnd(2, 4), color: i % 2 ? '#ffb3c7' : '#fff0f5', shape: 'sparkle', ground: cellCY(r) + 34 });
  sfx('plant');
});
cv.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse' || !S) return;
  const { x, y } = toWorld(e);
  S.hover = cellAt(x, y);
});
cv.addEventListener('pointerleave', () => { if (S) S.hover = null; });
cv.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('keydown', e => {
  if (!running || S.over || S.demo) return;
  if (e.key === ' ') { e.preventDefault(); setPaused(!paused); return; }
  if (paused) return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= S.deck.length) selectCard(S.deck[n - 1]);
  else if (e.key === 's' || e.key === 'S') shovelBtn.click();
  else if (e.key === 'Escape') S.selected = null;
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden && running && !paused && !S.over && !S.demo) setPaused(true);
});
// 禁止双击和双指缩放：连续两次轻点时拦下第二次的默认缩放，按钮照常响应
let lastTouchEnd = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - lastTouchEnd < 350) {
    e.preventDefault();
    const b = e.target.closest && e.target.closest('button');
    if (b && !b.disabled) b.click();
  }
  lastTouchEnd = now;
}, { passive: false });
document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
for (const ev of ['gesturestart', 'gesturechange']) document.addEventListener(ev, e => e.preventDefault(), { passive: false });
document.addEventListener('touchmove', e => { if (e.touches.length > 1 || !e.target.closest('.panel, .menu, #bank')) e.preventDefault(); }, { passive: false });

/* ================= 尺寸与主循环 ================= */
function fit() {
  // 用布局尺寸（不受旋转影响）
  const r = { width: stage.clientWidth, height: stage.clientHeight };
  const scale = Math.max(0.1, Math.min(r.width / W, r.height / H));
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  cv.style.width = Math.floor(W * scale) + 'px';
  cv.style.height = Math.floor(H * scale) + 'px';
  cv.width = Math.round(W * scale * dpr);
  cv.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
new ResizeObserver(fit).observe(stage);
// 把真实可见区域写进 CSS 变量，竖屏旋转时用它定尺寸（iPhone 上 dvh 在主屏幕 App 里不可靠）
function measureScreen() {
  const w = document.body.clientWidth || window.innerWidth, h = document.body.clientHeight || window.innerHeight;
  document.documentElement.style.setProperty('--scr-w', w + 'px');
  document.documentElement.style.setProperty('--scr-h', h + 'px');
}
measureScreen();
window.addEventListener('resize', measureScreen);
window.addEventListener('orientationchange', () => setTimeout(() => { measureScreen(); fit(); }, 200));
if (window.visualViewport) window.visualViewport.addEventListener('resize', measureScreen);

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (S.demo) update(dt);
  else if (running && !paused && !S.over) for (let i = 0; i < speed; i++) { update(dt); if (S.over) break; }
  else if (S.over) updateEffects(dt);
  draw();
  updateUI();
  requestAnimationFrame(frame);
}

showMenu();
fit();
if (document.fonts && document.fonts.load) document.fonts.load(`20px ${FONT}`).then(() => {}, () => {});
requestAnimationFrame(frame);

window.__pvz = { get S() { return S; }, get CFG() { return CFG; }, update, startGame, startFlow, advCfg, chalCfg, endlessCfg, luckyCfg, miniCfg, MINIGAMES, rollBox, showMenu, showLevels, showAlmanac, save: () => save, LEVELS };
})();
</script>

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
