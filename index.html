<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>别偷吃我的蛋糕</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap">
<style>
/* 布局：上方木质种子栏 + 下方餐桌画布；横屏矮屏时种子栏移到左侧。菜单、图鉴等界面浮在餐桌之上。单一甜美粉色画面，不跟随深色模式。 */
:root{
  --night:#fbe1ea;
  --wood:#f39ab5;
  --wood-dark:#e07898;
  --wood-edge:#b8577a;
  --paper:#fffaf4;
  --paper-dim:#ffe9ef;
  --ink:#5a3446;
  --sun:#ffd56a;
  --leaf:#6fcfa3;
  --leaf-dark:#3f9a74;
  --danger:#ff5a7a;
  --box:#b69cf0;
  --box-dark:#7a5fc0;
  --display:"ZCOOL KuaiLe","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  --body:-apple-system,"PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;overscroll-behavior:none}
[hidden]{display:none!important}
*{touch-action:manipulation}
body{
  position:fixed;inset:0;margin:0;
  background:var(--night);color:var(--paper);font:14px/1.45 var(--body);
  overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit}
/* 页面固定铺满可见区域（不随浏览器工具栏滚动），四周按刘海和横条留出安全区 */
#app{
  position:absolute;top:0;left:0;width:100%;height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;
  padding-top:max(8px,env(safe-area-inset-top,0px));
  padding-bottom:max(8px,env(safe-area-inset-bottom,0px));
  padding-left:max(8px,env(safe-area-inset-left,0px));
  padding-right:max(8px,env(safe-area-inset-right,0px));
}
#bank{
  flex:none;display:flex;align-items:stretch;gap:6px;
  background:var(--wood);border:3px solid var(--wood-edge);border-radius:10px;padding:6px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.18),0 3px 0 rgba(0,0,0,.35);
}
#sunbox{
  flex:none;width:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:var(--wood-dark);border-radius:7px;padding:4px 0;transition:background .15s;
}
#sunbox.nope{background:var(--danger)}
#sunIcon{width:30px;height:30px}
#sunNum{font-family:var(--display);font-size:18px;line-height:1;color:var(--paper);font-variant-numeric:tabular-nums}
#cards{display:flex;gap:5px;flex:1 1 auto;min-width:0}
.card,.tool{
  position:relative;overflow:hidden;border:2px solid var(--wood-edge);border-radius:7px;
  background:var(--paper);color:var(--ink);padding:0;cursor:pointer;
  transition:transform .12s,box-shadow .12s,filter .12s;
}
.card{flex:1 1 0;min-width:0;max-width:66px;height:66px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.card canvas{width:100%;max-width:46px;aspect-ratio:1;flex:1 1 auto;min-height:0;object-fit:contain}
.card .cost{font-family:var(--display);font-size:14px;line-height:1;padding:1px 0 4px;font-variant-numeric:tabular-nums}
.card .mask{position:absolute;left:0;right:0;top:0;height:0;background:rgba(20,14,6,.55);pointer-events:none}
.card.off{filter:brightness(.62) saturate(.7)}
.card.ready{animation:ready .5s ease-out}
@keyframes ready{0%{box-shadow:0 0 0 4px var(--sun)}100%{box-shadow:0 0 0 0 rgba(255,210,63,0)}}
.card.sel,.tool.sel{transform:translateY(-3px);box-shadow:0 0 0 3px #fff,0 4px 0 rgba(0,0,0,.4)}
.card:focus-visible,.tool:focus-visible,.btn:focus-visible,.mbtn:focus-visible,.chip:focus-visible,.tile:focus-visible,.lv:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
#tools{flex:none;display:flex;gap:5px;flex-wrap:wrap}
.tool.dart{flex-direction:column;justify-content:flex-end}
.tool.dart canvas{width:30px;height:30px}
.tool.dart .cost{font-family:var(--display);font-size:12px;line-height:1;padding-bottom:3px;color:var(--ink)}
.tool .mask{position:absolute;left:0;right:0;top:0;height:0;background:rgba(90,30,50,.45);pointer-events:none}
.tool.off{filter:brightness(.7) saturate(.6)}
.tool{width:44px;display:flex;align-items:center;justify-content:center}
#shovel canvas{width:36px;height:36px}
#side{display:flex;flex-direction:column;gap:5px}
#side .tool{width:40px;flex:1;font-family:var(--display);font-size:13px;background:var(--wood-dark);color:var(--paper);border-color:var(--wood-edge)}
#stage{flex:1 1 auto;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
#game{display:block;border-radius:8px;box-shadow:0 0 0 3px var(--wood-edge),0 6px 18px rgba(0,0,0,.45);touch-action:none}

/* 浮层 */
#overlay{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:rgba(150,60,95,.32);padding:10px max(10px,env(safe-area-inset-right,0px)) 10px max(10px,env(safe-area-inset-left,0px));box-sizing:border-box}
#overlay.soft{background:linear-gradient(rgba(255,240,245,.05),rgba(180,80,120,.35))}
.panel{
  max-width:430px;width:100%;max-height:100%;overflow:auto;box-sizing:border-box;
  background:var(--paper);color:var(--ink);border:4px solid var(--wood-edge);border-radius:14px;
  padding:16px 18px;box-shadow:0 6px 0 rgba(0,0,0,.35);display:flex;flex-direction:column;gap:10px;
}
.panel.wide{max-width:780px}
.panel h1{margin:0;font-family:var(--display);font-weight:400;font-size:32px;line-height:1.1;color:var(--leaf-dark);text-wrap:balance}
.panel h2{margin:0;font-family:var(--display);font-weight:400;font-size:22px;color:var(--wood-dark)}
.panel .sub{margin:0;font-family:var(--display);font-size:16px;color:var(--wood)}
.panel p{margin:0}
.panel ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:3px}
.phead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.btns{display:flex;gap:10px;flex-wrap:wrap;padding-top:4px}
.btn{
  font-family:var(--display);font-size:19px;padding:7px 20px;border-radius:10px;cursor:pointer;
  background:var(--leaf);color:#fff;border:3px solid var(--leaf-dark);box-shadow:0 3px 0 var(--leaf-dark);
}
.btn.alt{background:var(--wood);border-color:var(--wood-edge);box-shadow:0 3px 0 var(--wood-edge)}
.btn.small{font-size:15px;padding:4px 12px}
.btn:disabled{filter:grayscale(1) brightness(.85);cursor:not-allowed}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--leaf-dark)}
.reward{display:flex;align-items:center;gap:12px;background:var(--paper-dim);border-radius:10px;padding:8px 12px}
.reward canvas{width:64px;height:64px;flex:none}
.reward b{font-family:var(--display);font-weight:400;font-size:20px;color:var(--leaf-dark)}

/* 主菜单 */
.menu{display:grid;gap:14px;justify-items:center;align-items:center;max-height:100%;overflow:auto;padding:4px}
.logo{display:flex;flex-direction:column;align-items:center;line-height:1}
.logo .l1{font-family:var(--display);font-size:clamp(40px,9vw,70px);color:#fffaf4;-webkit-text-stroke:2px var(--wood-edge);text-shadow:0 5px 0 var(--wood-edge),0 10px 18px rgba(0,0,0,.4);letter-spacing:.04em}
.logo small{margin-top:8px;font-family:var(--display);font-size:16px;color:var(--paper);background:var(--wood-dark);border:2px solid var(--wood-edge);border-radius:999px;padding:2px 12px;letter-spacing:.08em}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:min(440px,100%)}
.mbtn{
  display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;cursor:pointer;
  background:var(--wood);color:var(--paper);border:3px solid var(--wood-edge);border-radius:12px;
  padding:10px 14px;box-shadow:inset 0 2px 0 rgba(255,255,255,.18),0 4px 0 var(--wood-edge);
}
.mbtn b{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.1}
.mbtn span{font-size:12px;opacity:.85}
.mbtn:active{transform:translateY(2px);box-shadow:inset 0 2px 0 rgba(255,255,255,.18),0 2px 0 var(--wood-edge)}
.mbtn.main{grid-column:1/-1;background:var(--leaf);border-color:var(--leaf-dark);box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 4px 0 var(--leaf-dark)}
.mbtn.lucky{background:var(--box);border-color:var(--box-dark);box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 4px 0 var(--box-dark)}
.rar{color:var(--wood-dark);font-weight:700;border-bottom:3px solid var(--rar)}
.mfoot{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{cursor:pointer;font-size:13px;padding:4px 12px;border-radius:999px;background:var(--wood-dark);border:2px solid var(--wood-edge);color:var(--paper)}
#tutSkip{position:absolute;right:10px;bottom:10px;z-index:3}
.tut-glow{animation:tutglow 1s ease-in-out infinite;position:relative;z-index:2}
@keyframes tutglow{0%,100%{box-shadow:0 0 0 3px #ffd56a,0 0 14px 4px rgba(255,214,90,.8)}50%{box-shadow:0 0 0 6px #ffd56a,0 0 22px 10px rgba(255,214,90,.9)}}
.chip.warn{background:var(--danger);border-color:#7d0f1b}
@media (orientation:landscape) and (min-width:600px), (orientation:portrait) and (max-width:600px){
  .menu{grid-template-columns:auto minmax(0,440px);column-gap:36px}
  .mfoot{grid-column:1/-1}
}

/* 关卡与挑战 */
.lvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.lv{
  position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;cursor:pointer;
  background:#fff;border:3px solid var(--wood);border-radius:10px;padding:8px 10px;color:var(--ink);
}
.lv b{font-family:var(--display);font-weight:400;font-size:20px;color:var(--leaf-dark);line-height:1}
.lv .nm{font-size:13px;font-weight:600}
.lv .ft{font-size:11px;color:#5b3a8a;background:#efe6ff;border-radius:6px;padding:1px 6px}
.panel h2 + .sub{margin-top:-6px}
.card.belt .cost{font-size:12px;color:var(--leaf-dark)}
.belt-empty{grid-column:1/-1;align-self:center;font-family:var(--display);font-size:13px;color:var(--paper);opacity:.8;padding:4px 8px}
.lv .rw{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--wood)}
.lv .rw canvas{width:28px;height:28px}
.lv .st{position:absolute;top:6px;right:8px;font-family:var(--display);font-size:13px;color:var(--leaf)}
.lv.locked{background:var(--paper-dim);border-color:#c7b38a;color:#8b7a5c;cursor:not-allowed}
.lv.locked b{color:#8b7a5c}
.lv.done{border-color:var(--leaf)}

/* 选卡 */
.guide-sec{display:flex;flex-direction:column;gap:6px}
.guide-sec h2{font-size:19px}
.guide-sec ul{font-size:13px}
.role-legend{display:flex;flex-wrap:wrap;gap:6px}
.role-chip{font-size:12px;font-weight:700;color:var(--ink);background:#fff;border:2px solid var(--rc);border-bottom-width:5px;border-radius:8px;padding:2px 10px}
.chip.hot{background:var(--sun);color:var(--ink);border-color:#c9902a}
.intel{display:flex;flex-direction:column;gap:6px;background:var(--paper-dim);border-radius:12px;padding:10px 12px}
.intel h2{font-size:18px}
.intel-row{display:flex;align-items:center;gap:10px;min-width:0}
.intel-row > canvas{width:46px;height:46px;flex:none;background:#fff;border-radius:10px}
.intel-txt{display:flex;flex-direction:column;min-width:0;flex:1}
.intel-txt b{font-size:14px;color:var(--ink)}
.intel-txt span{font-size:12px;color:#8a5a6e}
.intel-ctr{display:flex;align-items:center;gap:4px;flex:none}
.intel-ctr small{font-size:11px;color:var(--wood-edge);margin-right:2px}
.intel-ctr canvas{width:30px;height:30px;background:#fff;border-radius:8px}
.tile .rec{position:absolute;top:-6px;right:-6px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;border-radius:999px;padding:1px 6px;border:2px solid #fff}
.slots{display:flex;gap:6px;flex-wrap:wrap;min-height:60px;background:var(--wood);border-radius:10px;padding:6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.tile{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:0;cursor:pointer;
  background:#fff;border:2px solid var(--wood);border-radius:9px;padding:4px 2px 3px;color:var(--ink);
}
.tile canvas{width:52px;height:52px}
.tile .tn{font-size:11px;line-height:1.2;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tile.on{border-color:var(--leaf);box-shadow:0 0 0 2px var(--leaf)}
.tile.used{opacity:.35}
.tile.cur{border-color:var(--sun);box-shadow:0 0 0 3px var(--sun)}
.slots .tile{width:56px;background:var(--paper)}
.slots .tile canvas{width:44px;height:44px}

/* 图鉴 */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{cursor:pointer;font-family:var(--display);font-size:16px;padding:4px 14px;border-radius:999px;border:2px solid var(--wood);background:transparent;color:var(--wood-dark)}
.tab.on{background:var(--wood);color:var(--paper)}
.alm{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:620px){.alm{grid-template-columns:minmax(0,1fr)}}
.detail{background:var(--paper-dim);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.detail .dtop{display:flex;gap:12px;align-items:center}
.detail canvas{width:96px;height:96px;flex:none;background:#fff8e4;border-radius:10px;border:2px solid var(--wood)}
.detail h3{margin:0;font-family:var(--display);font-weight:400;font-size:22px;color:var(--leaf-dark)}
.detail .tag{font-size:12px;color:var(--wood)}
.detail .stat{font-size:13px;font-weight:600}
.detail .lore{font-size:13px;color:#5b4a35}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.ach{display:flex;gap:10px;align-items:center;background:#fff;border:2px solid var(--wood);border-radius:10px;padding:8px 10px}
.ach .medal{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:16px;background:#d9c9a3;color:#8b7a5c;border:2px solid #b8a27a}
.ach.got .medal{background:var(--sun);color:var(--wood-edge);border-color:#c98a00}
.ach b{display:block;font-size:14px}
.ach span{font-size:12px;color:#6b5a40}
.ach:not(.got){opacity:.7}

#toast{
  position:absolute;left:50%;top:max(12px,env(safe-area-inset-top,0px));transform:translate(-50%,-140%);z-index:9;
  background:var(--wood-dark);color:var(--paper);border:3px solid var(--sun);border-radius:12px;
  padding:6px 16px;font-family:var(--display);font-size:16px;white-space:normal;text-align:center;max-width:min(560px,86%);line-height:1.35;transition:transform .35s cubic-bezier(.2,1.4,.4,1),opacity .2s;pointer-events:none;opacity:0;
}
#toast.show{transform:translate(-50%,0);opacity:1}
/* 竖着拿手机：整个游戏旋转 90° 横过来铺满屏幕 */
@media (orientation:portrait) and (max-width:600px){
  /* --scr-w/--scr-h 由脚本按真实可见区域写入；旋转后内容的上/右/下/左对应屏幕的右/下/左/上 */
  #app{
    width:var(--scr-h,100dvh);height:var(--scr-w,100dvw);
    transform-origin:top left;transform:translateX(var(--scr-w,100vw)) rotate(90deg);
    padding-left:max(8px,env(safe-area-inset-top,0px));
    padding-right:max(8px,env(safe-area-inset-bottom,0px));
    padding-top:max(8px,env(safe-area-inset-right,0px));
    padding-bottom:max(8px,env(safe-area-inset-left,0px));
  }
  #overlay{
    padding:max(10px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px)) max(10px,env(safe-area-inset-top,0px));
  }
  #toast{top:max(12px,env(safe-area-inset-right,0px))}
}
/* 横屏手机（以及旋转后的竖屏）：种子栏竖到左侧 */
@media (orientation:landscape) and (max-height:520px), (orientation:portrait) and (max-width:600px){
  #app{flex-direction:row}
  #bank{flex-direction:column;width:132px;box-sizing:border-box;overflow-y:auto}
  #sunbox{width:auto;flex-direction:row;gap:6px;padding:3px 0}
  #cards{display:grid;grid-template-columns:1fr 1fr;flex:none}
  .card{max-width:none;height:54px}
  .card canvas{max-width:36px}
  #tools{justify-content:space-between}
  #side{flex-direction:row}
  #shovel{width:34px;height:40px;flex:none}
  #shovel canvas{width:30px;height:30px}
  #side .tool{width:34px;height:40px;flex:none}
  .logo .l1{font-size:52px}
}

/* ================= 皮肤：对局栏、弹出面板、按钮（奶油 + 草莓粉，白色描边） ================= */
#bank{background:linear-gradient(180deg,#ffb7cf,#f490b3);border:3px solid #fff;border-radius:16px;box-shadow:0 0 0 2px #e27fa2,0 4px 0 2px #c2607e}
#sunbox{background:radial-gradient(circle at 50% 35%,#fffaf0,#ffe6b0);border:2px solid #fff;box-shadow:0 0 0 2px #e8b64a;border-radius:12px}
#sunNum{color:#b0701a}
.card,.tool{border:2px solid #fff;box-shadow:0 0 0 2px #e48aa9;border-radius:11px}
.card{background:linear-gradient(#fffdf9,#ffeef4)}
.card.tg-gold:not(.sel){box-shadow:0 0 0 2px #e8b64a,0 0 9px rgba(232,182,74,.85);background:linear-gradient(#fffaf0,#fff0c4)}
.card.tg-flash:not(.sel){box-shadow:0 0 0 2px #b48cff,0 0 9px rgba(180,140,255,.85);background:linear-gradient(135deg,#fff,#f3e8ff,#e6f7ff,#fff0f6)}
.card.sel,.tool.sel{box-shadow:0 0 0 3px #fff,0 0 0 5px #ff6fa0,0 5px 0 3px rgba(160,50,90,.35)}
#side .tool{background:linear-gradient(#ffa3c4,#e8789f);border:2px solid #fff;box-shadow:0 0 0 2px #c2607e;color:#fff}
#game{border-radius:12px;box-shadow:0 0 0 3px #fff,0 0 0 6px #f0a3bd,0 8px 22px rgba(160,60,100,.35)}
.panel{background:linear-gradient(#fffaf4,#fff1f6);border:4px solid #fff;border-radius:24px;box-shadow:0 0 0 3px #f3a6bf,0 7px 0 3px #c2607e,0 16px 36px rgba(120,40,75,.3)}
.panel h1{color:#d0567f}
.panel .sub{color:#e0789c}
.btn{background:linear-gradient(#ffb3cd,#f47aa3);border:2px solid #fff;border-radius:999px;color:#fff;text-shadow:0 1px 0 #c2607e;box-shadow:0 0 0 2px #e77ca0,0 4px 0 2px #c2607e;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.btn.alt{background:linear-gradient(#fff,#ffe9f1);color:#c2507a;text-shadow:none;border-color:#fff;box-shadow:0 0 0 2px #f3b3c8,0 4px 0 2px #e48aa9}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 2px #e77ca0,0 1px 0 2px #c2607e}
.btn.alt:active:not(:disabled){box-shadow:0 0 0 2px #f3b3c8,0 1px 0 2px #e48aa9}
.btn.gem{background:linear-gradient(#d3b4ff,#9b6df0);box-shadow:0 0 0 2px #9b6df0,0 4px 0 2px #6a3fc0;text-shadow:0 1px 0 #6a3fc0}
.btn.gold{background:linear-gradient(#ffe08a,#e8a93a);box-shadow:0 0 0 2px #d99a2b,0 4px 0 2px #a8701c;text-shadow:0 1px 0 #a8701c}
.chip{background:linear-gradient(#ffa3c4,#e8789f);border:2px solid #fff;box-shadow:0 0 0 1.5px #c2607e;color:#fff}
.chip.hot{background:linear-gradient(#ffe08a,#f2b84a);color:#7a4a10;box-shadow:0 0 0 1.5px #c98a2b}
.chip.light{background:#fff;color:#c2507a;border-color:#fff;box-shadow:0 0 0 2px #f3b3c8}
.sheet .intel{background:none;padding:0}
.pbody.flexcol{display:flex;flex-direction:column;overflow:hidden}
.pbody.flexcol > .deck,.pbody.flexcol > .gacha,.pbody.flexcol > .modes{flex:1 1 auto;min-height:0;height:auto}
.tab{border-color:#fff;box-shadow:0 0 0 2px #f3b3c8;color:#c2507a;background:#fff}
.tab.on{background:linear-gradient(#ffb3cd,#f47aa3);color:#fff}
.tile{border-color:#fff;box-shadow:0 0 0 2px #f6c0d3}
.tile.on,.tile.cur{box-shadow:0 0 0 3px #ff86b0}

/* ================= 层级界面：主页 → 子页面 → 弹窗 ================= */
/* 页面铺满浮层：背景图铺到屏幕边缘，内容留在安全区里。尺寸用 --ah（游戏区域高度，竖屏旋转后也正确），不用 vh/vw */
#overlay.scene{background:var(--scene-bg) center/cover no-repeat,#fbe1ea;align-items:stretch;justify-content:center}
.hub,.page{width:100%;max-width:1180px;height:100%;min-height:0;display:flex;flex-direction:column;gap:6px;color:var(--ink);animation:pagein .3s cubic-bezier(.2,.9,.25,1)}
@keyframes pagein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.grow{flex:1 1 auto}
.ico{display:inline-block;flex:none;background:center/contain no-repeat;vertical-align:middle}
.ico.coin{background-image:url(img/ico_coin.webp)}
.ico.gem{background-image:url(img/ico_gem.webp)}
.ico.album{background-image:url(img/ico_album.webp)}
.ico.capsule{background-image:url(img/ico_capsule.webp)}
.ico.bag{background-image:url(img/ico_bag.webp)}
.ico.tasks{background-image:url(img/ico_tasks.webp)}
.ico.gift{background-image:url(img/ico_gift.webp)}
.ico.gear{background-image:url(img/ico_gear.webp)}
.ico.medal{border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c9,#ffd56a 45%,#e8a93a);box-shadow:inset 0 -3px 0 #c98a2b,0 0 0 3px #fff;display:inline-grid;place-items:center;color:#fff;font:700 20px/1 var(--body);text-shadow:0 1px 0 #c98a2b}
.ico.medal::before{content:"★"}
.ico.cv{background:none;display:inline-grid;place-items:center}
.ico.cv canvas{width:100%;height:100%}

/* 顶栏：货币 + 设置 */
.topbar,.pbar{display:flex;align-items:center;gap:8px;flex:none;min-height:40px}
.pill{position:relative;display:flex;align-items:center;gap:4px;height:32px;padding:0 4px 0 2px;border-radius:999px;background:rgba(255,250,244,.94);border:2px solid #fff;box-shadow:0 0 0 2px #f3b3c8,0 3px 0 2px rgba(194,96,126,.35);color:var(--ink);font:400 16px/1 var(--display);cursor:pointer;font-variant-numeric:tabular-nums;min-width:86px}
.pill .ico{width:28px;height:28px;margin-left:-6px;filter:drop-shadow(0 2px 0 rgba(194,96,126,.35))}
.pill b{font-weight:400;flex:1;text-align:center;padding:0 2px}
.pill .plus{width:20px;height:20px;border-radius:50%;background:linear-gradient(#ffb8d0,#ff86b0);color:#fff;font:700 16px/20px var(--body);text-align:center;box-shadow:inset 0 -2px 0 rgba(160,50,90,.25)}
.rbtn{position:relative;width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;background:rgba(255,250,244,.94);border:2px solid #fff;box-shadow:0 0 0 2px #f3b3c8,0 3px 0 2px rgba(194,96,126,.35);cursor:pointer;padding:0}
.rbtn .ico{width:28px;height:28px}
.back{height:34px;flex:none;padding:0 14px 0 10px;border-radius:999px;border:2px solid #fff;background:linear-gradient(#ffb8d0,#ff86b0);color:#fff;font:400 17px/1 var(--display);box-shadow:0 0 0 2px #e77ca0,0 3px 0 2px #c2607e;cursor:pointer;text-shadow:0 1px 0 #c2607e}
.back:active,.pill:active,.rbtn:active{transform:translateY(2px)}
.ptitle{margin:0;font:400 clamp(20px,calc(var(--ah,500px)*.062),30px)/1 var(--display);color:#fff;-webkit-text-stroke:1.5px #c2607e;text-shadow:0 3px 0 #c2607e,0 5px 10px rgba(160,60,100,.3);letter-spacing:.03em;white-space:nowrap}
.pbody{flex:1 1 auto;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:4px 4px 10px}
.sheet{background:rgba(255,250,244,.95);border:3px solid #fff;border-radius:18px;box-shadow:0 0 0 2px #f6c0d3,0 5px 0 2px rgba(194,96,126,.3);padding:12px 14px;color:var(--ink)}
.sheet h2{margin:0 0 6px;font:400 19px/1.2 var(--display);color:#d0567f}
.sheet p{margin:0}
.muted{color:#9a6a7e;font-size:12px}
.dot{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;box-sizing:border-box;border-radius:999px;background:#ff4f7b;border:2px solid #fff;color:#fff;font:700 11px/14px var(--body);text-align:center;padding:0 4px;animation:dotpop 1.8s ease-in-out infinite;z-index:2}
@keyframes dotpop{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}

/* 主页 */
.hub-main{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(270px,410px);gap:14px;align-items:stretch}
.hub-logo{display:flex;flex-direction:column;align-items:flex-start;padding:2px 0 0 6px}
.logo2{font:400 clamp(30px,min(calc(var(--ah,500px)*.13),calc(var(--aw,900px)*.066)),68px)/1.02 var(--display);white-space:nowrap;color:#fff;letter-spacing:.02em;-webkit-text-stroke:2px #c2607e;text-shadow:0 4px 0 #c2607e,0 9px 18px rgba(160,60,100,.35);transform:rotate(-4deg);transform-origin:left center;animation:logobob 3.6s ease-in-out infinite}
.logo2 em{font-style:normal;color:#ffd56a}
@keyframes logobob{0%,100%{transform:rotate(-4deg) translateY(0)}50%{transform:rotate(-3deg) translateY(-3px)}}
.hub-sub{margin-top:12px;font:400 14px/1 var(--display);color:#fff;background:linear-gradient(#ffa9c6,#f37aa2);border:2px solid #fff;border-radius:999px;padding:5px 14px;box-shadow:0 3px 0 #c2607e;letter-spacing:.06em}
.hub-menu{display:flex;flex-direction:column;justify-content:center;gap:8px;min-height:0}
.cta{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:22px;border:3px solid #fff;background:linear-gradient(135deg,#ffa3c4,#f46f9d 70%,#ee5f90);color:#fff;box-shadow:0 0 0 2px #e77ca0,0 6px 0 2px #c2607e,0 12px 22px rgba(194,96,126,.35);cursor:pointer;text-align:left;font:inherit}
.cta::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-18deg);animation:ctashine 3.2s ease-in-out infinite}
@keyframes ctashine{0%,55%{left:-60%}100%{left:130%}}
.cta canvas{width:58px;height:58px;flex:none;background:rgba(255,255,255,.4);border-radius:16px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.7)}
.cta b{display:block;font:400 clamp(22px,calc(var(--ah,500px)*.065),30px)/1 var(--display);text-shadow:0 2px 0 #c2607e}
.cta small{display:block;margin-top:4px;font-size:12px;opacity:.96}
.cta .go{margin-left:auto;flex:none;font:400 18px/1 var(--display);background:#fff;color:#ee5f90;border-radius:999px;padding:8px 16px;box-shadow:0 3px 0 #e77ca0}
.cta:active{transform:translateY(3px);box-shadow:0 0 0 2px #e77ca0,0 3px 0 2px #c2607e}
.hub-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mtile{position:relative;display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:18px;border:3px solid #fff;color:var(--ink);background:rgba(255,250,244,.95);box-shadow:0 0 0 2px var(--tc,#f3b3c8),0 4px 0 2px var(--tcd,#e48aa9);cursor:pointer;text-align:left;min-width:0;font:inherit}
.mtile .ico{width:40px;height:40px;filter:drop-shadow(0 2px 0 rgba(194,96,126,.3))}
.mtile b{display:block;font:400 18px/1.1 var(--display);color:var(--tcd,#d0567f)}
.mtile small{display:block;font-size:11px;color:#8a5a6e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtile > span{min-width:0}
.mtile:active{transform:translateY(3px);box-shadow:0 0 0 2px var(--tc,#f3b3c8),0 1px 0 2px var(--tcd,#e48aa9)}
.dock{flex:none;display:flex;gap:6px;align-items:flex-end}
.dbtn{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;width:66px;white-space:nowrap;cursor:pointer;background:none;border:0;padding:0;color:#fff;font:400 13px/1 var(--display);text-shadow:0 1px 0 #c2607e,0 0 5px rgba(194,96,126,.9)}
.dbtn .ico{width:44px;height:44px;filter:drop-shadow(0 3px 0 rgba(194,96,126,.45))}
.dbtn:active .ico{transform:translateY(2px)}
.hub-ver{margin-left:auto;align-self:flex-end;font-size:11px;color:#fff;opacity:.85;text-shadow:0 1px 2px rgba(194,96,126,.9)}

/* 关卡地图 */
.lmap::-webkit-scrollbar{display:none}
.lmap{scrollbar-width:none;position:relative;flex:1 1 auto;min-height:0;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border-radius:18px}
.lmap-in{position:relative;height:100%;min-height:230px}
.lmap svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.lnode{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:0;cursor:pointer;color:var(--ink);font:inherit}
.lnode .disc{position:relative;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff,#ffe6ef 60%,#ffd0e1);border:4px solid #fff;box-shadow:0 0 0 3px #f3a6bf,0 5px 0 3px #d77799;font:400 20px/1 var(--display);color:#d0567f}
.lnode.done .disc{box-shadow:0 0 0 3px #7fd6ae,0 5px 0 3px #3f9a74;color:#3f9a74;background:radial-gradient(circle at 35% 30%,#fff,#e5fbf1 60%,#c9f2df)}
.lnode.cur .disc{width:74px;height:74px;font-size:24px;color:#fff;background:radial-gradient(circle at 35% 30%,#ffc2d8,#ff86b0 60%,#ee5f90);box-shadow:0 0 0 3px #fff,0 6px 0 3px #c2607e,0 0 0 10px rgba(255,158,192,.35);animation:curpulse 1.4s ease-in-out infinite}
@keyframes curpulse{0%,100%{box-shadow:0 0 0 3px #fff,0 6px 0 3px #c2607e,0 0 0 6px rgba(255,158,192,.45)}50%{box-shadow:0 0 0 3px #fff,0 6px 0 3px #c2607e,0 0 0 16px rgba(255,158,192,0)}}
.lnode:disabled{cursor:not-allowed}
.lnode:disabled .disc{filter:grayscale(.9) brightness(1.02);color:#a59aa0;box-shadow:0 0 0 3px #d9cfd3,0 5px 0 3px #b9adb2}
.lnode .lname{font:400 13px/1 var(--display);background:rgba(255,250,244,.95);border:2px solid #fff;box-shadow:0 0 0 2px #f3b3c8;border-radius:999px;padding:3px 9px;white-space:nowrap;color:#b24d73}
.lnode .rwb{position:absolute;top:-22px;right:-18px;width:34px;height:34px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px #ffd56a,0 2px 0 2px #e8a93a;display:grid;place-items:center}
.lnode .rwb canvas{width:30px;height:30px}
.lnode .ok{position:absolute;bottom:-4px;right:-6px;width:22px;height:22px;border-radius:50%;background:#7fd6ae;color:#fff;border:2px solid #fff;font:700 13px/18px var(--body);text-align:center}
.lnode .lock{position:absolute;inset:0;display:grid;place-items:center;font-size:20px}
.chap{position:absolute;left:14px;top:10px;font:400 15px/1 var(--display);color:#fff;background:linear-gradient(#ffa9c6,#f37aa2);border:2px solid #fff;border-radius:999px;padding:5px 12px;box-shadow:0 3px 0 #c2607e;white-space:nowrap}

/* 玩法、列表 */
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;height:100%;min-height:200px}
.mode{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-radius:22px;border:3px solid #fff;padding:12px;cursor:pointer;color:#fff;font:inherit;box-shadow:0 0 0 2px var(--mc2),0 6px 0 2px var(--mc3);background:linear-gradient(160deg,var(--mc1),var(--mc2))}
.mode canvas{width:84px;height:84px;background:rgba(255,255,255,.35);border-radius:22px}
.mode b{font:400 24px/1 var(--display);text-shadow:0 2px 0 var(--mc3)}
.mode small{font-size:12px;text-align:center;opacity:.95}
.mode:active{transform:translateY(3px)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.litem{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;cursor:pointer;font:inherit;color:var(--ink);background:rgba(255,250,244,.96);border:3px solid #fff;border-radius:18px;padding:10px 12px;box-shadow:0 0 0 2px #f3b3c8,0 4px 0 2px #e48aa9}
.litem b{font:400 20px/1.1 var(--display);color:#d0567f}
.litem span{font-size:12px;color:#7a5566}
.litem .st{position:absolute;top:8px;right:10px;font:400 13px/1 var(--display);color:#fff;background:#7fd6ae;border-radius:999px;padding:3px 8px}
.litem:active{transform:translateY(3px)}

/* 选小伙伴 */
.deck{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.25fr);gap:10px;height:100%;min-height:0}
.deck > .sheet{min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.deck-r{display:flex;flex-direction:column;gap:8px}
.deck .slots{background:linear-gradient(#ffb8d0,#f58fb2);border:2px solid #fff;box-shadow:0 0 0 2px #e77ca0;border-radius:14px}
.deck .tiles{grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:6px}
.tile.tg-gold{border-color:#e8b64a;box-shadow:0 0 0 2px #ffe7a1,0 0 10px rgba(232,182,74,.7);background:linear-gradient(#fffaf0,#fff1c9)}
.tile.tg-flash{border-color:#c9a3ff;box-shadow:0 0 0 2px #e9d8ff,0 0 10px rgba(201,163,255,.7);background:linear-gradient(135deg,#fff,#f3e8ff,#e6f7ff,#fff0f6)}
.tile .tgb{position:absolute;top:-6px;left:-6px;font:700 9px/1 var(--body);color:#fff;border-radius:999px;padding:3px 5px;border:2px solid #fff}
.tile.tg-gold .tgb{background:linear-gradient(#ffd56a,#e8a93a)}
.tile.tg-flash .tgb{background:linear-gradient(90deg,#ff9ec0,#b48cff,#7fd3ff)}
.startbar{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:4px}
.btn.big{font-size:22px;padding:9px 30px;margin-left:auto}

/* 卡片：普通 / 闪卡 / 金卡 */
.pcard{--cw:110px;position:relative;width:var(--cw);aspect-ratio:2/3;flex:none;border-radius:calc(var(--cw)*.08);color:var(--ink);-webkit-user-select:none;user-select:none}
.pcard.t-base{background:linear-gradient(160deg,#fff,#ffeaf2);border:calc(var(--cw)*.03) solid #fff;box-shadow:0 0 0 2px #f3b3c8,0 3px 0 2px rgba(194,96,126,.3);box-sizing:border-box}
.pcard.t-gold{background:url(img/card_gold.webp) center/100% 100% no-repeat;filter:drop-shadow(0 4px 7px rgba(201,138,43,.5))}
.pcard.t-flash{background:url(img/card_flash.webp) center/100% 100% no-repeat;filter:drop-shadow(0 4px 7px rgba(180,120,255,.45))}
.pc-in{position:absolute;overflow:hidden;border-radius:calc(var(--cw)*.07);display:flex;flex-direction:column;align-items:center}
.t-base .pc-in{inset:5%}
.t-gold .pc-in{left:9.6%;right:9.6%;top:14%;bottom:10.6%}
.t-flash .pc-in{left:7.6%;right:7.6%;top:7%;bottom:7%}
.pc-glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,#fff 0%,#ffe6ef 50%,#ffd3e3 100%)}
.t-gold .pc-glow{background:repeating-conic-gradient(from 0deg at 50% 42%,rgba(255,255,255,.45) 0 8deg,transparent 8deg 22deg),radial-gradient(circle at 50% 42%,#fffdf0 0%,#ffe9ad 50%,#f4c967 100%)}
.t-flash .pc-glow{background:radial-gradient(circle at 50% 40%,#fff 0%,#eaf7ff 30%,#f3e4ff 60%,#ffe1ef 100%)}
.pc-art{position:relative;width:118%;max-width:none;height:auto;aspect-ratio:1;margin-top:-4%;flex:none}
.pc-name{position:absolute;left:5%;right:5%;bottom:5%;text-align:center;font:400 calc(var(--cw)*.115)/1.25 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:999px;padding:1px 4px;background:rgba(255,255,255,.85);color:#c2507a;box-shadow:0 0 0 1px #f3b3c8}
.t-gold .pc-name{background:linear-gradient(#fff6d6,#f6d27a);color:#8a5a12;box-shadow:0 0 0 1px #d9a441,inset 0 1px 0 #fff}
.t-flash .pc-name{background:linear-gradient(90deg,#ffe3ef,#efe2ff,#e0f4ff);color:#8a4fc7;box-shadow:0 0 0 1px #d4b6ff}
.pc-no{position:absolute;left:6%;top:4%;font:700 calc(var(--cw)*.07)/1 var(--body);color:#c98aa3;letter-spacing:.04em}
.t-gold .pc-no{color:#b07a20}
.t-flash .pc-no{color:#9a74d6}
.pc-tier{position:absolute;right:5%;top:3.5%;font:400 calc(var(--cw)*.085)/1 var(--display);color:#fff;border-radius:999px;padding:2px 6px}
.t-gold .pc-tier{background:linear-gradient(#ffd56a,#d99a2b);text-shadow:0 1px 0 #a8701c}
.t-flash .pc-tier{background:linear-gradient(90deg,#ff9ec0,#b48cff,#7fd3ff);text-shadow:0 1px 0 #8a5ac0}
.pc-sheen{position:absolute;inset:0;pointer-events:none;border-radius:inherit}
.t-flash .pc-sheen{background:linear-gradient(115deg,transparent 22%,rgba(255,140,190,.5) 34%,rgba(255,236,120,.5) 42%,rgba(140,240,200,.5) 50%,rgba(120,200,255,.5) 58%,rgba(200,150,255,.5) 66%,transparent 78%);background-size:300% 100%;mix-blend-mode:overlay;animation:holo 3.4s linear infinite}
.t-gold .pc-sheen{background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.8) 48%,rgba(255,236,180,.55) 53%,transparent 63%);background-size:280% 100%;animation:glint 3s ease-in-out infinite}
@keyframes holo{from{background-position:120% 0}to{background-position:-120% 0}}
@keyframes glint{0%,30%{background-position:130% 0}100%{background-position:-130% 0}}
.pc-spark{position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(circle,#fff 0 1.4px,transparent 2.4px) 16% 20%/12px 12px no-repeat,
  radial-gradient(circle,#fff 0 1.4px,transparent 2.4px) 82% 34%/12px 12px no-repeat,
  radial-gradient(circle,#fff 0 1.8px,transparent 2.8px) 26% 70%/12px 12px no-repeat,
  radial-gradient(circle,#fff 0 1.2px,transparent 2.2px) 74% 78%/12px 12px no-repeat,
  radial-gradient(circle,#fff 0 1.6px,transparent 2.6px) 50% 12%/12px 12px no-repeat;animation:twinkle 1.6s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.2}to{opacity:1}}
.pcard.dim > *{filter:grayscale(.85) brightness(.95);opacity:.75}
.pcard.dim{filter:grayscale(.6)}
.pcard .lockmark.pv{top:20%;font-size:calc(var(--cw)*.075);background:rgba(194,96,126,.82)}
.pcard .lockmark{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);font:400 calc(var(--cw)*.11)/1.2 var(--display);color:#fff;background:rgba(120,70,95,.72);border-radius:999px;padding:3px 10px;white-space:nowrap;filter:none;opacity:1}
.pcard.big{transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .18s ease-out;animation:cardsway 5s ease-in-out infinite}
@keyframes cardsway{0%,100%{rotate:0deg}50%{rotate:-1.2deg}}

/* 卡册 */
.album-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.album-head .stat{font:400 16px/1 var(--display);color:#fff;border-radius:999px;padding:6px 12px;border:2px solid #fff}
.album-head .stat.g{background:linear-gradient(#ffd56a,#d99a2b);box-shadow:0 3px 0 #a8701c}
.album-head .stat.f{background:linear-gradient(90deg,#ff9ec0,#b48cff,#7fd3ff);box-shadow:0 3px 0 #8a5ac0}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px 10px;justify-items:center;padding:10px 6px}
.acell{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;padding:0;cursor:pointer;font:inherit}
.acell .bar{width:92px;height:8px;border-radius:999px;background:rgba(255,255,255,.75);box-shadow:0 0 0 2px #fff,0 0 0 3px #f3b3c8;overflow:hidden}
.acell .bar i{display:block;height:100%;background:linear-gradient(90deg,#ff9ec0,#d79bff)}
.acell .bar.gold i{background:linear-gradient(90deg,#ffd56a,#e8a93a)}
.acell small{font-size:11px;color:#b24d73;font-weight:700;background:rgba(255,250,244,.92);border-radius:999px;padding:1px 8px;box-shadow:0 0 0 1.5px #f6c0d3}
.acell:active .pcard{transform:scale(.97)}

/* 弹窗层（盖在页面上面） */
#modal{position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;background:rgba(120,40,75,.45);padding:10px max(10px,env(safe-area-inset-right,0px)) 10px max(10px,env(safe-area-inset-left,0px));box-sizing:border-box;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.mbox{position:relative;max-width:min(760px,100%);max-height:100%;width:100%;display:flex;flex-direction:column;gap:10px;box-sizing:border-box;background:linear-gradient(#fffaf4,#fff2f6);border:4px solid #fff;border-radius:24px;box-shadow:0 0 0 3px #f3a6bf,0 8px 0 3px #c2607e,0 18px 40px rgba(120,40,75,.35);padding:14px 16px;color:var(--ink);animation:mpop .28s cubic-bezier(.2,1.3,.4,1)}
.mbox.narrow{max-width:420px}
@keyframes mpop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.mbox h2{margin:0;font:400 22px/1.15 var(--display);color:#d0567f;padding-right:40px}
.mclose{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:2px solid #fff;background:linear-gradient(#ffb8d0,#ff86b0);color:#fff;font:700 18px/1 var(--body);box-shadow:0 0 0 2px #e77ca0,0 3px 0 2px #c2607e;cursor:pointer;z-index:3}
.mscroll{min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.cdetail{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;min-height:0}
.cstage{display:flex;flex-direction:column;align-items:center;gap:8px}
.ctabs{display:flex;gap:6px}
.ctab{font:400 15px/1 var(--display);padding:6px 12px;border-radius:999px;border:2px solid #fff;background:#ffe4ee;color:#c2507a;box-shadow:0 0 0 2px #f3b3c8;cursor:pointer}
.ctab.on{background:linear-gradient(#ffb8d0,#ff86b0);color:#fff}
.ctab.g.on{background:linear-gradient(#ffd56a,#d99a2b)}
.ctab.f.on{background:linear-gradient(90deg,#ff9ec0,#b48cff,#7fd3ff)}
.cinfo{display:flex;flex-direction:column;gap:8px;min-width:0}
.cinfo h3{margin:0;font:400 26px/1.1 var(--display);color:#d0567f}
.prog{display:flex;align-items:center;gap:8px;font-size:12px}
.prog .bar{flex:1;height:12px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 2px #f3b3c8;overflow:hidden}
.prog .bar i{display:block;height:100%;background:linear-gradient(90deg,#ff9ec0,#d79bff);border-radius:999px}
.prog.gold .bar i{background:linear-gradient(90deg,#ffe08a,#e8a93a)}
.prog b{min-width:76px;text-align:right;font-variant-numeric:tabular-nums}
.perk{font-size:13px;background:#fff;border-radius:12px;padding:8px 10px;box-shadow:inset 0 0 0 2px #f6d3e0}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn .ico{width:20px;height:20px;margin:-3px 2px 0 0}

/* 扭蛋 */
.gacha{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,380px);gap:12px;height:100%;min-height:0}
.gm{position:relative;display:flex;align-items:center;justify-content:center;min-height:0}
.gm img{max-height:100%;max-width:100%;object-fit:contain;filter:drop-shadow(0 10px 16px rgba(160,60,110,.3));animation:gmfloat 3.4s ease-in-out infinite}
.gm.shake img{animation:gmshake .12s linear 6}
@keyframes gmfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes gmshake{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-5px) rotate(-1.5deg)}75%{transform:translateX(5px) rotate(1.5deg)}}
.gside{display:flex;flex-direction:column;gap:7px;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.gside .sheet{padding:9px 12px;display:flex;flex-direction:column;gap:5px}
.gside .sheet h2{margin:0}
.odds{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;font-size:12px}
.odds .tg{font:400 13px/1 var(--display);color:#fff;border-radius:999px;padding:3px 8px;text-align:center}
.odds .tg.g{background:linear-gradient(#ffd56a,#d99a2b)}
.odds .tg.f{background:linear-gradient(90deg,#ff9ec0,#b48cff,#7fd3ff)}
.odds .tg.i{background:#f3a6bf}
.pity{display:flex;flex-direction:column;gap:5px}
.gbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gbtn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 6px;border-radius:16px;border:3px solid #fff;color:#fff;cursor:pointer;font:inherit;box-shadow:0 0 0 2px var(--b2),0 5px 0 2px var(--b3);background:linear-gradient(var(--b1),var(--b2))}
.gbtn b{font:400 20px/1 var(--display);text-shadow:0 2px 0 var(--b3)}
.gbtn span{display:flex;align-items:center;gap:3px;font:400 14px/1 var(--display);background:rgba(255,255,255,.9);color:var(--b3);border-radius:999px;padding:3px 10px}
.gbtn span .ico{width:18px;height:18px}
.gbtn:disabled{filter:grayscale(.7);cursor:not-allowed}
.gbtn:active:not(:disabled){transform:translateY(3px)}
.glinks{display:flex;gap:8px;flex-wrap:wrap}
.chip.light{background:#fff;color:#c2507a;border-color:#f3b3c8}
/* 开扭蛋动画 */
.reveal{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:0}
.rays{position:absolute;left:50%;top:46%;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;pointer-events:none;background:repeating-conic-gradient(from 0deg,var(--ray,rgba(255,214,120,.55)) 0 9deg,transparent 9deg 22deg);-webkit-mask:radial-gradient(circle,#000 0 25%,transparent 68%);mask:radial-gradient(circle,#000 0 25%,transparent 68%);animation:spin 9s linear infinite;opacity:0;transition:opacity .4s}
.reveal.lit .rays{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}
.cap{--c1:#ff9ec0;position:relative;width:86px;height:86px;border-radius:50%;background:linear-gradient(180deg,var(--c1) 0 50%,rgba(255,255,255,.85) 50% 100%);border:4px solid #fff;box-shadow:0 0 0 3px rgba(194,96,126,.35),inset 0 -8px 0 rgba(0,0,0,.06),0 0 24px var(--glow,transparent);cursor:pointer;animation:capdrop .7s cubic-bezier(.3,1.5,.5,1) both}
.cap::before{content:"";position:absolute;left:18%;top:12%;width:26%;height:16%;border-radius:50%;background:rgba(255,255,255,.75)}
.cap.r3{--c1:linear-gradient(#ffe9a8,#e8a93a);--glow:rgba(255,200,80,.95);background:linear-gradient(180deg,#ffd56a 0 50%,rgba(255,255,255,.88) 50% 100%)}
.cap.r2{--glow:rgba(200,150,255,.95);background:linear-gradient(180deg,#d79bff 0 50%,rgba(255,255,255,.88) 50% 100%)}
.cap.r1{background:linear-gradient(180deg,#7fd3ff 0 50%,rgba(255,255,255,.88) 50% 100%)}
.cap.r0{background:linear-gradient(180deg,#a8ecd1 0 50%,rgba(255,255,255,.88) 50% 100%)}
.cap.wob{animation:capwob .5s ease-in-out infinite}
@keyframes capdrop{from{transform:translateY(-160px) scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes capwob{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
.flip{perspective:900px}
.flip-in{position:relative;transition:transform .7s cubic-bezier(.3,1.2,.4,1);transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.flip-face{-webkit-backface-visibility:hidden;backface-visibility:hidden}
.flip-back{position:absolute;inset:0;border-radius:calc(var(--cw)*.08);background:url(img/card_back.jpg) center/cover;box-shadow:0 0 0 3px #fff,0 6px 14px rgba(120,40,75,.35)}
.flip-front{transform:rotateY(180deg)}
.rname{font:400 22px/1.2 var(--display);color:#d0567f;text-align:center}
.rname.g{color:#c98a2b}
.rname.f{background:linear-gradient(90deg,#ff6fa5,#9b6df0,#3fb2f0);-webkit-background-clip:text;background-clip:text;color:transparent}
.rgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;justify-items:center}
.ritem{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;text-align:center;min-width:0}
.ritem .rbox{width:62px;height:62px;border-radius:16px;display:grid;place-items:center;background:#fff;box-shadow:0 0 0 2px #f3b3c8,0 3px 0 2px rgba(194,96,126,.3)}
.ritem .rbox canvas{width:48px;height:48px}
.ritem .rbox .ico{width:40px;height:40px}
.ritem.r1 .rbox{box-shadow:0 0 0 2px #7fd3ff,0 3px 0 2px #4fa6d6}
.ritem b{font-weight:700;color:#7a5566;white-space:nowrap}
.ritem .n{position:absolute;top:-6px;right:-6px;background:#ff86b0;color:#fff;border-radius:999px;font:700 11px/1 var(--body);padding:2px 5px;border:2px solid #fff}
.ritem.pop{animation:mpop .3s cubic-bezier(.2,1.4,.4,1) both}
.rules{font-size:13px;line-height:1.6}
.rules h3{margin:10px 0 4px;font:400 17px/1.2 var(--display);color:#d0567f}
.rules table{border-collapse:collapse;width:100%;font-size:13px;background:#fff;border-radius:10px;overflow:hidden}
.rules th,.rules td{padding:4px 8px;border-bottom:1px solid #f6d3e0;text-align:left;color:var(--ink);font-size:13px}
.rules th{background:#ffe4ee;color:#b24d73;font-weight:700}
.rules td.num{text-align:right;font-variant-numeric:tabular-nums}
.rules ul{margin:0;padding-left:1.2em}
.log{display:flex;flex-direction:column;gap:4px;font-size:12px}
.log div{display:flex;justify-content:space-between;gap:10px;background:#fff;border-radius:8px;padding:4px 8px}

/* 商店 */
.shop-banner{position:relative;flex:none;height:clamp(64px,calc(var(--ah,500px)*.2),110px);border-radius:18px;background:url(img/shop_banner.jpg) center/cover;box-shadow:0 0 0 3px #fff,0 0 0 5px #f3b3c8;display:grid;place-items:center}
.shop-banner b{font:400 clamp(22px,calc(var(--ah,500px)*.07),34px)/1 var(--display);color:#fff;-webkit-text-stroke:1.5px #c2607e;text-shadow:0 3px 0 #c2607e}
.shop-sec{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.shop-sec h2{margin:0;font:400 18px/1 var(--display);color:#fff;text-shadow:0 2px 0 #c2607e,0 0 6px rgba(194,96,126,.6)}
.goods{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.good{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 8px 8px;border-radius:18px;border:3px solid #fff;background:rgba(255,250,244,.96);box-shadow:0 0 0 2px #f3b3c8,0 4px 0 2px #e48aa9;cursor:pointer;font:inherit;color:var(--ink)}
.good .ico{width:44px;height:44px}
.good canvas{width:44px;height:44px}
.good b{font:400 17px/1.1 var(--display);color:#d0567f}
.good small{font-size:11px;color:#8a5a6e;text-align:center;min-height:2.4em}
.good .price{display:flex;align-items:center;gap:3px;font:400 15px/1 var(--display);color:#fff;background:linear-gradient(#ffb8d0,#ff86b0);border-radius:999px;padding:5px 12px;box-shadow:0 2px 0 #c2607e}
.good .price.gp{background:linear-gradient(#c9a3ff,#9b6df0);box-shadow:0 2px 0 #6a3fc0}
.good .price.cp{background:linear-gradient(#ffd56a,#e8a93a);box-shadow:0 2px 0 #a8701c}
.good .price .ico{width:18px;height:18px}
.good .tagx{position:absolute;top:-8px;right:-6px;font:700 10px/1 var(--body);color:#fff;background:#ff4f7b;border:2px solid #fff;border-radius:999px;padding:3px 6px}
.good:active{transform:translateY(3px)}
.gemstack{display:flex;align-items:center;gap:2px}

/* 任务 */
.tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px;align-content:start}
.tasks > .muted,.tasks > .bonus{grid-column:1/-1}
.task{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;background:rgba(255,250,244,.96);border:3px solid #fff;border-radius:16px;padding:6px 10px;box-shadow:0 0 0 2px #f3b3c8}
.task b{font:400 16px/1.2 var(--display);color:#b24d73}
.task .prog{grid-column:1}
.task .rw{display:flex;align-items:center;gap:3px;font:400 14px/1 var(--display);color:#c98a2b}
.task .rw .ico{width:18px;height:18px}
.task .act{grid-row:1/3;grid-column:2;display:flex;flex-direction:column;align-items:center;gap:4px}
.task.got{opacity:.6}
.bonus{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,#fff3c9,#ffe0ec);border:3px solid #fff;border-radius:16px;padding:8px 12px;box-shadow:0 0 0 2px #ffd56a}
.bonus .ico{width:42px;height:42px}

/* 结算奖励 */
.rewards{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:linear-gradient(90deg,#fff3c9,#ffe7f0);border-radius:14px;padding:8px 10px}
.rw-pill{display:flex;align-items:center;gap:4px;font:400 18px/1 var(--display);color:#b0701a;background:#fff;border-radius:999px;padding:4px 10px 4px 4px;box-shadow:0 0 0 2px #ffd56a}
.rw-pill .ico{width:24px;height:24px}
.rw-pill.gem{color:#8a4fc7;box-shadow:0 0 0 2px #d4b6ff}

/* 对局里的道具栏 */
.tool.bag{flex-direction:column;justify-content:center}
.tool.bag .ico{width:30px;height:30px}
.tool .badge{position:absolute;top:1px;right:1px;min-width:16px;height:16px;box-sizing:border-box;border-radius:999px;background:#ff4f7b;color:#fff;font:700 10px/12px var(--body);text-align:center;padding:0 3px;border:2px solid #fff}
.tool.dart.free .cost{color:#e0457a;font-size:11px}
#itemTray{position:absolute;left:8px;bottom:8px;z-index:4;display:flex;gap:6px;align-items:stretch;background:rgba(255,250,244,.96);border:3px solid #fff;border-radius:18px;padding:6px;box-shadow:0 0 0 2px #f3a6bf,0 5px 0 2px #c2607e;max-width:calc(100% - 16px);overflow-x:auto;animation:mpop .22s ease-out}
.itm{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;width:58px;padding:4px 2px;border-radius:12px;border:2px solid #f6d3e0;background:#fff;cursor:pointer;font:inherit;color:var(--ink)}
.itm canvas{width:38px;height:38px}
.itm b{font:400 12px/1.1 var(--display);color:#b24d73;white-space:nowrap}
.itm .badge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;box-sizing:border-box;border-radius:999px;background:#ff4f7b;color:#fff;font:700 11px/14px var(--body);text-align:center;padding:0 3px;border:2px solid #fff}
.itm:disabled{opacity:.45;cursor:not-allowed}
.itm:active:not(:disabled){transform:translateY(2px)}
.tray-tip{align-self:center;font-size:11px;color:#9a6a7e;padding:0 4px;max-width:110px}

/* 小屏：主页和页面压缩一些 */
@media (max-height:420px), (orientation:portrait) and (max-width:600px){
  .hub-main{grid-template-columns:minmax(0,1fr) minmax(250px,360px)}
  .cta{padding:8px 10px}
  .cta canvas{width:48px;height:48px}
  .mtile{padding:5px 8px}
  .mtile .ico{width:34px;height:34px}
  .dbtn{width:60px;font-size:12px}
  .dbtn .ico{width:38px;height:38px}
  .lnode .disc{width:54px;height:54px;font-size:18px}
  .lnode.cur .disc{width:64px;height:64px}
  .agrid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
}

@media (prefers-reduced-motion:reduce){.card,.tool,#toast{transition:none}.card.ready{animation:none}}

<style>

<body>
<div id="app">
  <div id="bank">
    <div id="sunbox" title="方糖"><canvas id="sunIcon" width="60" height="60"></canvas><span id="sunNum">150</span></div>
    <div id="cards"></div>
    <div id="tools">
      <button id="dartBtn" class="tool dart" aria-label="牙签飞镖：戳破气球，25 方糖"><canvas width="72" height="72"></canvas><span class="cost">25</span><span class="mask"></span></button>
      <button id="bagBtn" class="tool bag" aria-label="道具"><i class="ico bag"></i><span class="badge" hidden>0</span></button>
      <button id="shovel" class="tool" aria-label="铲子：移除小伙伴"><canvas width="72" height="72"></canvas></button>
      <div id="side">
        <button id="speedBtn" class="tool" aria-label="切换速度">1×</button>
        <button id="pauseBtn" class="tool" aria-label="暂停">暂停</button>
      </div>
    </div>
  </div>
  <div id="stage">
    <canvas id="game"></canvas>
    <button id="tutSkip" class="chip" hidden>跳过引导</button>
    <div id="itemTray" hidden></div>
  </div>
  <div id="overlay"></div>
  <div id="modal" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>

<script>
(() => {
'use strict';
const W = 920, H = 500, LX = 110, TOP = 40, CW = 80, CH = 90, ROWS = 5, COLS = 9, MAX_SLOTS = 6, INTRO = 2.4;
const FONT = '"ZCOOL KuaiLe","PingFang SC","Hiragino Sans GB",sans-serif';
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
let g = ctx; // 当前绘图上下文（图标会临时替换）

/* ================= 数据 ================= */
const PLANTS = {
  peaflower:    { name: '荷包蛋花',   cost: 75,  cd: 7.5, hp: 300,  desc: '产方糖，也会弹糖豆',
                  stat: '每 20 秒产 25 方糖 · 每 2 秒弹 1 颗糖豆（40）', lore: '一朵长成荷包蛋样子的小花，太阳一晒就掉方糖。' },
  firepea:      { name: '跳跳糖枪',   cost: 175, cd: 7.5, hp: 300,  desc: '跳跳糖伤害翻倍，炸开还会溅到旁边',
                  stat: '每 1.5 秒 1 颗跳跳糖（80，周围溅到 26）', lore: '一罐粉色跳跳糖，打出去噼里啪啦响。' },
  peanut:       { name: '布丁小炮',   cost: 125, cd: 20,  hp: 2400, desc: '很耐撞的大布丁，还会弹糖豆',
                  stat: '4800 耐久 · 每 1.6 秒 1 颗糖豆（40）', lore: '软软弹弹的焦糖布丁，头上插着一根吸管当炮管。' },
  icemine:      { name: '冰冻果冻',   cost: 50,  cd: 25,  hp: 300,  desc: '12 秒后凝固，冻住附近的团子',
                  stat: '12 秒凝固 · 3600 · 冻住周围 6 秒', lore: '放进冰箱一会儿就变硬的果冻，一碰就冒冷气。' },
  cherrynut:    { name: '奶油泡芙',   cost: 150, cd: 30,  hp: 4000, desc: '超大泡芙，被吃空时奶油喷满一圈',
                  stat: '8000 耐久 · 被吃空时 3×3 奶油爆发 3600', lore: '鼓鼓的大泡芙，里面的奶油随时准备喷出来。' },
  snowrepeater: { name: '冰淇淋筒',   cost: 200, cd: 7.5, hp: 300,  desc: '一次打两颗冰淇淋球，团子会冻得走不动',
                  stat: '每 1.5 秒 2 颗冰淇淋球（各 40，减速 50%）', lore: '双球冰淇淋，薄荷味和草莓味轮流发射。' },
  chompsquash:  { name: '平底锅',     cost: 150, cd: 20,  hp: 300,  desc: '跳起来拍扁面前的团子，然后歇一会儿',
                  stat: '拍扁 3600 · 歇 12 秒后能再出手', lore: '厨房里最靠得住的平底锅，啪的一声就安静了。' },
  cherrypepper: { name: '爆米花锅',   cost: 125, cd: 35,  hp: 300,  desc: '整排爆开爆米花，喂饱这一排的团子',
                  stat: '一次性 · 整排 3600', lore: '锅盖一掀，爆米花铺满一整排。' },

    if (v >= BOND[tier] && grantCard(k, tier) && S && !S.demo) {

function grantCard(k, tier) {
  const c = save.cards[k] || (save.cards[k] = {});
  if (c[tier]) return false;
  c[tier] = Date.now();
  save.cardNew[k] = true;
  if (S && S.cardMul) {
    S.cardMul[k] = cardMul(k);
    for (const row of S.plants) for (const p of row) if (p && p.type === k) p.tier = cardTier(k);

/* ---------- 扭蛋 ---------- */
function pickCardFor(tier) {
  const unowned = PLANT_ORDER.filter(k => !(save.cards[k] && save.cards[k][tier]));
  if (!unowned.length) return null;
  const pref = unowned.filter(plantUnlocked);
  const pool = pref.length ? pref : unowned;
  return pool[Math.floor(Math.random() * pool.length)];
}
function pullOnce() {
  const G = save.gacha;
  G.pulls++; G.pf++; G.pg++;
  let id;
  if (G.pg >= PITY.gold) id = 'gold';
  else {
    let r = Math.random() * 100;
    id = GACHA_POOL[GACHA_POOL.length - 1].id;
    for (const e of GACHA_POOL) { r -= e.p; if (r < 0) { id = e.id; break; } }
    if (id !== 'gold' && id !== 'flash' && G.pf >= PITY.flash) id = 'flash';
  }
  if (id === 'gold') { G.pg = 0; G.pf = 0; }
  else if (id === 'flash') G.pf = 0;
  const e = GACHA_POOL.find(x => x.id === id);
  const res = { id, rare: id === 'gold' ? 3 : id === 'flash' ? 2 : e.p <= 8 ? 1 : 0 };
  if (id === 'gold' || id === 'flash') {
    const k = pickCardFor(id);
    if (k) { grantCard(k, id); res.card = k; res.tier = id; }
    else { res.gems = DUP_GEMS[id]; save.gems += res.gems; }
  } else if (e.item) { save.items[e.item] += e.n; res.item = e.item; res.n = e.n; }
  else { save.coins += e.coins; res.coins = e.coins; }
  G.log.unshift({ t: Date.now(), id, k: res.card || null });
  if (G.log.length > 100) G.log.length = 100;
  return res;
}
// 扭 n 次（1 或 10）；钱不够返回 null
function doGacha(n) {
  const d = ensureDaily();
  const free = n === 1 && d.free;
  const cost = free ? 0 : n === 1 ? GACHA_COST.one : GACHA_COST.ten;
  if (save.coins < cost) return null;
  save.coins -= cost;
  if (free) d.free = false;
  const out = [];
  for (let i = 0; i < n; i++) out.push(pullOnce());
  dailyAdd('gacha', n);
  persist();
  return out;
}
function resultLabel(r) {
  if (r.card) return `${PLANTS[r.card].name} · ${TIER_NAME[r.tier]}`;
  if (r.gems) return `${TIER_NAME[r.id]}已集齐 → 钻石 ×${r.gems}`;
  if (r.item) return `${ITEMS[r.item].name} ×${r.n}`;

}

const Sound = (() => {

  const last = {};

      sfxBus = ac.createGain(); sfxBus.connect(master);
      musicBus = ac.createGain(); musicBus.gain.value = 0.32; musicBus.connect(master);
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const ch = noiseBuf.getChannelData(0);
      for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
    }

    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
    gn.gain.setValueAtTime(0.0001, t);
    gn.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    gn.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(gn); gn.connect(bus); o.start(t); o.stop(t + d + 0.03);
  }
  function noise(d, vol, freq, delay = 0, type = 'lowpass') {
    const t = ac.currentTime + delay;
    const src = ac.createBufferSource(); src.buffer = noiseBuf;
    const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq;
    const gn = ac.createGain();
    gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + d);
    src.connect(f); f.connect(gn); gn.connect(sfxBus);
    src.start(t, Math.random() * 0.5); src.stop(t + d + 0.03);
  }
  const GAP = { shoot: 0.07, hit: 0.05, firehit: 0.06, icehit: 0.06, chomp: 0.28, groan: 4, sun: 0.05 };
  function play(name) {
    if (!save.sfx || !ensure()) return;
    const now = ac.currentTime;
    if (last[name] && now - last[name] < (GAP[name] || 0.03)) return;
    last[name] = now;
    switch (name) {
      case 'plant': tone(200, 0.16, 'sine', 0.45, 70); noise(0.12, 0.18, 700); break;

function findTarget(z) {
  if (z.dir === 1) {
    // 往右走的团子（地鼠）：啃右边第一个小伙伴的背后
    const front = z.x + 16;
    for (let c = 0; c < COLS; c++) {
      const p = S.plants[z.row][c];
      if (!p || p.atk || GROUND.has(p.type)) continue;
      const px = cellCX(c);
      if (front >= px - 28 && front <= px + 34) return { p, c };
    }
    return null;
  }
  const front = z.x - 16;
  for (let c = COLS - 1; c >= 0; c--) {
    const p = S.plants[z.row][c];
    if (!p || p.atk || GROUND.has(p.type)) continue;
    const px = cellCX(c);
    if (front <= px + 28 && front >= px - 34) return { p, c };
  }
  return null;
}

function showBanner(text) { S.banner = { text, t: 0 }; sfx('horn'); }

function updateEffects(dt) {
  S.shake = Math.max(0, S.shake - dt * 40);
  S.flashA = Math.max(0, S.flashA - dt * 2.5);
  for (const p of S.parts) {
    p.t += dt; p.vy += p.grav * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    if (p.ground != null && p.y > p.ground) { p.y = p.ground; p.vy *= -0.3; p.vx *= 0.6; p.vr *= 0.5; }
  }
  S.parts = S.parts.filter(p => p.t < p.life);
  for (const t of S.texts) t.t += dt;
  S.texts = S.texts.filter(t => t.t < 1);
  for (const f of S.fx) f.t += dt;
  S.fx = S.fx.filter(f => f.t < f.dur);
  for (const d of S.decals) d.t += dt;
  S.decals = S.decals.filter(d => d.t < d.life);
}

function update(dt) {

  }

    }

  CUR_SRC = null;

    if (z.rowShift) z.rowShift = Math.sign(z.rowShift) * Math.max(0, Math.abs(z.rowShift) - 150 * dt);

    z.stuckCd = Math.max(0, (z.stuckCd || 0) - dt);
    if (z.type === 'hide') {
      const was = z.hid;
      z.hid = z.x > LX + CW * 5;
      if (was && !z.hid) {
        floatText(z.x, zombieY(z) - 70, '被发现了！', '#d7c8ff', 18);
        for (let i = 0; i < 10; i++) part({ x: z.x, y: zombieY(z) - 30, vx: rnd(-120, 120), vy: rnd(-160, 0), grav: 120, life: 0.5, size: rnd(3, 5), color: '#d7c8ff', shape: 'sparkle' });
      }

    if (z.type === 'nurse') {
      z.healT = (z.healT || 0) - dt;
      if (z.healT <= 0) {
        z.healT = 1;
        for (const o of S.zombies) {
          if (o === z || o.dead || Math.abs(o.row - z.row) > 1 || Math.abs(o.x - z.x) > 130 || o.hp >= o.maxHp) continue;
          o.hp = Math.min(o.maxHp, o.hp + 40 * (CFG.hpMul || 1));
          part({ shape: 'plus', x: o.x + rnd(-10, 10), y: zombieY(o) - 50, vx: 0, vy: -40, grav: 0, life: 0.6, size: 4, color: '#ff8fb5' });
        }
      }
    }
    z.dmgT = (z.dmgT || 0) - dt;
    if (z.dmgT <= 0 && (z.dmgAcc >= 1 || z.blockAcc >= 1)) flushDamage(z);
    if (z.burnT > 0) {
      if (z.frozen > 0) z.burnT = 0;
      else {
        z.burnT -= dt; z.burnTick -= dt;
        if (Math.random() < dt * 14) part({ x: z.x + rnd(-14, 14), y: zombieY(z) - rnd(20, 50), vx: rnd(-10, 10), vy: rnd(-70, -30), grav: -30, life: 0.4, size: rnd(2, 3.5), color: Math.random() < 0.5 ? '#ffb347' : '#ff7a59' });
        if (z.burnTick <= 0) { z.burnTick = 0.5; hurtZombie(z, 10, { dot: true }); if (z.dead) continue; }
      }
    }
    if (z.landT > 0) { z.landT -= dt; continue; }
    if (z.under) {
      // 矿工在地下前进，钻到第三列时冒出来
      z.x -= z.speed * dt; z.anim += dt;
      if (Math.random() < 0.3) part({ x: z.x + 10, y: cellCY(z.row) + 32, vx: rnd(10, 60), vy: rnd(-80, -20), grav: 300, life: 0.4, size: rnd(2, 3), color: '#6b4a2b' });
      if (z.x <= LX + 18) {
        z.under = false; z.landT = 0.35; z.speed = ZDEF.normal.speed * CFG.speedMul; z.dir = 1;
        floatText(z.x + 30, cellCY(z.row) - 60, '从背后冒出来了！', '#ffe36b', 18);
        for (let i = 0; i < 14; i++) part({ x: z.x, y: cellCY(z.row) + 30, vx: rnd(-140, 140), vy: rnd(-260, -80), life: 0.6, size: rnd(3, 5), color: '#6b4a2b' });
        S.shake = Math.max(S.shake, 4); sfx('slam');
      }
      continue;
    }
    if (z.type === 'dancer' && !z.summoned) {
      z.summonT -= dt;
      if (z.summonT <= 0 && z.x < VIS_X) {
        // 召唤 4 个伴舞
        z.summoned = true;
        const spots = [[z.row, z.x - 70], [z.row, z.x + 70], [z.row - 1, z.x], [z.row + 1, z.x]];
        for (const [rr2, xx] of spots) if (rr2 >= 0 && rr2 < ROWS) S.pending.push({ t: S.t, type: 'normal', row: rr2, x: Math.min(W - 10, xx) });
        S.fx.push({ type: 'disco', x: z.x, y: cellCY(z.row), t: 0, dur: 1.2 });
        floatText(z.x, cellCY(z.row) - 80, '♪ 伴舞上场 ♪', '#e7a6ff', 20);
        sfx('horn');
        z.stop = Math.max(z.stop, 1);
      }
    }
    if (z.frozen > 0) { z.frozen -= dt; continue; }
    if (z.stop > 0) { z.stop -= dt; continue; }
    if (z.bounce > 0) { z.bounce -= dt; z.x = Math.min(W - 20, z.x + 300 * dt); continue; }
    const k = z.slow > 0 ? 0.5 : 1;
    z.slow = Math.max(0, z.slow - dt);
    z.anim += dt * k;
    if (z.jumping > 0) {
      z.jumping -= dt;
      z.x -= (CW + 30) / 0.8 * dt;
      if (z.jumping <= 0) { z.pole = false; z.speed = ZDEF.normal.speed * CFG.speedMul; }
      continue;
    }
    const tg = z.fly || z.under ? null : findTarget(z);
    if (tg && z.type === 'zomboni' && ROLE_OF[tg.p.type] !== 'def') {
      // 推车直接碾碎普通小伙伴，不停下；碰到防守墙就停下来一下下地撞
      killPlant(z.row, tg.c);
      floatText(cellCX(tg.c), cellCY(z.row) - 30, '咔嚓！', '#fff3d1', 22);
      S.shake = Math.max(S.shake, 4); sfx('slam');
    } else if (tg && (z.type === 'garg' || z.type === 'zomboni')) {
      // 面包熊（和撞上防守墙的推车）：每 1.2 秒砸一下，每下 HEAVY_HIT 伤害
      z.eating = true;
      z.smashT += dt;
      if (z.smashT >= 1.2) {
        z.smashT = 0;
        tg.p.hp -= HEAVY_HIT; tg.p.hurt = 0.3;
        if (tg.p.hp <= 0) killPlant(z.row, tg.c);
        S.shake = Math.max(S.shake, 9);
        floatText(cellCX(tg.c), cellCY(z.row) - 30, '咚！', '#fff3d1', 28);
        for (let i = 0; i < 12; i++) part({ x: cellCX(tg.c) + rnd(-30, 30), y: cellCY(z.row) + 30, vx: rnd(-140, 140), vy: rnd(-200, -60), life: 0.6, size: rnd(3, 6), color: '#8a6a3e' });
        sfx('slam');
      }
      continue;
    }
    z.smashT = 0;
    if (tg && z.type !== 'zomboni') {
      if (z.pole) {
        z.pole = false; z.speed = ZDEF.normal.speed * CFG.speedMul;
        if (!NUTS.has(tg.p.type)) { z.jumping = 0.8; sfx('jump'); continue; }
        floatText(z.x - 20, cellCY(z.row) - 20, '杆断了！');
        part({ shape: 'pole', x: z.x - 20, y: cellCY(z.row) - 10, vx: 80, vy: -200, vr: 8, life: 1, ground: cellCY(z.row) + 32 });
      }
      if (tg.p.type === 'garlicnut') {
        z.garlicT += dt;
        if (z.garlicT >= 0.5) {
          // 嫌臭，换到隔壁一行
          const oldRow = z.row;
          const opts = [oldRow - 1, oldRow + 1].filter(rr => rr >= 0 && rr < ROWS);
          const nr = opts[Math.floor(Math.random() * opts.length)];
          z.rowShift = cellCY(oldRow) - cellCY(nr);
          z.row = nr; z.garlicT = 0; z.eating = false; z.x -= 4;
          floatText(z.x - 10, cellCY(nr) - 50, '呸！', '#e8ffd0', 20);
          tg.p.hp -= 30; tg.p.hurt = 0.1;
          if (tg.p.hp <= 0) killPlant(oldRow, tg.c);
          continue;
        }
      }
      z.eating = true;
      tg.p.hp -= 100 * dt * k; tg.p.hurt = 0.1;
      z.chompT -= dt;
      if (z.chompT <= 0) {
        z.chompT = 0.45; sfx('chomp');
        part({ x: cellCX(tg.c) + 14, y: cellCY(z.row) + 4, vx: rnd(-40, 60), vy: rnd(-160, -80), life: 0.45, size: 3, color: '#7fc04a', shape: 'rect', vr: 8 });
      }
      if (tg.p.hp <= 0) killPlant(z.row, tg.c);
    } else {
      z.eating = false;
      z.x += (z.dir === 1 ? 1 : -1) * z.speed * k * dt;
    }
    if (z.dir === 1) continue;
    const m = S.mowers[z.row];
    if (z.x < LX + 4 && m.state === 'ready') { m.state = 'go'; S.mowerUsed = true; sfx('mower'); }
    if (z.x < 12 && m.state === 'done') { gameOver(false); return; }
  }
  // 往右走出画面的团子算溜走了
  S.zombies = S.zombies.filter(z => !(z.dead && z.deadT > 1) && z.x > -60 && !(z.dir === 1 && z.x > W + 40));

  // 扫地机器人（不算任何小伙伴的功劳）
  CUR_SRC = '';
  S.mowers.forEach((m, r) => {
    if (m.state !== 'go') return;
    m.x += 330 * dt;
    if (Math.random() < 0.6) part({ x: m.x, y: cellCY(r) + 28, vx: rnd(-120, -40), vy: rnd(-80, -20), grav: 100, life: 0.4, size: rnd(2, 4), color: '#cbb48a' });
    for (const z of S.zombies)
      if (z.row === r && !z.dead && Math.abs(z.x - (m.x + 20)) < 30) { z.armor = 0; hurtZombie(z, 9999); }
    if (m.x > W + 40) m.state = 'done';
  });

  // 子弹（糖豆、跳跳糖、冰淇淋球等）
  for (const p of S.peas) {
    CUR_SRC = p.src || null;
    // 回旋镖：飞到餐桌尽头再飞回来，去程回程各打一次（回程打盾牌团子的背）
    if (p.kind === 'boomer') {
      p.spin += dt * 16;
      if (!p.back) {
        p.x += 300 * dt;
        if (p.x >= LX + CW * COLS - 10) { p.back = true; p.hitSet = new Set(); }
      } else {
        p.x -= 300 * dt;
        if (p.x <= p.home) { p.gone = true; continue; }
      }
      for (const z of S.zombies) {
        if (z.row !== p.row || z.dead || z.fly || z.under || z.hid || p.hitSet.has(z) || Math.abs(p.x - z.x) > 22) continue;
        p.hitSet.add(z);
        hurtZombie(z, p.dmg, { front: !p.back });
        sfx('hit');
      }
      continue;
    }
    p.x += 320 * (p.dir || 1) * dt;
    if (p.ty != null) p.y += (p.ty - p.y) * Math.min(1, dt * 10);
    // 穿过特性墙：火焰棉花糖把糖豆烤成焦糖火球（伤害翻倍 + 灼伤），冰霜马卡龙把糖豆冻成冰糖豆
    const pc = Math.floor((p.x - LX) / CW);
    if (pc !== p.col) {
      p.col = pc;
      const tp = pc >= 0 && pc < COLS ? S.plants[p.row][pc] : null;
      if (tp && tp.type === 'torchnut') {
        if (p.kind === 'ice') { p.kind = 'pea'; p.dmg = 20; p.burn = false; puff(p.x, p.y, '#e8f7ff'); }
        else if (p.kind === 'pea' || p.kind === 'fire') { p.kind = 'fire'; p.dmg = Math.max(p.dmg * 2, 40); p.burn = true; puff(p.x, p.y, '#ffb347'); }
      } else if (tp && tp.type === 'frostnut') {
        if (p.kind === 'fire') { p.kind = 'pea'; p.dmg = 20; p.burn = false; puff(p.x, p.y, '#e8f7ff'); }
        else if (p.kind === 'pea') { p.kind = 'ice'; puff(p.x, p.y, '#bfe9ff'); }
      }
    }
    if (p.kind === 'fire' && Math.random() < 0.5) part({ x: p.x - 8, y: p.y + rnd(-3, 3), vx: rnd(-60, -20), vy: rnd(-40, 0), grav: -40, life: 0.25, size: rnd(2, 3.5), color: '#ffb12b' });
    // 水弹：穿透这一行每只团子各打一次，并往后推
    if (p.pierce) {
      for (const z of S.zombies) {
        if (z.row !== p.row || z.dead || (z.fly && !p.air) || z.under || z.hid || p.hitSet.has(z) || p.x < z.x - 22 || p.x > z.x + 18) continue;
        p.hitSet.add(z);
        hurtZombie(z, p.dmg, { front: true });
        z.hitJ = 0.1;
        hitRing(p.x, p.y, p.kind === 'spike' ? '#c9e77a' : '#6fd6f2');
        if (p.pierceLeft != null && --p.pierceLeft <= 0) { p.gone = true; break; }
        if (p.kind !== 'spike' && z.jumping <= 0) z.x = Math.min(W, z.x + 8);
        for (let i = 0; i < 5; i++) part({ x: p.x, y: p.y, vx: rnd(-120, 60), vy: rnd(-180, 20), grav: 500, life: 0.35, size: rnd(2, 3.5), color: i % 2 ? '#bff3ff' : '#4fc3e8' });
        sfx('hit');
      }
      if (p.x > W + 20) p.gone = true;
      continue;
    }
    // 墓碑会挡住直线子弹
    if (pc >= 0 && pc < COLS && S.graves[p.row][pc] && p.x >= cellCX(pc) - 16) {
      S.graves[p.row][pc] = Math.max(0, S.graves[p.row][pc] - p.dmg * DMG_MUL);
      for (let i = 0; i < 3; i++) part({ x: p.x, y: p.y, vx: rnd(-120, 0), vy: rnd(-120, 40), life: 0.3, size: 2.5, color: '#8a8f93', shape: 'rect', vr: 8 });
      if (!S.graves[p.row][pc]) blastGraves(cellCX(pc), p.row, 10, 0);
      sfx('hit');
      p.gone = true;
      continue;
    }
    let hit = null;
    for (const z of S.zombies)
      if (z.row === p.row && !z.dead && !z.fly && !z.under && !z.hid && z.landT <= 0 && p.x >= z.x - 22 && p.x <= z.x + 18 && (!hit || z.x < hit.x)) hit = z;
    if (hit) {
      const blocked = hit.shield > 0;
      if (blocked) hitRing(p.x, p.y, '#e8b27a');
      else impact(p.kind === 'fire' ? (p.burn ? 'caramel' : 'pop') : p.kind === 'ice' ? 'frost' : 'candy', p.x, p.y);
      hurtZombie(hit, p.dmg, { front: true, burn: p.kind === 'fire' && hit.armor <= 0 && hit.hp <= p.dmg && Math.random() < 0.3 });
      if (blocked) sfx('pop');
      if (p.kind === 'fire') {
        for (const z of S.zombies) if (z !== hit && !z.fly && !z.under && !z.hid && z.row === p.row && Math.abs(z.x - hit.x) < 50) hurtZombie(z, 13);
        hit.slow = 0;
        if (p.burn) ignite(hit);
        sfx('firehit');
      } else if (p.kind === 'ice') { hit.slow = 4; hit.burnT = 0; sfx('icehit'); }
      else sfx('hit');
      const col = p.kind === 'fire' ? ['#ff8a2b', '#ffe36b'] : p.kind === 'ice' ? ['#bfe9ff', '#7fd3ff'] : ['#8fe04a', '#5fa832'];
      for (let i = 0; i < 5; i++) part({ x: p.x, y: p.y, vx: rnd(-140, 40), vy: rnd(-160, 60), grav: 500, life: 0.3, size: rnd(2, 4), color: col[i % 2], shape: p.kind === 'ice' ? 'rect' : 'circle', vr: 10 });
      p.gone = true;
    } else if (p.x > W + 20 || p.x < -20) p.gone = true;
  }
  S.peas = S.peas.filter(p => !p.gone);

  // 冰西瓜：抛物线飞向目标，落地溅射并减速
  for (const l of S.lobs) {
    CUR_SRC = l.src || null;
    l.t += dt;
    if (l.z && !l.z.dead) l.tx = l.z.x;
    if (l.t >= l.dur && l.kind === 'shell') {
      l.gone = true;
      const y = cellCY(l.row);
      for (const z of S.zombies) {
        if (z.dead || z.under) continue;
        const d = Math.abs(z.x - l.tx);
        if (z.row === l.row && d < 70) hurtZombie(z, d < 25 ? 150 : 60);
        else if (Math.abs(z.row - l.row) === 1 && d < 40) hurtZombie(z, 60);
      }
      S.fx.push({ type: 'shellboom', x: l.tx, y: y + 10, t: 0, dur: 0.5 });
      creamSplash(l.tx, y + 10, 90);
      S.fx.push({ type: 'shock', x: l.tx, y: y + 20, t: 0, dur: 0.45, r: 140 });
      scorch(l.tx, y + 30, 45);
      for (let i = 0; i < 14; i++) part({ x: l.tx, y: y + 10, vx: rnd(-180, 180), vy: rnd(-260, -60), grav: 600, life: rnd(0.4, 0.7), size: rnd(2, 5), color: ['#5b3a1c', '#ff7a1a', '#3b3a35'][i % 3], vr: 10, shape: i % 2 ? 'rect' : 'circle' });
      S.shake = Math.max(S.shake, 5);
      sfx('boom');
    } else if (l.t >= l.dur) {
      l.gone = true;
      const y = cellCY(l.row);
      for (const z of S.zombies) {
        if (z.dead || z.under || z.row !== l.row) continue;
        const d = Math.abs(z.x - l.tx);
        if (d < 70) { hurtZombie(z, d < 20 ? 80 : 26); z.slow = 4; }
      }
      for (let i = 0; i < 12; i++) part({ x: l.tx, y: y - 20, vx: rnd(-160, 160), vy: rnd(-220, -40), grav: 500, life: 0.5, size: rnd(2, 5), color: i % 2 ? '#bfe9ff' : '#6fbf5a', shape: 'rect', vr: 10 });
      for (let i = 0; i < 16; i++) part({ x: l.tx, y: y - 10, vx: rnd(-220, 220), vy: rnd(-260, -40), grav: 520, life: 0.6, size: rnd(3, 6), color: i % 3 ? '#ffc2cf' : '#ffffff', shape: i % 2 ? 'rect' : 'circle', vr: 10 });
      S.fx.push({ type: 'mist', x: l.tx, y: y, t: 0, dur: 0.6, color: '255,194,207', r: 110 });
      sfx('icehit'); sfx('slam');
    }
  }
  S.lobs = S.lobs.filter(l => !l.gone);

  // 蜜蜂：追踪任意一行的团子，目标死了就换最近的一只
  for (const b of S.bees) {
    CUR_SRC = b.src || null;
    b.t += dt;
    if (!b.z || b.z.dead) {
      b.z = null;
      let bd = Infinity;
      for (const z of S.zombies) {
        if (z.dead || z.under || z.hid || z.x > VIS_X) continue;
        const d = Math.hypot(z.x - b.x, zombieY(z) - b.y);
        if (d < bd) { bd = d; b.z = z; }
      }
      if (!b.z) { b.y -= 40 * dt; if (b.t > 2) b.gone = true; continue; }
    }
    const tx = b.z.x, ty = zombieY(b.z) - 60;
    const dx = tx - b.x, dy = ty - b.y, d = Math.hypot(dx, dy);
    if (d < 14) {
      hurtZombie(b.z, 30);
      impact('honey', b.x, b.y);
      sfx('hit');
      b.gone = true;
      continue;
    }
    b.x += dx / d * 240 * dt;
    b.y += dy / d * 240 * dt + Math.sin(b.t * 18) * 1.2;
    if (b.t > 6) b.gone = true;
  }
  S.bees = S.bees.filter(b => !b.gone);

  // 甜甜圈保龄球：滚过去撞团子，撞到后弹到隔壁行
  for (const ro of S.rollers) {
    CUR_SRC = ro.kind;
    ro.x += 170 * dt; ro.spin += dt * 9;
    ro.y += (cellCY(ro.row) + 20 - ro.y) * Math.min(1, dt * 8);
    for (const z of S.zombies) {
      if (z.dead || z.fly || z.under || z.row !== ro.row || ro.last === z || Math.abs(z.x - ro.x) > 26) continue;
      if (ro.kind === 'bombnut') {
        explodeFire(ro.row, Math.max(0, Math.min(COLS - 1, Math.floor((ro.x - LX) / CW))));
        ro.gone = true;
        break;
      }
      hurtZombie(z, 135);
      ro.last = z; ro.hits++;
      if (ro.hits >= 2) floatText(ro.x, ro.y - 50, `${ro.hits} 连撞！`, '#ffe36b', 18 + ro.hits * 2);
      if (ro.hits >= 5) unlockAch('bowler');
      if (!ro.dir) ro.dir = Math.random() < 0.5 ? -1 : 1;
      if (ro.row + ro.dir < 0 || ro.row + ro.dir >= ROWS) ro.dir = -ro.dir;
      ro.row += ro.dir;
      S.shake = Math.max(S.shake, 3);
      for (let i = 0; i < 6; i++) part({ x: ro.x, y: ro.y, vx: rnd(-120, 120), vy: rnd(-180, -40), life: 0.4, size: rnd(2, 4), color: '#c98a4b', shape: 'rect', vr: 10 });
      sfx('slam');
      break;
    }
    if (ro.x > W + 30) ro.gone = true;
  }
  S.rollers = S.rollers.filter(ro => !ro.gone);
  CUR_SRC = null;

  // 方糖
  for (const s of S.suns) {
    if (s.fly) { s.flyT += dt; continue; }
    if (s.y < s.targetY) s.y = Math.min(s.targetY, s.y + 60 * dt);
    else { s.life -= dt; if (s.life <= 0) s.gone = true; }
  }
  S.suns = S.suns.filter(s => !s.gone && !(s.fly && s.flyT > 0.5));

  // 胜利判定
  if (S.waveNum >= CFG.waves && S.pending.length === 0 && S.zombies.length === 0) {
    S.ending += dt;
    if (S.ending > 1.2) gameOver(true);
  }
}

/* ================= 绘制 ================= */
function ell(x, y, rx, ry, fill, stroke, lw) {
  g.beginPath();
  g.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), 0, 0, Math.PI * 2);
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw || 2.5; g.stroke(); }
}
function rr(x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
function line(x1, y1, x2, y2, color, lw) {
  g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2);
  g.strokeStyle = color; g.lineWidth = lw; g.lineCap = 'round'; g.stroke();
}
function poly(pts, fill, stroke, lw = 2.5) {
  g.beginPath(); g.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]);
  g.closePath();
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw; g.stroke(); }
}
function shadow(x, y, w) { ell(x, y, w, w * 0.28, 'rgba(0,0,0,.2)'); }
function stem(x, y, top) {
  g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x - 7, (y + top) / 2, x, top);
  g.strokeStyle = '#3d7a22'; g.lineWidth = 5; g.lineCap = 'round'; g.stroke();

// 团子：圆滚滚的糯米团子，被打中会越来越撑，吃饱了就冒爱心飘走

function drawLawn() {
  g.fillStyle = '#f6d7c3'; g.fillRect(0, 0, W, H);

// 拥有闪卡 / 金卡的小伙伴：脚下光环（front=false）和碟子边上的小徽章（front=true）
function drawTierAura(x, y, tier, t, front) {
  g.save();

    const pulse = 0.75 + Math.sin(t * 3 + x * 0.05) * 0.25;

      // 金卡：金色光晕 + 金环 + 往上飘的光柱

      gr.addColorStop(0, `rgba(255,222,120,${0.95 * pulse})`); gr.addColorStop(0.6, `rgba(255,214,110,${0.45 * pulse})`); gr.addColorStop(1, 'rgba(255,214,110,0)');
      g.fillStyle = gr; g.beginPath(); g.ellipse(x, y - 4, 50, 26, 0, 0, Math.PI * 2); g.fill();

      g.beginPath(); g.ellipse(x, y + 3, 40, 15, 0, 0, Math.PI * 2); g.stroke();
    } else {

      g.fillStyle = gr; g.beginPath(); g.ellipse(x, y - 4, 46, 24, 0, 0, Math.PI * 2); g.fill();
      g.lineWidth = 4;
      for (let i = 0; i < 6; i++) {
        g.strokeStyle = RAINBOW[i]; g.globalAlpha = 0.9 * pulse;
        g.beginPath(); g.ellipse(x, y + 3, 40, 15, 0, i * Math.PI / 3 + t * 1.5, (i + 1) * Math.PI / 3 + t * 1.5); g.stroke();
      }

    const bx = x + 32, by = y;

}
