<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>别偷吃我的蛋糕</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap">
<style>
/* 布局：上方木质种子栏 + 下方餐桌画布；横屏矮屏时种子栏移到左侧。菜单、图鉴等界面浮在餐桌之上。单一甜美粉色画面，不跟随深色模式。 */
:root{
  --night:#fbe1ea;
  --wood:#f39ab5;
  --wood-dark:#e07898;
  --wood-edge:#b8577a;
  --paper:#fffaf4;
  --paper-dim:#ffe9ef;
  --ink:#5a3446;
  --sun:#ffd56a;
  --leaf:#6fcfa3;
  --leaf-dark:#3f9a74;
  --danger:#ff5a7a;
  --box:#b69cf0;
  --box-dark:#7a5fc0;
  --display:"ZCOOL KuaiLe","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  --body:-apple-system,"PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;overscroll-behavior:none}
[hidden]{display:none!important}
*{touch-action:manipulation}
body{
  position:fixed;inset:0;margin:0;
  background:var(--night);color:var(--paper);font:14px/1.45 var(--body);
  overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit}
/* 页面固定铺满可见区域（不随浏览器工具栏滚动），四周按刘海和横条留出安全区 */
#app{
  position:absolute;top:0;left:0;width:100%;height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;
  padding-top:max(8px,env(safe-area-inset-top,0px));
  padding-bottom:max(8px,env(safe-area-inset-bottom,0px));
  padding-left:max(8px,env(safe-area-inset-left,0px));
  padding-right:max(8px,env(safe-area-inset-right,0px));
}
#bank{
  flex:none;display:flex;align-items:stretch;gap:6px;
  background:var(--wood);border:3px solid var(--wood-edge);border-radius:10px;padding:6px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.18),0 3px 0 rgba(0,0,0,.35);
}
#sunbox{
  flex:none;width:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:var(--wood-dark);border-radius:7px;padding:4px 0;transition:background .15s;
}
#sunbox.nope{background:var(--danger)}
#sunIcon{width:30px;height:30px}
#sunNum{font-family:var(--display);font-size:18px;line-height:1;color:var(--paper);font-variant-numeric:tabular-nums}
#cards{display:flex;gap:5px;flex:1 1 auto;min-width:0}
.card,.tool{
  position:relative;overflow:hidden;border:2px solid var(--wood-edge);border-radius:7px;
  background:var(--paper);color:var(--ink);padding:0;cursor:pointer;
  transition:transform .12s,box-shadow .12s,filter .12s;
}
.card{flex:1 1 0;min-width:0;max-width:66px;height:66px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.card canvas{width:100%;max-width:46px;aspect-ratio:1;flex:1 1 auto;min-height:0;object-fit:contain}
.card .cost{font-family:var(--display);font-size:14px;line-height:1;padding:1px 0 4px;font-variant-numeric:tabular-nums}
.card .mask{position:absolute;left:0;right:0;top:0;height:0;background:rgba(20,14,6,.55);pointer-events:none}
.card.off{filter:brightness(.62) saturate(.7)}
.card.ready{animation:ready .5s ease-out}
@keyframes ready{0%{box-shadow:0 0 0 4px var(--sun)}100%{box-shadow:0 0 0 0 rgba(255,210,63,0)}}
.card.sel,.tool.sel{transform:translateY(-3px);box-shadow:0 0 0 3px #fff,0 4px 0 rgba(0,0,0,.4)}
.card:focus-visible,.tool:focus-visible,.btn:focus-visible,.mbtn:focus-visible,.chip:focus-visible,.tile:focus-visible,.lv:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
#tools{flex:none;display:flex;gap:5px;flex-wrap:wrap}
.tool.dart{flex-direction:column;justify-content:flex-end}
.tool.dart canvas{width:30px;height:30px}
.tool.dart .cost{font-family:var(--display);font-size:12px;line-height:1;padding-bottom:3px;color:var(--ink)}
.tool .mask{position:absolute;left:0;right:0;top:0;height:0;background:rgba(90,30,50,.45);pointer-events:none}
.tool.off{filter:brightness(.7) saturate(.6)}
.tool{width:44px;display:flex;align-items:center;justify-content:center}
#shovel canvas{width:36px;height:36px}
#side{display:flex;flex-direction:column;gap:5px}
#side .tool{width:40px;flex:1;font-family:var(--display);font-size:13px;background:var(--wood-dark);color:var(--paper);border-color:var(--wood-edge)}
#stage{flex:1 1 auto;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
#game{display:block;border-radius:8px;box-shadow:0 0 0 3px var(--wood-edge),0 6px 18px rgba(0,0,0,.45);touch-action:none}

/* 浮层 */
#overlay{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:rgba(150,60,95,.32);padding:10px max(10px,env(safe-area-inset-right,0px)) 10px max(10px,env(safe-area-inset-left,0px));box-sizing:border-box}
#overlay.soft{background:linear-gradient(rgba(255,240,245,.05),rgba(180,80,120,.35))}
.panel{
  max-width:430px;width:100%;max-height:100%;overflow:auto;box-sizing:border-box;
  background:var(--paper);color:var(--ink);border:4px solid var(--wood-edge);border-radius:14px;
  padding:16px 18px;box-shadow:0 6px 0 rgba(0,0,0,.35);display:flex;flex-direction:column;gap:10px;
}
.panel.wide{max-width:780px}
.panel h1{margin:0;font-family:var(--display);font-weight:400;font-size:32px;line-height:1.1;color:var(--leaf-dark);text-wrap:balance}
.panel h2{margin:0;font-family:var(--display);font-weight:400;font-size:22px;color:var(--wood-dark)}
.panel .sub{margin:0;font-family:var(--display);font-size:16px;color:var(--wood)}
.panel p{margin:0}
.panel ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:3px}
.phead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.btns{display:flex;gap:10px;flex-wrap:wrap;padding-top:4px}
.btn{
  font-family:var(--display);font-size:19px;padding:7px 20px;border-radius:10px;cursor:pointer;
  background:var(--leaf);color:#fff;border:3px solid var(--leaf-dark);box-shadow:0 3px 0 var(--leaf-dark);
}
.btn.alt{background:var(--wood);border-color:var(--wood-edge);box-shadow:0 3px 0 var(--wood-edge)}
.btn.small{font-size:15px;padding:4px 12px}
.btn:disabled{filter:grayscale(1) brightness(.85);cursor:not-allowed}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--leaf-dark)}
.reward{display:flex;align-items:center;gap:12px;background:var(--paper-dim);border-radius:10px;padding:8px 12px}
.reward canvas{width:64px;height:64px;flex:none}
.reward b{font-family:var(--display);font-weight:400;font-size:20px;color:var(--leaf-dark)}

/* 主菜单 */
.menu{display:grid;gap:14px;justify-items:center;align-items:center;max-height:100%;overflow:auto;padding:4px}
.logo{display:flex;flex-direction:column;align-items:center;line-height:1}
.logo .l1{font-family:var(--display);font-size:clamp(40px,9vw,70px);color:#fffaf4;-webkit-text-stroke:2px var(--wood-edge);text-shadow:0 5px 0 var(--wood-edge),0 10px 18px rgba(0,0,0,.4);letter-spacing:.04em}
.logo small{margin-top:8px;font-family:var(--display);font-size:16px;color:var(--paper);background:var(--wood-dark);border:2px solid var(--wood-edge);border-radius:999px;padding:2px 12px;letter-spacing:.08em}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:min(440px,100%)}
.mbtn{
  display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;cursor:pointer;
  background:var(--wood);color:var(--paper);border:3px solid var(--wood-edge);border-radius:12px;
  padding:10px 14px;box-shadow:inset 0 2px 0 rgba(255,255,255,.18),0 4px 0 var(--wood-edge);
}
.mbtn b{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.1}
.mbtn span{font-size:12px;opacity:.85}
.mbtn:active{transform:translateY(2px);box-shadow:inset 0 2px 0 rgba(255,255,255,.18),0 2px 0 var(--wood-edge)}
.mbtn.main{grid-column:1/-1;background:var(--leaf);border-color:var(--leaf-dark);box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 4px 0 var(--leaf-dark)}
.mbtn.lucky{background:var(--box);border-color:var(--box-dark);box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 4px 0 var(--box-dark)}
.rar{color:var(--wood-dark);font-weight:700;border-bottom:3px solid var(--rar)}
.mfoot{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{cursor:pointer;font-size:13px;padding:4px 12px;border-radius:999px;background:var(--wood-dark);border:2px solid var(--wood-edge);color:var(--paper)}
#tutSkip{position:absolute;right:10px;bottom:10px;z-index:3}
.tut-glow{animation:tutglow 1s ease-in-out infinite;position:relative;z-index:2}
@keyframes tutglow{0%,100%{box-shadow:0 0 0 3px #ffd56a,0 0 14px 4px rgba(255,214,90,.8)}50%{box-shadow:0 0 0 6px #ffd56a,0 0 22px 10px rgba(255,214,90,.9)}}
.chip.warn{background:var(--danger);border-color:#7d0f1b}
@media (orientation:landscape) and (min-width:600px), (orientation:portrait) and (max-width:600px){
  .menu{grid-template-columns:auto minmax(0,440px);column-gap:36px}
  .mfoot{grid-column:1/-1}
}

/* 关卡与挑战 */
.lvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.lv{
  position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;cursor:pointer;
  background:#fff;border:3px solid var(--wood);border-radius:10px;padding:8px 10px;color:var(--ink);
}
.lv b{font-family:var(--display);font-weight:400;font-size:20px;color:var(--leaf-dark);line-height:1}
.lv .nm{font-size:13px;font-weight:600}
.lv .ft{font-size:11px;color:#5b3a8a;background:#efe6ff;border-radius:6px;padding:1px 6px}
.panel h2 + .sub{margin-top:-6px}
.card.belt .cost{font-size:12px;color:var(--leaf-dark)}
.belt-empty{grid-column:1/-1;align-self:center;font-family:var(--display);font-size:13px;color:var(--paper);opacity:.8;padding:4px 8px}
.lv .rw{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--wood)}
.lv .rw canvas{width:28px;height:28px}
.lv .st{position:absolute;top:6px;right:8px;font-family:var(--display);font-size:13px;color:var(--leaf)}
.lv.locked{background:var(--paper-dim);border-color:#c7b38a;color:#8b7a5c;cursor:not-allowed}
.lv.locked b{color:#8b7a5c}
.lv.done{border-color:var(--leaf)}

/* 选卡 */
.guide-sec{display:flex;flex-direction:column;gap:6px}
.guide-sec h2{font-size:19px}
.guide-sec ul{font-size:13px}
.role-legend{display:flex;flex-wrap:wrap;gap:6px}
.role-chip{font-size:12px;font-weight:700;color:var(--ink);background:#fff;border:2px solid var(--rc);border-bottom-width:5px;border-radius:8px;padding:2px 10px}
.chip.hot{background:var(--sun);color:var(--ink);border-color:#c9902a}
.intel{display:flex;flex-direction:column;gap:6px;background:var(--paper-dim);border-radius:12px;padding:10px 12px}
.intel h2{font-size:18px}
.intel-row{display:flex;align-items:center;gap:10px;min-width:0}
.intel-row > canvas{width:46px;height:46px;flex:none;background:#fff;border-radius:10px}
.intel-txt{display:flex;flex-direction:column;min-width:0;flex:1}
.intel-txt b{font-size:14px;color:var(--ink)}
.intel-txt span{font-size:12px;color:#8a5a6e}
.intel-ctr{display:flex;align-items:center;gap:4px;flex:none}
.intel-ctr small{font-size:11px;color:var(--wood-edge);margin-right:2px}
.intel-ctr canvas{width:30px;height:30px;background:#fff;border-radius:8px}
.tile .rec{position:absolute;top:-6px;right:-6px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;border-radius:999px;padding:1px 6px;border:2px solid #fff}
.slots{display:flex;gap:6px;flex-wrap:wrap;min-height:60px;background:var(--wood);border-radius:10px;padding:6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.tile{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:0;cursor:pointer;
  background:#fff;border:2px solid var(--wood);border-radius:9px;padding:4px 2px 3px;color:var(--ink);
}
.tile canvas{width:52px;height:52px}
.tile .tn{font-size:11px;line-height:1.2;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tile.on{border-color:var(--leaf);box-shadow:0 0 0 2px var(--leaf)}
.tile.used{opacity:.35}
.tile.cur{border-color:var(--sun);box-shadow:0 0 0 3px var(--sun)}
.slots .tile{width:56px;background:var(--paper)}
.slots .tile canvas{width:44px;height:44px}

/* 图鉴 */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{cursor:pointer;font-family:var(--display);font-size:16px;padding:4px 14px;border-radius:999px;border:2px solid var(--wood);background:transparent;color:var(--wood-dark)}
.tab.on{background:var(--wood);color:var(--paper)}
.alm{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:620px){.alm{grid-template-columns:minmax(0,1fr)}}
.detail{background:var(--paper-dim);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.detail .dtop{display:flex;gap:12px;align-items:center}
.detail canvas{width:96px;height:96px;flex:none;background:#fff8e4;border-radius:10px;border:2px solid var(--wood)}
.detail h3{margin:0;font-family:var(--display);font-weight:400;font-size:22px;color:var(--leaf-dark)}
.detail .tag{font-size:12px;color:var(--wood)}
.detail .stat{font-size:13px;font-weight:600}
.detail .lore{font-size:13px;color:#5b4a35}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.ach{display:flex;gap:10px;align-items:center;background:#fff;border:2px solid var(--wood);border-radius:10px;padding:8px 10px}
.ach .medal{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:16px;background:#d9c9a3;color:#8b7a5c;border:2px solid #b8a27a}
.ach.got .medal{background:var(--sun);color:var(--wood-edge);border-color:#c98a00}
.ach b{display:block;font-size:14px}
.ach span{font-size:12px;color:#6b5a40}
.ach:not(.got){opacity:.7}

#toast{
  position:absolute;left:50%;top:max(12px,env(safe-area-inset-top,0px));transform:translate(-50%,-140%);z-index:9;
  background:var(--wood-dark);color:var(--paper);border:3px solid var(--sun);border-radius:12px;
  padding:6px 16px;font-family:var(--display);font-size:16px;white-space:normal;text-align:center;max-width:min(560px,86%);line-height:1.35;transition:transform .35s cubic-bezier(.2,1.4,.4,1),opacity .2s;pointer-events:none;opacity:0;
}
#toast.show{transform:translate(-50%,0);opacity:1}
/* 竖着拿手机：整个游戏旋转 90° 横过来铺满屏幕 */
@media (orientation:portrait) and (max-width:600px){
  /* --scr-w/--scr-h 由脚本按真实可见区域写入；旋转后内容的上/右/下/左对应屏幕的右/下/左/上 */
  #app{
    width:var(--scr-h,100dvh);height:var(--scr-w,100dvw);
    transform-origin:top left;transform:translateX(var(--scr-w,100vw)) rotate(90deg);
    padding-left:max(8px,env(safe-area-inset-top,0px));
    padding-right:max(8px,env(safe-area-inset-bottom,0px));
    padding-top:max(8px,env(safe-area-inset-right,0px));
    padding-bottom:max(8px,env(safe-area-inset-left,0px));
  }
  #overlay{
    padding:max(10px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px)) max(10px,env(safe-area-inset-top,0px));
  }
  #toast{top:max(12px,env(safe-area-inset-right,0px))}
}
/* 横屏手机（以及旋转后的竖屏）：种子栏竖到左侧 */
@media (orientation:landscape) and (max-height:520px), (orientation:portrait) and (max-width:600px){
  #app{flex-direction:row}
  #bank{flex-direction:column;width:132px;box-sizing:border-box;overflow-y:auto}
  #sunbox{width:auto;flex-direction:row;gap:6px;padding:3px 0}
  #cards{display:grid;grid-template-columns:1fr 1fr;flex:none}
  .card{max-width:none;height:54px}
  .card canvas{max-width:36px}
  #tools{justify-content:space-between}
  #side{flex-direction:row}
  #shovel{width:34px;height:40px;flex:none}
  #shovel canvas{width:30px;height:30px}
  #side .tool{width:34px;height:40px;flex:none}
  .logo .l1{font-size:52px}
}
@media (prefers-reduced-motion:reduce){.card,.tool,#toast{transition:none}.card.ready{animation:none}}
</style>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#fbe1ea">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="别偷吃我的蛋糕">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
/* 独立运行时补上 Artifact 外壳原本提供的基础样式（安全区留白由 #app 自己处理） */
html{height:100%;background:#fbe1ea}
body{margin:0}
</style>
</head>
<body>
<div id="app">
  <div id="bank">
    <div id="sunbox" title="方糖"><canvas id="sunIcon" width="60" height="60"></canvas><span id="sunNum">150</span></div>
    <div id="cards"></div>
    <div id="tools">
      <button id="dartBtn" class="tool dart" aria-label="牙签飞镖：戳破气球，25 方糖"><canvas width="72" height="72"></canvas><span class="cost">25</span><span class="mask"></span></button>
      <button id="shovel" class="tool" aria-label="铲子：移除小伙伴"><canvas width="72" height="72"></canvas></button>
      <div id="side">
        <button id="speedBtn" class="tool" aria-label="切换速度">1×</button>
        <button id="pauseBtn" class="tool" aria-label="暂停">暂停</button>
      </div>
    </div>
  </div>
  <div id="stage">
    <canvas id="game"></canvas>
    <button id="tutSkip" class="chip" hidden>跳过引导</button>
  </div>
  <div id="overlay"></div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>

<script>
(() => {
'use strict';
const W = 880, H = 500, LX = 70, TOP = 40, CW = 80, CH = 90, ROWS = 5, COLS = 9, MAX_SLOTS = 6, INTRO = 2.4;
const FONT = '"ZCOOL KuaiLe","PingFang SC","Hiragino Sans GB",sans-serif';
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
let g = ctx; // 当前绘图上下文（图标会临时替换）

/* ================= 数据 ================= */
const PLANTS = {
  peaflower:    { name: '荷包蛋花',   cost: 75,  cd: 7.5, hp: 300,  desc: '产方糖，也会弹糖豆',
                  stat: '每 20 秒产 25 方糖 · 每 2 秒弹 1 颗糖豆（40）', lore: '一朵长成荷包蛋样子的小花，太阳一晒就掉方糖。' },
  firepea:      { name: '跳跳糖枪',   cost: 175, cd: 7.5, hp: 300,  desc: '跳跳糖伤害翻倍，炸开还会溅到旁边',
                  stat: '每 1.5 秒 1 颗跳跳糖（80，周围溅到 26）', lore: '一罐粉色跳跳糖，打出去噼里啪啦响。' },

const Sound = (() => {
  let ac = null, sfxBus, musicBus, noiseBuf, track = null, step = 0, nextT = 0, timer = null;
  const last = {};
  function ensure() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ac = new AC();
      const master = ac.createGain(); master.gain.value = 0.7; master.connect(ac.destination);
      sfxBus = ac.createGain(); sfxBus.connect(master);
      musicBus = ac.createGain(); musicBus.gain.value = 0.32; musicBus.connect(master);
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const ch = noiseBuf.getChannelData(0);
      for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
    }
    if (ac.state === 'suspended') ac.resume();

  }

  }
  function noise(d, vol, freq, delay = 0, type = 'lowpass') {
    const t = ac.currentTime + delay;

    const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq;
    const gn = ac.createGain();
    gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + d);
    src.connect(f); f.connect(gn); gn.connect(sfxBus);
    src.start(t, Math.random() * 0.5); src.stop(t + d + 0.03);
  }
  const GAP = { shoot: 0.07, hit: 0.05, firehit: 0.06, icehit: 0.06, chomp: 0.28, groan: 4, sun: 0.05 };
  function play(name) {
    if (!save.sfx || !ensure()) return;

    if (last[name] && now - last[name] < (GAP[name] || 0.03)) return;
    last[name] = now;
    switch (name) {
      case 'plant': tone(200, 0.16, 'sine', 0.45, 70); noise(0.12, 0.18, 700); break;
      case 'shoot': tone(560, 0.07, 'square', 0.05, 240); break;
      case 'hit': noise(0.06, 0.2, 2400, 0, 'bandpass'); break;

      case 'slam': tone(130, 0.28, 'sine', 0.55, 40); noise(0.22, 0.35, 380); break;
      case 'jump': tone(300, 0.2, 'triangle', 0.12, 700); break;
      case 'chomp': noise(0.05, 0.16, 1500, 0, 'bandpass'); noise(0.05, 0.14, 1100, 0.1, 'bandpass'); break;
      case 'select': tone(700, 0.05, 'square', 0.05); break;
      case 'cant': tone(210, 0.16, 'square', 0.07, 150); break;
      case 'tick': tone(440, 0.14, 'triangle', 0.22); break;
      case 'go': tone(660, 0.1, 'triangle', 0.25); tone(990, 0.3, 'triangle', 0.25, null, 0.1); break;
      case 'horn': tone(220, 0.7, 'sawtooth', 0.1, 196); tone(330, 0.7, 'sawtooth', 0.07, 294); break;
      case 'win': [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.3, 'triangle', 0.2, null, i * 0.12)); break;
      case 'lose': [392, 330, 262, 196].forEach((f, i) => tone(f, 0.4, 'sawtooth', 0.08, f * 0.97, i * 0.22)); break;
      case 'ach': tone(988, 0.12, 'triangle', 0.2); tone(1319, 0.35, 'triangle', 0.2, null, 0.1); break;

    }

  const TRACKS = {
    menu: { step: 0.3,  bass: [48, 48, 55, 55, 57, 57, 52, 52], mel: [72, null, 74, 76, null, 79, 76, 74, 72, null, 69, 72, null, 74, null, null] },
    game: { step: 0.24, bass: [45, 45, 52, 52, 43, 43, 50, 50], mel: [69, 72, 74, 72, 76, null, 74, 72, 69, null, 67, 69, 72, null, null, null,
                                                                       69, 72, 74, 76, 79, null, 76, 74, 72, null, 74, 72, 69, null, null, null] },
  };

      const delay = Math.max(0, nextT - ac.currentTime);
      if (step % 2 === 0) tone(hz(T.bass[(step / 2) % T.bass.length]), T.step * 1.8, 'triangle', 0.16, null, delay, musicBus);
      const m = T.mel[step % T.mel.length];

/* ---------- 波次生成 ---------- */
function buildWave(i) {
  const flag = isFlag(i);
  let budget = Math.floor((CFG.base + i * CFG.grow) * CFG.diff);
  if (flag) budget = Math.floor(budget * 2.2) + 2;
  budget = Math.max(1, budget);
  const list = flag && !CFG.pool.every(t => t === 'garg') ? ['flag'] : [];
  while (budget > 0) {
    // 地鼠团子从第 16 波开始才会出现
    const opts = CFG.pool.filter(t => ZDEF[t].cost <= budget && (CFG.noGate || ZDEF[t].cost <= 1 + i * 0.7) && (t !== 'digger' || i > 15));
    if (!opts.length) break;
    let sum = 0;
    const w = opts.map(t => { const v = 1 / ZDEF[t].cost + (ZDEF[t].cost > 1 ? 0.35 : 0); sum += v; return v; });
    let r = Math.random() * sum, pick = opts[0];
    for (let j = 0; j < opts.length; j++) { r -= w[j]; if (r <= 0) { pick = opts[j]; break; } }
    list.push(pick); budget -= ZDEF[pick].cost;
  }
  return list;
}

const PLANT_HP_MUL = 2; // 所有小伙伴血量的倍率（图鉴里的耐久已按倍率写好）
function makePlant(type) {
  const d = PLANTS[type];
  return { type, hp: d.hp * PLANT_HP_MUL, maxHp: d.hp * PLANT_HP_MUL, age: 0, shootT: type === 'icemelon' ? 1 : 0.6, sunT: type === 'sunnut' ? 10 : 7,
    armed: false, hurt: 0, recoil: 0, fuse: type === 'doomcherry' ? 1.3 : 1, chew: 0, atk: null, spikeT: 0, open: 0, clockT: 6 };
}
// 开盒：按概率抽稀有度，再在这一档里随机挑一株
// 后三列（靠蛋糕）更容易开出远程攻击，前三列（靠团子）更容易开出防守；中间三列不变
function posWeight(k, col) {
  const role = ROLE_OF[k];
  if (col == null || (col > 2 && col < 6)) return 1;
  if (col <= 2) return role === 'atk' ? 3 : role === 'eco' ? 1.5 : role === 'def' ? 0.35 : 1;
  return role === 'def' ? 3 : role === 'boom' ? 1.6 : role === 'atk' ? 0.4 : 1;
}
function rollBox(kind, col) {
  const odds = BOX_ODDS[kind];
  let sum = 0;
  for (const k in odds) sum += odds[k];
  let r = Math.random() * sum;
  for (const k in odds) {
    r -= odds[k];
    if (r <= 0) {
      if (k === 'zombie') return { zombie: true };
      const { plants, weights } = RARITY[k];
      const ws = plants.map((pk, i) => weights[i] * posWeight(pk, col));
      let w = Math.random() * ws.reduce((a, b) => a + b, 0);
      for (let i = 0; i < plants.length; i++) { w -= ws[i]; if (w <= 0) return { plant: plants[i], rarity: k }; }
      return { plant: plants[0], rarity: k };
    }
  }
  return { plant: 'peaflower', rarity: 'common' };
}
function openBox(r, c, p) {
  const px = cellCX(c), py = cellCY(r);
  const res = rollBox(PLANTS[p.type].box, c);
  const gold = p.type === 'goldbox';
  for (let i = 0; i < 18; i++) {
    const a = rnd(0, Math.PI * 2), sp = rnd(80, 260);
    part({ x: px, y: py, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 120, grav: 400, life: rnd(0.5, 0.9), size: rnd(2, 5), shape: 'rect', vr: rnd(-10, 10),
      color: (gold ? ['#ffd23f', '#fff3a0', '#e3263a'] : ['#9b5de5', '#ffd23f', '#fff3d1'])[i % 3] });
  }
  if (res.zombie) {
    // 团子从这一行的路口冲进来，不会直接出现在房子门口
    S.plants[r][c] = null;
    spawnZombie(Math.random() < 0.6 ? 'normal' : 'cone', r, LX + CW * COLS + 10);
    floatText(px, py - 40, '盲盒里跳出一只团子！', '#ff6b5a', 20);
    S.boxZombies++;
    if (S.boxZombies >= 3) unlockAch('unlucky');
    sfx('lose');
    return;
  }
  const np = makePlant(res.plant);
  S.plants[r][c] = np;
  const rar = RARITY[res.rarity];
  floatText(px, py - 50, PLANTS[res.plant].name, rar.color, res.rarity === 'common' ? 18 : 22);
  if (!save.boxGot[res.plant]) { save.boxGot[res.plant] = true; persist(); }
  if (res.rarity === 'legendary') {
    unlockAch('legend');
    showBanner(`传说！${PLANTS[res.plant].name}`);
    S.shake = Math.max(S.shake, 6); S.flashA = 0.35;
    for (let i = 0; i < 24; i++) part({ x: px, y: py, vx: rnd(-200, 200), vy: rnd(-320, -80), grav: 300, life: rnd(0.8, 1.3), size: rnd(2, 4), color: '#ffd23f', shape: 'rect', vr: 12 });
    sfx('unlock');

}

  if (S.waveNum < CFG.waves) {
    const nxt = S.waveNum + 1;
    if (isFlag(nxt) && !S.bannerFor[nxt] && S.t >= S.nextWaveT - 4) {
      S.bannerFor[nxt] = true;
      showBanner(nxt === CFG.waves ? '最后一群团子！' : '一大群团子来偷吃啦！');
    }
    if (S.t >= S.nextWaveT) {
      S.waveNum = nxt;
      buildWave(nxt).forEach((type, i) => S.pending.push({ t: S.t + i * 1.1, type }));
      // 旗帜波：每块墓碑里爬出一只团子
      if (isFlag(nxt)) for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (S.graves[r][c]) {
        S.pending.push({ t: S.t + rnd(0.5, 2.5), type: Math.random() < 0.6 ? 'normal' : 'cone', row: r, x: cellCX(c) });
        floatText(cellCX(c), cellCY(r) - 30, '咕噜…', '#c9ced1', 18);
      }
      S.nextWaveT += gapAfter(nxt);
      if (CFG.mode === 'endless' && nxt > 10) unlockAch('endless10');
      if (CFG.mode === 'lucky' && nxt > 15) { unlockAch('luckywin'); save.luckyWin = true; }
    }
  }
  for (const p of S.pending) if (p.t <= S.t) { spawnZombie(p.type, p.row, p.x); p.done = true; }
  S.pending = S.pending.filter(p => !p.done);

  if (CFG.skySun) {
    S.nextSky -= dt;
    if (S.nextSky <= 0) {
      S.nextSky = rnd(8, 11);
      addSun(rnd(LX + 40, LX + CW * COLS - 40), TOP - 10, rnd(TOP + 60, TOP + CH * ROWS - 40));
    }
  }
  // 传送带：定时送来一株小伙伴
  if (CFG.conveyor) {
    S.beltT -= dt;
    if (S.beltT <= 0) {
      S.beltT = CFG.conveyor.interval;
      if (S.belt.length < 7) {
        const items = CFG.conveyor.items;
        S.belt.push({ k: items[Math.floor(Math.random() * items.length)], id: ++S.beltId });
        beltDirty = true;
      }
    }
  }
  S.fogClear = Math.max(0, S.fogClear - dt);

  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (S.craters[r][c] > 0) S.craters[r][c] = Math.max(0, S.craters[r][c] - dt);

  // 小伙伴
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const p = S.plants[r][c];
    if (!p) continue;
    const px = cellCX(c), py = cellCY(r);
    p.age += dt; p.hurt = Math.max(0, p.hurt - dt); p.recoil = Math.max(0, p.recoil - dt);
    switch (p.type) {
      case 'peaflower':
        p.sunT -= dt;
        if (p.sunT <= 0) { p.sunT = 20; addSun(px + rnd(-14, 14), py - 30, py + 14); }
        // fallthrough 射击
      case 'firepea': case 'peanut': case 'snowrepeater':
        p.shootT -= dt;
        if (p.shootT <= 0 && zombieAhead(r, px)) {
          p.shootT = p.type === 'peaflower' ? 2 : p.type === 'peanut' ? 1.6 : 1.5;
          p.recoil = 0.12;
          if (p.type === 'peanut') shoot(r, px + 34, py - 3, 'pea');
          else if (p.type === 'snowrepeater') { shoot(r, px + 24, py - 14, 'ice'); S.peas.push({ row: r, x: px - 4, y: py - 14, kind: 'ice', dmg: 20 }); }
          else shoot(r, px + 22, py - 14, p.type === 'firepea' ? 'fire' : 'pea');
        }
        break;
      case 'icemine':
        if (!p.armed && p.age >= 12) {
          p.armed = true;
          for (let i = 0; i < 8; i++) part({ x: px + rnd(-18, 18), y: py + 24, vx: rnd(-60, 60), vy: rnd(-160, -60), life: 0.5, size: rnd(2, 4), color: '#7a5530' });
        }
        if (p.armed && S.zombies.some(z => z.row === r && !z.dead && !z.fly && !z.under && z.x - 16 < px + 38 && z.x > px - 30)) {
          S.plants[r][c] = null; explodeIce(r, c);
        }
        break;
      case 'chompsquash':
        if (p.atk) {
          p.atk.t += dt;
          if (!p.atk.hit && p.atk.t >= 0.4) {
            p.atk.hit = true;
            let n = 0;
            for (const z of S.zombies) if (z.row === r && Math.abs(z.x - p.atk.tx) < 48 && hurtZombie(z, 1800)) n++;
            comboCheck(n);
            S.shake = Math.max(S.shake, 8);
            floatText(p.atk.tx, py - 40, '啪！', '#ffe36b', 34);
            S.fx.push({ type: 'shock', x: p.atk.tx, y: py + 20, t: 0, dur: 0.45, r: 170 });
            for (let i = 0; i < 10; i++) { const a = i * Math.PI / 5; part({ x: p.atk.tx, y: py, vx: Math.cos(a) * 220, vy: Math.sin(a) * 140 - 60, grav: 200, life: 0.7, size: rnd(5, 8), color: '#ffd56a', shape: 'sparkle', vr: 10 }); }
            for (let i = 0; i < 12; i++) part({ x: p.atk.tx + rnd(-30, 30), y: py + 30, vx: rnd(-140, 140), vy: rnd(-180, -60), life: 0.6, size: rnd(3, 6), color: '#8a6a3e' });
            sfx('slam');
          }
          if (p.atk.t >= 0.8) { p.atk = null; p.chew = 12; }
        } else if (p.chew > 0) {
          p.chew -= dt;
          if (Math.random() < dt * 2) sfx('chomp');
        } else {
          let best = null;
          for (const z of S.zombies)
            if (z.row === r && !z.dead && !z.under && z.jumping <= 0 && z.x > px - 30 && z.x < px + 130 && (!best || z.x < best.x)) best = z;
          if (best) { p.atk = { t: 0, tx: best.x, hit: false }; sfx('jump'); }
        }
        break;
      case 'cherrypepper':
        p.fuse -= dt;
        if (p.fuse <= 0) { S.plants[r][c] = null; burnRow(r); }
        break;
      case 'doomcherry':
        p.fuse -= dt;
        if (p.fuse <= 0) { S.plants[r][c] = null; explodeDoom(r, c); }
        break;
      case 'sunnut':
        p.sunT -= dt;
        if (p.sunT <= 0) { p.sunT = 25; addSun(px + rnd(-14, 14), py - 40, py + 14); }
        break;
      case 'spikenut':
        p.spikeT -= dt;
        if (p.spikeT <= 0) {
          p.spikeT = 1;
          let hits = 0;
          for (const z of S.zombies)
            if (z.row === r && !z.dead && !z.fly && !z.under && z.jumping <= 0 && Math.abs(z.x - px) < 40) {
              if (z.type === 'zomboni') { hurtZombie(z, 9999); floatText(z.x, cellCY(r) - 40, '爆胎！', '#ffe36b', 24); p.hp = 0; } else hurtZombie(z, 20);
              hits++;
            }
          if (hits) {
            p.hp -= 10 * hits; p.hurt = 0.1;
            for (let i = 0; i < 4; i++) part({ x: px + rnd(-20, 20), y: py + 30, vx: rnd(-40, 40), vy: rnd(-140, -60), life: 0.35, size: 2.5, color: '#c9ced1', shape: 'rect', vr: 10 });
            sfx('hit');
            if (p.hp <= 0) killPlant(r, c);
          }
        }
        break;
      case 'threesnow':
        p.shootT -= dt;
        if (p.shootT <= 0 && [r - 1, r, r + 1].some(rr => rr >= 0 && rr < ROWS && zombieAhead(rr, px))) {
          p.shootT = 1.5; p.recoil = 0.12;
          for (const tr of [r - 1, r, r + 1]) if (tr >= 0 && tr < ROWS)
            S.peas.push({ row: tr, x: px + 20, y: py - 24, ty: cellCY(tr) - 14, kind: 'ice', dmg: 20 });
          muzzle(px + 26, py - 24, '#bfe9ff');
          sfx('shoot');
        }
        break;
      case 'icemelon':
        p.shootT -= dt;
        if (p.shootT <= 0) {
          let tgt = null;
          for (const z of S.zombies) if (z.row === r && !z.dead && !z.under && z.x > px && z.x < VIS_X && (!tgt || z.x < tgt.x)) tgt = z;
          if (tgt) {
            p.shootT = 3; p.recoil = 0.25;
            S.lobs.push({ kind: 'melon', row: r, sx: px - 6, sy: py - 50, z: tgt, tx: tgt.x, t: 0, dur: 0.9 });
            sfx('jump');
          }
        }
        break;
      case 'gatlingpea':
        p.shootT -= dt;
        if (p.shootT <= 0 && zombieAhead(r, px)) {
          p.shootT = 1.5; p.recoil = 0.3;
          for (let i = 0; i < 4; i++) S.peas.push({ row: r, x: px + 24 - i * 22, y: py - 14, kind: 'pea', dmg: 20 });
          muzzle(px + 34, py - 14, RAINBOW[Math.floor(Math.random() * 6)]); muzzle(px + 34, py - 14, '#ffffff'); S.shake = Math.max(S.shake, 1);
          sfx('shoot');
        }
        break;
      case 'fountainpea':
        p.shootT -= dt;
        if (p.shootT <= 0 && zombieAhead(r, px)) {
          p.shootT = 1.6; p.recoil = 0.12;
          S.peas.push({ row: r, x: px + 22, y: py - 14, kind: 'water', dmg: 20, pierce: true, hitSet: new Set() });
          muzzle(px + 30, py - 14, '#6fd6f2');
          sfx('shoot');
        }
        break;
      case 'mortar':
        p.shootT -= dt;
        if (p.shootT <= 0) {
          // 全场离房子最近的团子
          let tgt = null;
          for (const z of S.zombies) if (!z.dead && !z.under && z.x < VIS_X && z.jumping <= 0 && (!tgt || z.x < tgt.x)) tgt = z;
          if (tgt) {
            p.shootT = 5; p.recoil = 0.35;
            S.lobs.push({ kind: 'shell', row: tgt.row, sx: px + 10, sy: py - 50, z: tgt, tx: tgt.x, t: 0, dur: 1.2 });
            for (let i = 0; i < 6; i++) part({ x: px + 14, y: py - 52, vx: rnd(-40, 40), vy: rnd(-120, -40), grav: -30, life: 0.6, size: rnd(3, 6), color: 'rgba(200,200,200,.8)' });
            S.shake = Math.max(S.shake, 2);
            sfx('slam');
          }
        }
        break;
      case 'luckybox': case 'goldbox':
        p.open += dt;
        if (p.open >= 0.9) openBox(r, c, p);
        break;
      case 'twinpop': {
        // 双色冰棒：前面有团子就往前射，背后有团子就往后射
        p.shootT -= dt;
        if (p.shootT <= 0) {
          const fwd = zombieAhead(r, px);
          const back = S.zombies.some(z => z.row === r && !z.dead && !z.under && !z.fly && z.x < px - 10 && z.x > LX - 40);
          if (fwd || back) {
            p.shootT = 1.5; p.recoil = 0.12;
            if (fwd) shoot(r, px + 24, py - 14, 'pea');
            if (back) { S.peas.push({ row: r, x: px - 24, y: py - 14, kind: 'pea', dmg: 40, dir: -1, c: '#7fd3ff' }); muzzle(px - 30, py - 14, '#7fd3ff'); }
          }
        }
        break;
      }
      case 'shieldleaf':
        p.shootT -= dt;
        if (p.shootT <= 0) {
          p.shootT = 1;
          for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
            if (!dr && !dc) continue;
            const q = S.plants[r + dr] && S.plants[r + dr][c + dc];
            if (!q || q.hp >= q.maxHp || PLANTS[q.type].box) continue;
            q.hp = Math.min(q.maxHp, q.hp + 30);
            part({ shape: 'heart', x: cellCX(c + dc) + rnd(-14, 14), y: cellCY(r + dr) - 10, vx: rnd(-10, 10), vy: -60, grav: 0, life: 0.9, size: 6, color: '#ff8fb5' });
          }
        }
        break;
      case 'springgrass':
        p.boing = Math.max(0, (p.boing || 0) - dt);
        for (const z of S.zombies) {
          if (z.row !== r || z.dead || z.fly || z.under || z.type === 'garg' || z.type === 'zomboni' || z.jumping > 0 || z.bounce > 0 || z.landT > 0 || Math.abs(z.x - px) > 26) continue;
          z.bounce = 0.55; z.eating = false;
          p.hp -= 50; p.hurt = 0.2; p.boing = 0.3;
          floatText(px, py - 40, '嘣！', '#e8ffd0', 22);
          sfx('jump');
          if (p.hp <= 0) { killPlant(r, c); break; }
        }
        break;
      case 'beeflower':
        p.shootT -= dt;
        if (p.shootT <= 0 && S.zombies.some(z => !z.dead && z.x < VIS_X)) {
          p.shootT = 2.5; p.recoil = 0.2;
          S.bees.push({ x: px + 4, y: py - 34, z: null, t: 0 });
          sfx('select');
        }
        break;
      case 'boomerang':
        p.shootT -= dt;
        if (p.shootT <= 0 && zombieAhead(r, px)) {
          p.shootT = 2.5; p.recoil = 0.3;
          S.peas.push({ row: r, x: px + 18, y: py - 22, kind: 'boomer', dmg: 20, home: px, back: false, hitSet: new Set(), spin: 0 });
          sfx('jump');
        }
        break;
      case 'lightningvine':
        p.shootT -= dt;
        if (p.shootT <= 0) {
          let first = null;
          for (const z of S.zombies) if (z.row === r && !z.dead && !z.under && z.x > px && z.x < VIS_X && (!first || z.x < first.x)) first = z;
          if (first) {
            p.shootT = 2.5; p.recoil = 0.3;
            // 打中最近的团子后，再跳向附近 3 只（任意行）
            const chain = [first];
            let cur = first;
            for (let n = 0; n < 3; n++) {
              let best = null, bd = 190;
              for (const z of S.zombies) {
                if (z.dead || z.under || chain.includes(z) || z.x > VIS_X) continue;
                const d = Math.hypot(z.x - cur.x, cellCY(z.row) - cellCY(cur.row));
                if (d < bd) { bd = d; best = z; }
              }
              if (!best) break;
              chain.push(best); cur = best;
            }
            const pts = [[px + 4, py - 54]].concat(chain.map(z => [z.x, zombieY(z) - 60]));
            for (const z of chain) hurtZombie(z, 50);
            S.fx.push({ type: 'bolt', pts, t: 0, dur: 0.32 });
            for (const [bx2, by2] of pts.slice(1)) { S.fx.push({ type: 'ring', x: bx2, y: by2, t: 0, dur: 0.3, color: '#ffe36b', r: 44 }); for (let i = 0; i < 5; i++) part({ x: bx2, y: by2, vx: rnd(-160, 160), vy: rnd(-160, 160), grav: 0, life: 0.25, size: rnd(3, 5), color: i % 2 ? '#ffffff' : '#ffe36b', shape: 'sparkle' }); }
            S.fogClear = 1.5; S.flashA = Math.max(S.flashA, 0.18);
            sfx('zap');
          }
        }
        break;
      case 'twinsun':
        p.sunT -= dt;
        if (p.sunT <= 0) { p.sunT = 18; addSun(px - 14, py - 34, py + 12); addSun(px + 14, py - 34, py + 16); }
        break;
      case 'magnetnut':
        p.magT = (p.magT == null ? 2 : p.magT) - dt;
        if (p.magT <= 0) {
          let best = null;
          for (const z of S.zombies) {
            if (z.dead || z.under || Math.abs(z.row - r) > 1 || z.x < px - 40 || z.x > px + CW * 3) continue;
            if (!((METAL.has(z.armorType) && z.armor > 0) || z.shield > 0)) continue;
            if (!best || z.x < best.x) best = z;
          }
          if (best) {
            p.magT = 8; p.recoil = 0.4;
            const shape = best.shield > 0 ? 'shield' : best.armorType;
            if (best.shield > 0) best.shield = 0; else best.armor = 0;
            const zy = zombieY(best) - (shape === 'shield' ? 50 : 100);
            part({ shape, x: best.x, y: zy, vx: (px - best.x) / 0.5, vy: (py - 40 - zy) / 0.5, grav: 0, vr: 6, life: 0.5 });
            S.fx.push({ type: 'magnet', x: px, y: py - 34, x2: best.x, y2: zy, t: 0, dur: 0.5 });
            floatText(best.x, zy - 20, '吸走了！', '#ffb0b0', 18);
            sfx('pop');
          }
        }
        break;
      case 'cactuspea':
        p.shootT -= dt;
        if (p.shootT <= 0 && zombieAhead(r, px)) {
          p.shootT = 1.5; p.recoil = 0.12;
          S.peas.push({ row: r, x: px + 24, y: py - 14, kind: 'spike', dmg: 25, pierce: true, air: true, pierceLeft: 2, hitSet: new Set() });
          muzzle(px + 30, py - 14, '#c9e77a');
          sfx('shoot');
        }
        break;
      case 'laserbean':
        p.shootT -= dt;
        if (p.shootT <= 0 && zombieAhead(r, px)) {
          p.shootT = 3; p.recoil = 0.35;
          for (const z of S.zombies) if (z.row === r && !z.dead && !z.under && z.x > px && z.x < VIS_X) { hurtZombie(z, 60); z.hitJ = 0.15; }
          S.fx.push({ type: 'laser', x: px + 20, y: py - 20, t: 0, dur: 0.35 });
          S.shake = Math.max(S.shake, 3);
          sfx('zap');
        }
        break;
      case 'icecherry':
        p.fuse -= dt;
        if (p.fuse <= 0.4) {
          S.plants[r][c] = null;
          for (const z of S.zombies) if (!z.dead) { z.frozen = Math.max(z.frozen, 5); hurtZombie(z, 100); }
          S.fx.push({ type: 'ice', x: W / 2, y: H / 2, t: 0, dur: 1, big: true });
          for (let i = 0; i < 40; i++) part({ x: rnd(LX, W), y: rnd(TOP, H), vx: rnd(-40, 40), vy: rnd(20, 90), grav: 40, life: rnd(0.8, 1.4), size: rnd(2, 4), color: i % 2 ? '#ffffff' : '#bfe9ff', shape: 'rect', vr: 6 });
          S.flashA = 0.6; S.shake = Math.max(S.shake, 8);
          floatText(px, py - 50, '全场冻结！', '#bfe9ff', 26);
          sfx('freeze'); sfx('boom');
        }
        break;
      case 'clockflower':
        p.clockT -= dt;
        if (p.clockT <= 0) {
          p.clockT = 18;
          for (const z of S.zombies) if (!z.dead) z.stop = Math.max(z.stop, 3);
          S.fx.push({ type: 'clock', x: px, y: py - 30, t: 0, dur: 1 });
          S.flashA = Math.max(S.flashA, 0.25);
          floatText(px, py - 70, '时间停止！', '#d7c8ff', 22);
          sfx('freeze');
        }
        break;
    }
  }

  // 团子
  for (const z of S.zombies) {
    if (z.dead) {
      z.deadT += dt;
      if (z.burnt && !z.ashed && z.deadT > 0.55) {
        z.ashed = true;
        const y = cellCY(z.row) + 32;
        for (let i = 0; i < 16; i++) part({ x: z.x + rnd(-16, 16), y: y - rnd(0, 90), vx: rnd(-30, 50), vy: rnd(-60, 10), grav: 120, life: rnd(0.5, 0.9), size: rnd(2, 5), color: i % 2 ? '#2a2a2a' : '#555' });
      }
      continue;
    }
    z.flash = Math.max(0, z.flash - dt);
    if (z.rowShift) z.rowShift = Math.sign(z.rowShift) * Math.max(0, Math.abs(z.rowShift) - 150 * dt);
    z.hitJ = Math.max(0, z.hitJ - dt);
    z.dmgT = (z.dmgT || 0) - dt;
    if (z.dmgT <= 0 && (z.dmgAcc >= 1 || z.blockAcc >= 1)) flushDamage(z);
    if (z.burnT > 0) {
      if (z.frozen > 0) z.burnT = 0;
      else {
        z.burnT -= dt; z.burnTick -= dt;
        if (Math.random() < dt * 14) part({ x: z.x + rnd(-14, 14), y: zombieY(z) - rnd(20, 50), vx: rnd(-10, 10), vy: rnd(-70, -30), grav: -30, life: 0.4, size: rnd(2, 3.5), color: Math.random() < 0.5 ? '#ffb347' : '#ff7a59' });
        if (z.burnTick <= 0) { z.burnTick = 0.5; hurtZombie(z, 10, { dot: true }); if (z.dead) continue; }
      }
    }
    if (z.landT > 0) { z.landT -= dt; continue; }
    if (z.under) {
      // 矿工在地下前进，钻到第三列时冒出来
      z.x -= z.speed * dt; z.anim += dt;
      if (Math.random() < 0.3) part({ x: z.x + 10, y: cellCY(z.row) + 32, vx: rnd(10, 60), vy: rnd(-80, -20), grav: 300, life: 0.4, size: rnd(2, 3), color: '#6b4a2b' });
      if (z.x <= LX + 18) {
        z.under = false; z.landT = 0.35; z.speed = ZDEF.normal.speed * CFG.speedMul; z.dir = 1;
        floatText(z.x + 30, cellCY(z.row) - 60, '从背后冒出来了！', '#ffe36b', 18);
        for (let i = 0; i < 14; i++) part({ x: z.x, y: cellCY(z.row) + 30, vx: rnd(-140, 140), vy: rnd(-260, -80), life: 0.6, size: rnd(3, 5), color: '#6b4a2b' });
        S.shake = Math.max(S.shake, 4); sfx('slam');
      }
      continue;
    }
    if (z.type === 'dancer' && !z.summoned) {
      z.summonT -= dt;
      if (z.summonT <= 0 && z.x < VIS_X) {
        // 召唤 4 个伴舞
        z.summoned = true;
        const spots = [[z.row, z.x - 70], [z.row, z.x + 70], [z.row - 1, z.x], [z.row + 1, z.x]];
        for (const [rr2, xx] of spots) if (rr2 >= 0 && rr2 < ROWS) S.pending.push({ t: S.t, type: 'normal', row: rr2, x: Math.min(W - 10, xx) });
        S.fx.push({ type: 'disco', x: z.x, y: cellCY(z.row), t: 0, dur: 1.2 });
        floatText(z.x, cellCY(z.row) - 80, '♪ 伴舞上场 ♪', '#e7a6ff', 20);
        sfx('horn');
        z.stop = Math.max(z.stop, 1);
      }
    }
    if (z.frozen > 0) { z.frozen -= dt; continue; }
    if (z.stop > 0) { z.stop -= dt; continue; }
    if (z.bounce > 0) { z.bounce -= dt; z.x = Math.min(W - 20, z.x + 300 * dt); continue; }
    const k = z.slow > 0 ? 0.5 : 1;
    z.slow = Math.max(0, z.slow - dt);
    z.anim += dt * k;
    if (z.jumping > 0) {
      z.jumping -= dt;
      z.x -= (CW + 30) / 0.8 * dt;
      if (z.jumping <= 0) { z.pole = false; z.speed = ZDEF.normal.speed * CFG.speedMul; }
      continue;
    }
    const tg = z.fly || z.under ? null : findTarget(z);
    if (tg && z.type === 'zomboni') {
      // 冰车直接碾碎小伙伴，不停下
      killPlant(z.row, tg.c);
      floatText(cellCX(tg.c), cellCY(z.row) - 30, '咔嚓！', '#fff3d1', 22);
      S.shake = Math.max(S.shake, 4); sfx('slam');
    }
    if (tg && z.type === 'garg') {
      // 巨人：举锤 1.2 秒，一下砸烂小伙伴
      z.eating = true;
      z.smashT += dt;
      if (z.smashT >= 1.2) {
        z.smashT = 0;
        killPlant(z.row, tg.c);
        S.shake = Math.max(S.shake, 9);
        floatText(cellCX(tg.c), cellCY(z.row) - 30, '咚！', '#fff3d1', 28);
        for (let i = 0; i < 12; i++) part({ x: cellCX(tg.c) + rnd(-30, 30), y: cellCY(z.row) + 30, vx: rnd(-140, 140), vy: rnd(-200, -60), life: 0.6, size: rnd(3, 6), color: '#8a6a3e' });
        sfx('slam');
      }
      continue;
    }
    z.smashT = 0;
    if (tg && z.type !== 'zomboni') {
      if (z.pole) {
        z.pole = false; z.speed = ZDEF.normal.speed * CFG.speedMul;
        if (!NUTS.has(tg.p.type)) { z.jumping = 0.8; sfx('jump'); continue; }
        floatText(z.x - 20, cellCY(z.row) - 20, '杆断了！');
        part({ shape: 'pole', x: z.x - 20, y: cellCY(z.row) - 10, vx: 80, vy: -200, vr: 8, life: 1, ground: cellCY(z.row) + 32 });
      }
      if (tg.p.type === 'garlicnut') {
        z.garlicT += dt;
        if (z.garlicT >= 0.5) {
          // 嫌臭，换到隔壁一行
          const oldRow = z.row;
          const opts = [oldRow - 1, oldRow + 1].filter(rr => rr >= 0 && rr < ROWS);
          const nr = opts[Math.floor(Math.random() * opts.length)];
          z.rowShift = cellCY(oldRow) - cellCY(nr);
          z.row = nr; z.garlicT = 0; z.eating = false; z.x -= 4;
          floatText(z.x - 10, cellCY(nr) - 50, '呸！', '#e8ffd0', 20);
          tg.p.hp -= 30; tg.p.hurt = 0.1;
          if (tg.p.hp <= 0) killPlant(oldRow, tg.c);
          continue;
        }
      }
      z.eating = true;
      tg.p.hp -= 100 * dt * k; tg.p.hurt = 0.1;
      z.chompT -= dt;
      if (z.chompT <= 0) {
        z.chompT = 0.45; sfx('chomp');
        part({ x: cellCX(tg.c) + 14, y: cellCY(z.row) + 4, vx: rnd(-40, 60), vy: rnd(-160, -80), life: 0.45, size: 3, color: '#7fc04a', shape: 'rect', vr: 8 });
      }
      if (tg.p.hp <= 0) killPlant(z.row, tg.c);
    } else {
      z.eating = false;
      z.x += (z.dir === 1 ? 1 : -1) * z.speed * k * dt;
    }
    if (z.dir === 1) continue;
    const m = S.mowers[z.row];
    if (z.x < LX + 4 && m.state === 'ready') { m.state = 'go'; S.mowerUsed = true; sfx('mower'); }
    if (z.x < 12 && m.state === 'done') { gameOver(false); return; }
  }
  // 往右走出画面的团子算溜走了
  S.zombies = S.zombies.filter(z => !(z.dead && z.deadT > 1) && z.x > -60 && !(z.dir === 1 && z.x > W + 40));

  // 扫地机器人
  S.mowers.forEach((m, r) => {
    if (m.state !== 'go') return;
    m.x += 330 * dt;
    if (Math.random() < 0.6) part({ x: m.x, y: cellCY(r) + 28, vx: rnd(-120, -40), vy: rnd(-80, -20), grav: 100, life: 0.4, size: rnd(2, 4), color: '#cbb48a' });
    for (const z of S.zombies)
      if (z.row === r && !z.dead && Math.abs(z.x - (m.x + 20)) < 30) { z.armor = 0; hurtZombie(z, 9999); }
    if (m.x > W + 40) m.state = 'done';
  });

  // 子弹（糖豆、跳跳糖、冰淇淋球等）
  for (const p of S.peas) {
    // 回旋镖：飞到餐桌尽头再飞回来，去程回程各打一次（回程打盾牌团子的背）
    if (p.kind === 'boomer') {
      p.spin += dt * 16;
      if (!p.back) {
        p.x += 300 * dt;
        if (p.x >= LX + CW * COLS - 10) { p.back = true; p.hitSet = new Set(); }
      } else {
        p.x -= 300 * dt;
        if (p.x <= p.home) { p.gone = true; continue; }
      }
      for (const z of S.zombies) {
        if (z.row !== p.row || z.dead || z.fly || z.under || p.hitSet.has(z) || Math.abs(p.x - z.x) > 22) continue;
        p.hitSet.add(z);
        hurtZombie(z, p.dmg, { front: !p.back });
        sfx('hit');
      }
      continue;
    }
    p.x += 320 * (p.dir || 1) * dt;
    if (p.ty != null) p.y += (p.ty - p.y) * Math.min(1, dt * 10);
    // 穿过特性墙：火焰棉花糖把糖豆烤成焦糖火球（伤害翻倍 + 灼伤），冰霜马卡龙把糖豆冻成冰糖豆
    const pc = Math.floor((p.x - LX) / CW);
    if (pc !== p.col) {
      p.col = pc;
      const tp = pc >= 0 && pc < COLS ? S.plants[p.row][pc] : null;
      if (tp && tp.type === 'torchnut') {
        if (p.kind === 'ice') { p.kind = 'pea'; p.dmg = 20; p.burn = false; puff(p.x, p.y, '#e8f7ff'); }
        else if (p.kind === 'pea' || p.kind === 'fire') { p.kind = 'fire'; p.dmg = Math.max(p.dmg * 2, 40); p.burn = true; puff(p.x, p.y, '#ffb347'); }
      } else if (tp && tp.type === 'frostnut') {
        if (p.kind === 'fire') { p.kind = 'pea'; p.dmg = 20; p.burn = false; puff(p.x, p.y, '#e8f7ff'); }
        else if (p.kind === 'pea') { p.kind = 'ice'; puff(p.x, p.y, '#bfe9ff'); }
      }
    }
    if (p.kind === 'fire' && Math.random() < 0.5) part({ x: p.x - 8, y: p.y + rnd(-3, 3), vx: rnd(-60, -20), vy: rnd(-40, 0), grav: -40, life: 0.25, size: rnd(2, 3.5), color: '#ffb12b' });
    // 水弹：穿透这一行每只团子各打一次，并往后推
    if (p.pierce) {
      for (const z of S.zombies) {
        if (z.row !== p.row || z.dead || (z.fly && !p.air) || z.under || p.hitSet.has(z) || p.x < z.x - 22 || p.x > z.x + 18) continue;
        p.hitSet.add(z);
        hurtZombie(z, p.dmg, { front: true });
        z.hitJ = 0.1;
        hitRing(p.x, p.y, p.kind === 'spike' ? '#c9e77a' : '#6fd6f2');
        if (p.pierceLeft != null && --p.pierceLeft <= 0) { p.gone = true; break; }
        if (p.kind !== 'spike' && z.jumping <= 0) z.x = Math.min(W, z.x + 8);
        for (let i = 0; i < 5; i++) part({ x: p.x, y: p.y, vx: rnd(-120, 60), vy: rnd(-180, 20), grav: 500, life: 0.35, size: rnd(2, 3.5), color: i % 2 ? '#bff3ff' : '#4fc3e8' });
        sfx('hit');
      }
      if (p.x > W + 20) p.gone = true;
      continue;
    }
    // 墓碑会挡住直线子弹
    if (pc >= 0 && pc < COLS && S.graves[p.row][pc] && p.x >= cellCX(pc) - 16) {
      S.graves[p.row][pc] = Math.max(0, S.graves[p.row][pc] - p.dmg * DMG_MUL);
      for (let i = 0; i < 3; i++) part({ x: p.x, y: p.y, vx: rnd(-120, 0), vy: rnd(-120, 40), life: 0.3, size: 2.5, color: '#8a8f93', shape: 'rect', vr: 8 });
      if (!S.graves[p.row][pc]) blastGraves(cellCX(pc), p.row, 10, 0);
      sfx('hit');
      p.gone = true;
      continue;
    }
    let hit = null;
    for (const z of S.zombies)
      if (z.row === p.row && !z.dead && !z.fly && !z.under && z.landT <= 0 && p.x >= z.x - 22 && p.x <= z.x + 18 && (!hit || z.x < hit.x)) hit = z;
    if (hit) {
      const blocked = hit.shield > 0;
      if (blocked) hitRing(p.x, p.y, '#e8b27a');
      else impact(p.kind === 'fire' ? (p.burn ? 'caramel' : 'pop') : p.kind === 'ice' ? 'frost' : 'candy', p.x, p.y);
      hurtZombie(hit, p.dmg, { front: true, burn: p.kind === 'fire' && hit.armor <= 0 && hit.hp <= p.dmg && Math.random() < 0.3 });
      if (blocked) sfx('pop');
      if (p.kind === 'fire') {
        for (const z of S.zombies) if (z !== hit && !z.fly && !z.under && z.row === p.row && Math.abs(z.x - hit.x) < 50) hurtZombie(z, 13);
        hit.slow = 0;
        if (p.burn) ignite(hit);
        sfx('firehit');
      } else if (p.kind === 'ice') { hit.slow = 4; hit.burnT = 0; sfx('icehit'); }
      else sfx('hit');
      const col = p.kind === 'fire' ? ['#ff8a2b', '#ffe36b'] : p.kind === 'ice' ? ['#bfe9ff', '#7fd3ff'] : ['#8fe04a', '#5fa832'];
      for (let i = 0; i < 5; i++) part({ x: p.x, y: p.y, vx: rnd(-140, 40), vy: rnd(-160, 60), grav: 500, life: 0.3, size: rnd(2, 4), color: col[i % 2], shape: p.kind === 'ice' ? 'rect' : 'circle', vr: 10 });
      p.gone = true;
    } else if (p.x > W + 20 || p.x < -20) p.gone = true;
  }
  S.peas = S.peas.filter(p => !p.gone);

  // 冰西瓜：抛物线飞向目标，落地溅射并减速
  for (const l of S.lobs) {
    l.t += dt;
    if (l.z && !l.z.dead) l.tx = l.z.x;
    if (l.t >= l.dur && l.kind === 'shell') {
      l.gone = true;
      const y = cellCY(l.row);
      for (const z of S.zombies) {
        if (z.dead || z.under) continue;
        const d = Math.abs(z.x - l.tx);
        if (z.row === l.row && d < 70) hurtZombie(z, d < 25 ? 150 : 60);
        else if (Math.abs(z.row - l.row) === 1 && d < 40) hurtZombie(z, 60);
      }
      S.fx.push({ type: 'shellboom', x: l.tx, y: y + 10, t: 0, dur: 0.5 });
      creamSplash(l.tx, y + 10, 90);
      S.fx.push({ type: 'shock', x: l.tx, y: y + 20, t: 0, dur: 0.45, r: 140 });
      scorch(l.tx, y + 30, 45);
      for (let i = 0; i < 14; i++) part({ x: l.tx, y: y + 10, vx: rnd(-180, 180), vy: rnd(-260, -60), grav: 600, life: rnd(0.4, 0.7), size: rnd(2, 5), color: ['#5b3a1c', '#ff7a1a', '#3b3a35'][i % 3], vr: 10, shape: i % 2 ? 'rect' : 'circle' });
      S.shake = Math.max(S.shake, 5);
      sfx('boom');
    } else if (l.t >= l.dur) {
      l.gone = true;
      const y = cellCY(l.row);
      for (const z of S.zombies) {
        if (z.dead || z.under || z.row !== l.row) continue;
        const d = Math.abs(z.x - l.tx);
        if (d < 70) { hurtZombie(z, d < 20 ? 80 : 26); z.slow = 4; }
      }
      for (let i = 0; i < 12; i++) part({ x: l.tx, y: y - 20, vx: rnd(-160, 160), vy: rnd(-220, -40), grav: 500, life: 0.5, size: rnd(2, 5), color: i % 2 ? '#bfe9ff' : '#6fbf5a', shape: 'rect', vr: 10 });
      for (let i = 0; i < 16; i++) part({ x: l.tx, y: y - 10, vx: rnd(-220, 220), vy: rnd(-260, -40), grav: 520, life: 0.6, size: rnd(3, 6), color: i % 3 ? '#ffc2cf' : '#ffffff', shape: i % 2 ? 'rect' : 'circle', vr: 10 });
      S.fx.push({ type: 'mist', x: l.tx, y: y, t: 0, dur: 0.6, color: '255,194,207', r: 110 });
      sfx('icehit'); sfx('slam');
    }
  }
  S.lobs = S.lobs.filter(l => !l.gone);

  // 蜜蜂：追踪任意一行的团子，目标死了就换最近的一只
  for (const b of S.bees) {
    b.t += dt;
    if (!b.z || b.z.dead) {
      b.z = null;
      let bd = Infinity;
      for (const z of S.zombies) {
        if (z.dead || z.under || z.x > VIS_X) continue;
        const d = Math.hypot(z.x - b.x, zombieY(z) - b.y);
        if (d < bd) { bd = d; b.z = z; }
      }
      if (!b.z) { b.y -= 40 * dt; if (b.t > 2) b.gone = true; continue; }
    }
    const tx = b.z.x, ty = zombieY(b.z) - 60;
    const dx = tx - b.x, dy = ty - b.y, d = Math.hypot(dx, dy);
    if (d < 14) {
      hurtZombie(b.z, 30);
      impact('honey', b.x, b.y);
      sfx('hit');
      b.gone = true;
      continue;
    }
    b.x += dx / d * 240 * dt;
    b.y += dy / d * 240 * dt + Math.sin(b.t * 18) * 1.2;
    if (b.t > 6) b.gone = true;
  }
  S.bees = S.bees.filter(b => !b.gone);

  // 甜甜圈保龄球：滚过去撞团子，撞到后弹到隔壁行
  for (const ro of S.rollers) {
    ro.x += 170 * dt; ro.spin += dt * 9;
    ro.y += (cellCY(ro.row) + 20 - ro.y) * Math.min(1, dt * 8);
    for (const z of S.zombies) {
      if (z.dead || z.fly || z.under || z.row !== ro.row || ro.last === z || Math.abs(z.x - ro.x) > 26) continue;
      if (ro.kind === 'bombnut') {
        explodeFire(ro.row, Math.max(0, Math.min(COLS - 1, Math.floor((ro.x - LX) / CW))));
        ro.gone = true;
        break;
      }
      hurtZombie(z, 135);
      ro.last = z; ro.hits++;
      if (ro.hits >= 2) floatText(ro.x, ro.y - 50, `${ro.hits} 连撞！`, '#ffe36b', 18 + ro.hits * 2);
      if (ro.hits >= 5) unlockAch('bowler');
      if (!ro.dir) ro.dir = Math.random() < 0.5 ? -1 : 1;
      if (ro.row + ro.dir < 0 || ro.row + ro.dir >= ROWS) ro.dir = -ro.dir;
      ro.row += ro.dir;
      S.shake = Math.max(S.shake, 3);
      for (let i = 0; i < 6; i++) part({ x: ro.x, y: ro.y, vx: rnd(-120, 120), vy: rnd(-180, -40), life: 0.4, size: rnd(2, 4), color: '#c98a4b', shape: 'rect', vr: 10 });
      sfx('slam');
      break;
    }
    if (ro.x > W + 30) ro.gone = true;
  }
  S.rollers = S.rollers.filter(ro => !ro.gone);

  // 方糖
  for (const s of S.suns) {
    if (s.fly) { s.flyT += dt; continue; }
    if (s.y < s.targetY) s.y = Math.min(s.targetY, s.y + 60 * dt);
    else { s.life -= dt; if (s.life <= 0) s.gone = true; }
  }
  S.suns = S.suns.filter(s => !s.gone && !(s.fly && s.flyT > 0.5));

  // 胜利判定
  if (S.waveNum >= CFG.waves && S.pending.length === 0 && S.zombies.length === 0) {
    S.ending += dt;
    if (S.ending > 1.2) gameOver(true);
  }
}

/* ================= 绘制 ================= */
function ell(x, y, rx, ry, fill, stroke, lw) {
  g.beginPath();
  g.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), 0, 0, Math.PI * 2);
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw || 2.5; g.stroke(); }
}
function rr(x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
function line(x1, y1, x2, y2, color, lw) {
  g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2);
  g.strokeStyle = color; g.lineWidth = lw; g.lineCap = 'round'; g.stroke();
}
function poly(pts, fill, stroke, lw = 2.5) {
  g.beginPath(); g.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]);
  g.closePath();
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw; g.stroke(); }
}
function shadow(x, y, w) { ell(x, y, w, w * 0.28, 'rgba(0,0,0,.2)'); }
function stem(x, y, top) {
  g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x - 7, (y + top) / 2, x, top);
  g.strokeStyle = '#3d7a22'; g.lineWidth = 5; g.lineCap = 'round'; g.stroke();
  ell(x - 10, y - 3, 11, 4, '#5fa832', '#2f6b1c', 1.5);
  ell(x + 10, y - 3, 11, 4, '#5fa832', '#2f6b1c', 1.5);
}
function peaHead(x, y, r, body, dark) {
  ell(x - r * 0.95, y - r * 0.6, r * 0.45, r * 0.22, body, dark, 1.5);
  g.beginPath(); g.rect(x + r * 0.3, y - r * 0.42, r * 1.05, r * 0.84);
  g.fillStyle = body; g.fill(); g.strokeStyle = dark; g.lineWidth = 2.5; g.stroke();
  ell(x + r * 1.38, y, r * 0.3, r * 0.52, body, dark);
  ell(x + r * 1.43, y, r * 0.15, r * 0.32, dark);
  ell(x, y, r, r, body, dark);
  ell(x + r * 0.2, y - r * 0.32, r * 0.24, r * 0.3, '#fff', dark, 1.5);
  ell(x + r * 0.28, y - r * 0.3, r * 0.11, r * 0.16, '#111');
}
function flame(x, y, s, t) {
  const f = Math.sin(t * 12) * s * 0.12;
  const path = k => {
    g.beginPath(); g.moveTo(x - s * 0.6 * k, y);
    g.quadraticCurveTo(x - s * k, y - s * 0.9 * k, x - s * 0.5 * k + f, y - s * 1.7 * k);
    g.quadraticCurveTo(x - s * 0.15 * k, y - s * k, x + s * 0.1 * k, y - s * 1.35 * k - f);
    g.quadraticCurveTo(x + s * 0.5 * k, y - s * 0.6 * k, x + s * 0.4 * k, y);
    g.closePath();
  };
  path(1); g.fillStyle = '#ffb12b'; g.fill(); g.strokeStyle = '#c2410c'; g.lineWidth = 2; g.stroke();
  path(0.55); g.fillStyle = '#ffe36b'; g.fill();
}
function nut(x, y, ratio) {
  ell(x, y - 30, 24, 31, '#d9a061', '#6e4520', 3);
  ell(x + 7, y - 17, 13, 11, 'rgba(110,69,32,.18)');
  ell(x - 7, y - 40, 5, 6.5, '#fff', '#3b2410', 1.5);
  ell(x + 8, y - 40, 5, 6.5, '#fff', '#3b2410', 1.5);
  ell(x - 5, y - 39, 2.4, 3, '#111');
  ell(x + 10, y - 39, 2.4, 3, '#111');
  g.beginPath();
  if (ratio > 0.5) g.arc(x + 1, y - 30, 6, 0.2 * Math.PI, 0.8 * Math.PI);
  else g.arc(x + 1, y - 22, 6, 1.2 * Math.PI, 1.8 * Math.PI);
  g.strokeStyle = '#3b2410'; g.lineWidth = 2; g.stroke();
  g.strokeStyle = '#5b3613'; g.lineWidth = 2;
  if (ratio < 0.66) { g.beginPath(); g.moveTo(x - 18, y - 50); g.lineTo(x - 10, y - 44); g.lineTo(x - 15, y - 36); g.lineTo(x - 8, y - 30); g.stroke(); }
  if (ratio < 0.33) { g.beginPath(); g.moveTo(x + 20, y - 46); g.lineTo(x + 12, y - 38); g.lineTo(x + 18, y - 28); g.lineTo(x + 11, y - 20); g.stroke(); }
}
function cherries(x, y) {
  line(x + 2, y - 16, x - 9, y - 2, '#3d7a22', 2.5);
  line(x + 2, y - 16, x + 11, y - 4, '#3d7a22', 2.5);
  ell(x + 5, y - 17, 6, 3, '#5fa832', '#2f6b1c', 1.2);
  ell(x - 9, y + 3, 9, 9, '#e3263a', '#7d0f1b', 2);
  ell(x + 11, y + 1, 9, 9, '#e3263a', '#7d0f1b', 2);
  ell(x - 12, y, 2.5, 2, 'rgba(255,255,255,.7)');
  ell(x + 8, y - 2, 2.5, 2, 'rgba(255,255,255,.7)');
}

// 可爱小脸：dir=1 朝右（小伙伴），dir=-1 朝左（团子）
function cuteFace(x, y, s, dir = 1, mood = 'smile') {

      g.strokeStyle = '#4a2a2a'; g.lineWidth = 1.6 * s; g.lineCap = 'round'; g.stroke();
    }

    for (const sx of [-1, 1]) {

      ell(x + sx * ex + dir * 2 * s + 0.8 * s, y + ey - 1.1 * s, 0.9 * s, 0.9 * s, '#fff');

  if (mood === 'sleep') { g.moveTo(x + dir * 2 * s - 2 * s, y + 4 * s); g.lineTo(x + dir * 2 * s + 2 * s, y + 4 * s); }

  g.fillStyle = color; g.fill();
}

// 方糖：金色光晕 + 旋转光芒 + 投影，放在粉白格子布上也很显眼
function drawSun(x, y, t, a = 1) {
  g.save(); g.globalAlpha *= a;
  const pulse = 0.5 + 0.5 * Math.sin(t * 5);

  ell(x, y + 24, 16, 4, 'rgba(160,70,100,.22)');

  halo.addColorStop(0, 'rgba(255,226,120,.85)');
  halo.addColorStop(0.55, 'rgba(255,200,90,.35)');
  halo.addColorStop(1, 'rgba(255,200,90,0)');
  g.fillStyle = halo; g.beginPath(); g.arc(x, by, 38 + pulse * 6, 0, Math.PI * 2); g.fill();
  g.save(); g.translate(x, by); g.rotate(t * 0.9);
  g.fillStyle = `rgba(255,214,90,${0.45 + pulse * 0.3})`;
  for (let i = 0; i < 6; i++) { g.rotate(Math.PI / 3); g.beginPath(); g.moveTo(-4, -20); g.lineTo(4, -20); g.lineTo(0, -34 - pulse * 4); g.closePath(); g.fill(); }
  g.restore();
  g.translate(x, by); g.rotate(Math.sin(t * 2) * 0.15); g.scale(1.25, 1.25);
  rr(-14, -14, 28, 28, 6); g.fillStyle = '#ffffff'; g.fill(); g.strokeStyle = '#e86a92'; g.lineWidth = 3; g.stroke();
  rr(-14, -14, 28, 9, 5); g.fillStyle = '#fff4c2'; g.fill();
  for (const [dx, dy] of [[-6, 2], [5, -2], [2, 8], [-4, -6]]) ell(dx, dy, 1.5, 1.5, '#ffc2d4');
  ell(-6, -8, 4, 2.5, 'rgba(255,255,255,.95)');
  g.fillStyle = `rgba(255,190,60,${0.7 + pulse * 0.3})`;
  g.beginPath(); g.moveTo(15, -18); g.lineTo(17, -13); g.lineTo(22, -11); g.lineTo(17, -9); g.lineTo(15, -4); g.lineTo(13, -9); g.lineTo(8, -11); g.lineTo(13, -13); g.closePath(); g.fill();
  g.restore();
}

function drawPart(p) {
  const a = 1 - clamp01((p.t - p.life * 0.6) / (p.life * 0.4));
  g.save(); g.globalAlpha = a; g.translate(p.x, p.y); g.rotate(p.rot);
  switch (p.shape) {
    case 'circle': ell(0, 0, p.size, p.size, p.color); break;
    case 'rect': g.fillStyle = p.color; g.fillRect(-p.size, -p.size * 0.6, p.size * 2, p.size * 1.2); break;
    case 'head':
      ell(0, 0, 15, 15, '#a6bf9b', '#4f5e47');
      ell(-6, -3, 4.5, 5.5, '#fff', '#4f5e47', 1); ell(-7, -2, 1.8, 1.8, '#222');
      line(3, -6, 8, -1, '#4f5e47', 1.5); line(8, -6, 3, -1, '#4f5e47', 1.5);
      break;
    case 'cone': poly([-14, 13, 14, 13, 9, -13, -9, -13], '#fffaf0', '#d77a93'); break;
    case 'bucket':
      g.beginPath(); g.ellipse(0, 6, 19, 13, 0, Math.PI, Math.PI * 2); g.closePath();
      g.fillStyle = '#c9d6e3'; g.fill(); g.strokeStyle = '#7a8fa3'; g.lineWidth = 2.5; g.stroke(); ell(0, -8, 5, 3.5, '#ff9ec0');
      break;
    case 'heart': heart(0, 0, p.size, p.color); break;
    case 'sparkle': g.fillStyle = p.color; g.beginPath(); g.moveTo(0, -p.size); g.lineTo(p.size * 0.3, -p.size * 0.3); g.lineTo(p.size, 0); g.lineTo(p.size * 0.3, p.size * 0.3); g.lineTo(0, p.size); g.lineTo(-p.size * 0.3, p.size * 0.3); g.lineTo(-p.size, 0); g.lineTo(-p.size * 0.3, -p.size * 0.3); g.closePath(); g.fill(); break;
    case 'football':
      g.beginPath(); g.arc(0, 8, 17, Math.PI * 1.02, Math.PI * 2.02); g.closePath();
      g.fillStyle = '#c8202c'; g.fill(); g.strokeStyle = '#5c0b10'; g.lineWidth = 2.5; g.stroke();
      break;
    case 'arm': line(0, 0, -18, 4, '#6b6f5e', 6); ell(-20, 4, 4, 4, '#a6bf9b'); break;
    case 'pole': line(-30, 0, 30, 0, '#8a5a2e', 4); break;
    case 'helmet':
      g.beginPath(); g.arc(0, 6, 16, Math.PI * 1.05, Math.PI * 1.95); g.closePath();
      g.fillStyle = '#e8b62c'; g.fill(); g.strokeStyle = '#7a5a10'; g.lineWidth = 2.5; g.stroke();
      break;
    case 'shield':
      rr(-10, -29, 20, 58, 8); g.fillStyle = '#e8b27a'; g.fill(); g.strokeStyle = '#a8673a'; g.lineWidth = 2.5; g.stroke();
      break;
    case 'plus': line(-p.size, 0, p.size, 0, p.color, 3); line(0, -p.size, 0, p.size, p.color, 3); break;
  }
  g.restore();
}

function drawGrave(x, y, ratio) {

// 场地：料理台上铺着粉白格子野餐布，左边是要守护的大蛋糕，右边是厨房门口的地砖
function drawCake(x, y, s) {
  g.save(); g.translate(x, y); g.scale(s, s);
  ell(0, 4, 34, 8, '#e8d6c8', '#c9b0a0', 2);
  rr(-28, -40, 56, 42, 8); g.fillStyle = '#ffe3ec'; g.fill(); g.strokeStyle = '#d77a93'; g.lineWidth = 2.5; g.stroke();
  rr(-28, -40, 56, 12, 6); g.fillStyle = '#fffaf4'; g.fill();
  for (let i = 0; i < 5; i++) ell(-22 + i * 11, -28, 5, 6, '#fffaf4');

  for (const [dx, dy, c] of [[-14, -14, '#7fd3ff'], [8, -10, '#ffe36b'], [16, -20, '#9be07a'], [-6, -50, '#d79bff']]) ell(dx, dy, 2, 2, c);

}
function drawLawn() {
  g.fillStyle = '#f6d7c3'; g.fillRect(0, 0, W, H);
  // 左边：蛋糕台
  g.fillStyle = '#fff3ea'; g.fillRect(0, TOP, LX, CH * ROWS);
  for (let i = 0; i < ROWS; i++) { g.fillStyle = i % 2 ? '#ffe9de' : '#fff3ea'; g.fillRect(0, TOP + i * CH, LX, CH); }
  drawCake(LX / 2 - 4, TOP + CH * 2.5 + 30, 0.95);
  // 野餐布
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    g.fillStyle = (r + c) % 2 ? '#ffd9e5' : '#fffaf6';
    g.fillRect(LX + c * CW, TOP + r * CH, CW, CH);
  }
  g.strokeStyle = 'rgba(255,150,180,.25)'; g.lineWidth = 1;
  for (let c = 0; c <= COLS; c++) { g.beginPath(); g.moveTo(LX + c * CW + 0.5, TOP); g.lineTo(LX + c * CW + 0.5, TOP + CH * ROWS); g.stroke(); }
  // 野餐布上的小点点
  g.fillStyle = 'rgba(255,140,170,.18)';
  for (let i = 0; i < 70; i++) {
    const gx = LX + ((i * 137) % (CW * COLS)), gy = TOP + ((i * 211) % (CH * ROWS));
    g.beginPath(); g.arc(gx, gy, 2, 0, Math.PI * 2); g.fill();
  }
  // 右边：厨房门口的地砖
  const sx = LX + CW * COLS;
  for (let r = 0; r < ROWS * 2; r++) for (let i = 0; i < 2; i++) {
    g.fillStyle = (r + i) % 2 ? '#d8eef0' : '#c4e3e6';
    g.fillRect(sx + i * ((W - sx) / 2), TOP + r * CH / 2, (W - sx) / 2, CH / 2);
  }
  g.fillStyle = '#f0b8c8'; g.fillRect(sx, TOP, 6, CH * ROWS);
  g.fillStyle = '#e8b9a0'; g.fillRect(0, H - 10, W, 10);
}

function drawHUD() {
  g.fillStyle = '#ee8fab'; g.fillRect(0, 0, W, TOP);
  g.fillStyle = 'rgba(255,255,255,.1)'; g.fillRect(0, TOP - 3, W, 3);
  g.font = `20px ${FONT}`; g.textBaseline = 'middle'; g.textAlign = 'left';
  g.fillStyle = '#fff3d1';
  g.fillText(CFG.waves === Infinity ? `${CFG.mode === 'lucky' ? '甜品盲盒' : '无尽'} · 第 ${Math.max(1, S.waveNum)} 波` : CFG.label, 14, TOP / 2 + 1);
  const bx = W - 240, bw = 220, by = 13, bh = 14;
  if (CFG.waves !== Infinity) {
    rr(bx, by, bw, bh, 7); g.fillStyle = '#c0567a'; g.fill();
    const k = clamp01(S.t / S.endT);
    if (k > 0) { rr(bx + bw * (1 - k), by, bw * k, bh, 7); g.fillStyle = '#a8ecd1'; g.fill(); }
    S.waveTimes.forEach((wt, i) => {
      if (!isFlag(i + 1)) return;
      const fx = bx + bw * (1 - wt / S.endT);
      line(fx, by - 4, fx, by + bh + 1, '#efe9d8', 2);
      poly([fx, by - 4, fx + 10, by, fx, by + 4], S.t >= wt ? '#ffe36b' : '#ffd1e1');
    });
    ell(bx + bw * (1 - k), by + bh / 2, 9, 9, '#fffaf4', '#c0567a', 2);
  } else {
    g.textAlign = 'right'; g.fillStyle = '#ffd23f';
    g.fillText(`已喂饱 ${S.kills}`, W - 20, TOP / 2 + 1);
  }
  g.font = `15px ${FONT}`; g.textAlign = 'center'; g.fillStyle = '#fff3f6';
  let hint = '点卡片选小伙伴，再点餐桌放下';
  if (S.selected === 'shovel') hint = '锅铲：点一个小伙伴把它收回来';
  else if (S.selected === 'dart') hint = '牙签飞镖：点一下气球把它戳破（25 方糖）';
  else if (S.selected) hint = `${PLANTS[S.selected].name}：${PLANTS[S.selected].desc}`;
  if (!S.demo) g.fillText(hint, (210 + bx - 14) / 2, TOP / 2 + 1);
}

function bigText(text, x, y, size, fill, stroke, scale = 1) {
  g.save(); g.translate(x, y); g.scale(scale, scale);
  g.font = `${size}px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.lineWidth = size / 6; g.lineJoin = 'round'; g.strokeStyle = stroke; g.strokeText(text, 0, 0);
  g.fillStyle = fill; g.fillText(text, 0, 0);
  g.restore();
}

function drawFx(f) {
  const k = f.t / f.dur;
  if (f.type === 'boom' && f.big) {
    ell(f.x, f.y, 60 + k * 300, 40 + k * 200, `rgba(90,20,110,${0.7 * (1 - k)})`);
    ell(f.x, f.y, 40 + k * 200, 30 + k * 130, `rgba(255,120,30,${0.8 * (1 - k)})`);
    ell(f.x, f.y, 80 + k * 380, 55 + k * 250, null, `rgba(255,255,255,${0.8 * (1 - k)})`, 6);
    if (k < 0.7) bigText('轰！！', f.x, f.y - 30, 60, '#ffe36b', '#2a0a33', 1 + (1 - k) * 0.4);
  } else if (f.type === 'boom') {
    ell(f.x, f.y, 40 + k * 120, 30 + k * 85, `rgba(255,158,192,${0.7 * (1 - k)})`);
    ell(f.x, f.y, 20 + k * 75, 16 + k * 55, `rgba(255,250,240,${0.9 * (1 - k)})`);
    ell(f.x, f.y, 50 + k * 160, 35 + k * 110, null, `rgba(255,255,255,${0.8 * (1 - k)})`, 4);
    if (k < 0.6) bigText('啵！', f.x, f.y - 20, 40, '#fffaf4', '#e86a92', 1 + (1 - k) * 0.3);
  } else if (f.type === 'ice' && f.big) {
    g.fillStyle = `rgba(190,235,255,${0.45 * (1 - k)})`; g.fillRect(0, TOP, W, H - TOP);
    ell(f.x, f.y, 60 + k * 500, 40 + k * 330, null, `rgba(255,255,255,${1 - k})`, 6);
  } else if (f.type === 'ice') {
    ell(f.x, f.y, 30 + k * 150, 20 + k * 95, `rgba(160,220,255,${0.7 * (1 - k)})`, `rgba(255,255,255,${1 - k})`, 3);
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4, d = 20 + k * 90;
      line(f.x + Math.cos(a) * d * 0.5, f.y + Math.sin(a) * d * 0.35, f.x + Math.cos(a) * d, f.y + Math.sin(a) * d * 0.7, `rgba(255,255,255,${1 - k})`, 3);
    }
  } else if (f.type === 'fireline') {
    const a = 1 - k;
    g.fillStyle = `rgba(255,224,138,${0.3 * a})`; g.fillRect(LX, f.y - CH / 2, W - LX, CH);
    g.save(); g.globalAlpha = a;
    for (let i = 0; i < 26; i++) {
      const fx = LX + 14 + i * 30 + Math.sin(i * 7) * 8, fy = f.y + 20 - Math.abs(Math.sin(f.t * 10 + i)) * 40;
      ell(fx, fy, 8, 7, '#fff7d6', '#e0c48a', 1.2); ell(fx + 4, fy - 3, 5, 4, '#fffdf2');
    }
    g.restore();
    if (k < 0.5) bigText('啪啪啪！', W / 2, f.y - 20, 34, '#fffaf4', '#e8a21a');
  } else if (f.type === 'bolt') {
    const a = 1 - k;
    for (const [w, col] of [[14, `rgba(255,158,192,${0.35 * a})`], [7, `rgba(255,214,90,${0.7 * a})`], [3, `rgba(255,255,255,${a})`]]) {
      g.beginPath(); g.moveTo(f.pts[0][0], f.pts[0][1]);
      for (let i = 1; i < f.pts.length; i++) {
        const [x0, y0] = f.pts[i - 1], [x1, y1] = f.pts[i];
        for (let s = 1; s <= 4; s++) g.lineTo(x0 + (x1 - x0) * s / 4 + (s < 4 ? rnd(-10, 10) : 0), y0 + (y1 - y0) * s / 4 + (s < 4 ? rnd(-10, 10) : 0));
      }
      g.strokeStyle = col; g.lineWidth = w; g.lineJoin = 'round'; g.stroke();
    }
  } else if (f.type === 'clock') {
    const a = 1 - k;
    g.fillStyle = `rgba(255,214,90,${0.18 * a})`; g.fillRect(0, TOP, W, H - TOP);
    ell(f.x, f.y, 40 + k * 700, 30 + k * 480, null, `rgba(255,214,90,${0.9 * a})`, 8);
    ell(f.x, f.y, 30 + k * 520, 22 + k * 360, null, `rgba(255,255,255,${0.8 * a})`, 4);
    for (let i = 0; i < 12; i++) { const ang = i * Math.PI / 6; const rr3 = 60 + k * 420; line(f.x + Math.cos(ang) * rr3, f.y + Math.sin(ang) * rr3 * 0.7, f.x + Math.cos(ang) * (rr3 + 24), f.y + Math.sin(ang) * (rr3 + 24) * 0.7, `rgba(255,107,107,${a})`, 4); }
    g.save(); g.globalAlpha = a; g.translate(f.x, f.y - 40);
    ell(0, 0, 26, 26, '#fff3d1', '#5b3a8a', 3);
    line(0, 0, 0, -18, '#5b3a8a', 3); line(0, 0, Math.cos(k * 12) * 14, Math.sin(k * 12) * 14, '#5b3a8a', 3);
    g.restore();
  } else if (f.type === 'shellboom') {
    ell(f.x, f.y, 20 + k * 60, 14 + k * 36, `rgba(255,140,40,${0.8 * (1 - k)})`);
    ell(f.x, f.y, 30 + k * 80, 20 + k * 50, null, `rgba(255,255,255,${0.8 * (1 - k)})`, 3);
    if (k < 0.6) bigText('砰！', f.x, f.y - 30, 28, '#ffe36b', '#4a1405', 1 + (1 - k) * 0.2);
  } else if (f.type === 'flash') {
    g.save(); g.globalAlpha = 1 - k;
    ell(f.x, f.y, 16 + k * 12, 12 + k * 8, f.color);
    ell(f.x, f.y, 8, 6, '#ffffff');
    g.restore();
  } else if (f.type === 'ring') {
    const rr2 = f.r || 34;
    ell(f.x, f.y, 8 + k * rr2, 8 + k * rr2, null, f.color, 5 * (1 - k) + 0.5);
    ell(f.x, f.y, 4 + k * rr2 * 0.55, 4 + k * rr2 * 0.55, null, 'rgba(255,255,255,.85)', 2.5 * (1 - k));
  } else if (f.type === 'mist') {
    const a = 0.55 * (1 - k);
    for (let i = 0; i < 6; i++) { const ang = i * Math.PI / 3 + f.t; ell(f.x + Math.cos(ang) * f.r * 0.35 * k, f.y + Math.sin(ang) * f.r * 0.2 * k, f.r * (0.3 + k * 0.4), f.r * (0.18 + k * 0.25), `rgba(${f.color},${a})`); }
  } else if (f.type === 'shock') {
    ell(f.x, f.y, 20 + k * f.r, 14 + k * f.r * 0.62, null, `rgba(255,255,255,${0.9 * (1 - k)})`, 8 * (1 - k) + 1);
    ell(f.x, f.y, 10 + k * f.r * 0.7, 8 + k * f.r * 0.45, null, `rgba(255,158,192,${0.8 * (1 - k)})`, 5 * (1 - k) + 1);
  } else if (f.type === 'star') {
    g.save(); g.globalAlpha = 1 - k; g.translate(f.x, f.y); g.rotate(k * 2); g.scale(0.4 + k * 1.2, 0.4 + k * 1.2);
    g.fillStyle = '#ffd56a';
    g.beginPath(); for (let i = 0; i < 10; i++) { const a = i * Math.PI / 5 - Math.PI / 2, r2 = i % 2 ? 9 : 22; g.lineTo(Math.cos(a) * r2, Math.sin(a) * r2); } g.closePath(); g.fill();
    g.restore();
  } else if (f.type === 'laser') {
    const a = 1 - k;
    g.save(); g.globalAlpha = a;
    // 彩虹光束：五色叠在一起，越往外越淡
    const cols = ['#ff6b8a', '#ffd56a', '#7fe0a8', '#7fd3ff', '#b69cf0'];
    const wide = 34 * (1 - k * 0.4);
    for (let i = 0; i < 5; i++) line(f.x, f.y - wide / 2 + (i + 0.5) * wide / 5, W, f.y - wide / 2 + (i + 0.5) * wide / 5, cols[i], wide / 5 + 1);
    line(f.x, f.y, W, f.y, 'rgba(255,255,255,.9)', 4);
    for (let i = 0; i < 14; i++) ell(f.x + rnd(0, W - f.x), f.y + rnd(-wide / 2, wide / 2), 3, 3, '#ffffff');
    g.restore();
  } else if (f.type === 'magnet') {
    g.save(); g.globalAlpha = 1 - k;
    g.beginPath(); g.moveTo(f.x, f.y); g.quadraticCurveTo((f.x + f.x2) / 2, Math.min(f.y, f.y2) - 40, f.x2, f.y2);
    g.strokeStyle = '#ff5a5a'; g.lineWidth = 3; g.setLineDash([6, 6]); g.lineDashOffset = -k * 60; g.stroke(); g.setLineDash([]);
    g.restore();
  } else if (f.type === 'disco') {
    g.save(); g.globalAlpha = 0.55 * (1 - k);
    const cols = ['#ff6fd8', '#6fd6ff', '#ffe36b', '#9bff6f'];
    for (let i = 0; i < 4; i++) {
      const a2 = f.t * 4 + i * Math.PI / 2;
      g.beginPath(); g.moveTo(f.x, f.y - 140);
      g.lineTo(f.x + Math.cos(a2) * 120 - 20, f.y + 40); g.lineTo(f.x + Math.cos(a2) * 120 + 20, f.y + 40); g.closePath();
      g.fillStyle = cols[i]; g.fill();
    }
    g.restore();
  } else if (f.type === 'plant') {
    for (let i = 0; i < 5; i++) ell(f.x - 24 + i * 12, f.y - k * 10, 6 * (1 - k), 4 * (1 - k), `rgba(255,179,199,${1 - k})`);
  }
}

function draw() {
  g = ctx;

  if (CFG && CFG.bowling && !S.demo) {
    g.fillStyle = 'rgba(227,38,58,.12)'; g.fillRect(LX, TOP, CW * 3, CH * ROWS);
    line(LX + CW * 3, TOP + 4, LX + CW * 3, TOP + CH * ROWS - 4, '#e3263a', 4);
  }
  for (const d of S.decals) ell(d.x, d.y, d.r, d.r * 0.32, `rgba(40,24,10,${0.45 * (1 - d.t / d.life)})`);
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (S.graves[r][c]) drawGrave(cellCX(c), cellCY(r) + 30, S.graves[r][c] / 600);
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {

    if (left > 0) {
      g.save(); g.globalAlpha = Math.min(1, left / 3);
      ell(cellCX(c), cellCY(r) + 24, 34, 14, '#3e2611', '#2a1a0c', 2);
      ell(cellCX(c), cellCY(r) + 22, 24, 8, '#24160a');

  }
  if (S.hover && S.selected && !S.over) {

    if (S.selected === 'shovel') {
      if (occupied) { g.fillStyle = 'rgba(255,80,60,.25)'; g.fillRect(LX + c * CW, TOP + r * CH, CW, CH); }
    } else {
      g.fillStyle = 'rgba(255,255,255,.12)';

    }
  }
  S.mowers.forEach((m, r) => {
    if (m.state === 'done') return;
    const y = cellCY(r) + 16, jig = m.state === 'go' ? rnd(-1, 1) : 0;
    drawVacuum(m.x, y + jig, m.state === 'go');
  });
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const p = S.plants[r][c];
      if (p && !p.atk) drawPlant(p.type, cellCX(c), cellCY(r) + 28, t, p);
    }
    S.zombies.filter(z => z.row === r).sort((a, b) => a.x - b.x).forEach(z => drawZombie(z));
    for (let c = 0; c < COLS; c++) {
      const p = S.plants[r][c];
      if (p && p.atk) drawPlant(p.type, cellCX(c), cellCY(r) + 28, t, p);
    }
  }
  for (const p of S.peas) {
    if (p.kind === 'fire' && p.burn) {
      ell(p.x - 14, p.y, 14, 5, 'rgba(255,150,60,.45)');
      ell(p.x, p.y, 9, 9, '#ffb347', '#c2601e', 1.8);
      ell(p.x + 1, p.y - 1, 4.5, 4.5, '#fff1a8');
      if (Math.random() < 0.6) part({ x: p.x - 8, y: p.y + rnd(-3, 3), vx: rnd(-80, -30), vy: rnd(-40, 0), grav: -40, life: 0.25, size: rnd(2, 3.5), color: Math.random() < 0.5 ? '#ffb347' : '#ff7a59' });
    } else if (p.kind === 'fire') {
      ell(p.x - 11, p.y, 11, 5, 'rgba(255,143,181,.45)');
      ell(p.x, p.y, 8, 8, '#ff8fb5', '#c2406e', 1.5);
      ell(p.x - 2, p.y - 2, 2, 2, '#fff'); ell(p.x + 3, p.y + 1, 1.6, 1.6, '#ffe36b'); ell(p.x - 1, p.y + 3, 1.6, 1.6, '#7fd3ff');
    } else if (p.kind === 'ice') {
      ell(p.x - 9, p.y, 9, 4, 'rgba(168,236,209,.55)');
      ell(p.x, p.y, 8, 7, '#a8ecd1', '#4fae8a', 1.5);
      ell(p.x - 2, p.y - 2, 2.5, 2, '#fff');
    } else if (p.kind === 'spike') {
      line(p.x - 16, p.y, p.x - 4, p.y, 'rgba(201,231,122,.45)', 4);
      poly([p.x - 8, p.y - 3, p.x + 10, p.y, p.x - 8, p.y + 3], '#c9e77a', '#3f6b12', 1.5);
    } else if (p.kind === 'boomer') {
      g.save(); g.translate(p.x, p.y); g.rotate(p.spin);
      g.beginPath(); g.moveTo(-14, -4); g.quadraticCurveTo(0, -14, 14, -4); g.lineTo(10, 2); g.quadraticCurveTo(0, -6, -10, 2); g.closePath();
      g.fillStyle = '#9ccf3c'; g.fill(); g.strokeStyle = '#3f6b12'; g.lineWidth = 2; g.stroke();
      g.restore();
    } else if (p.kind === 'water') {
      ell(p.x - 14, p.y, 14, 4, 'rgba(79,195,232,.35)');
      g.beginPath(); g.moveTo(p.x + 10, p.y);
      g.quadraticCurveTo(p.x, p.y - 10, p.x - 8, p.y); g.quadraticCurveTo(p.x, p.y + 10, p.x + 10, p.y);
      g.fillStyle = '#6fd6f2'; g.fill(); g.strokeStyle = '#1f7fa6'; g.lineWidth = 1.5; g.stroke();

    } else {
      if (!p.c) p.c = ['#ff9ec0', '#7fd3ff', '#ffe36b', '#9be07a', '#d79bff'][Math.floor(Math.random() * 5)];
      ell(p.x - 10, p.y, 10, 3.5, 'rgba(255,200,220,.4)');
      g.save(); g.translate(p.x, p.y); g.rotate(-0.3);

      ell(-2, -2, 3, 1.5, 'rgba(255,255,255,.75)');
      g.restore();
    }
  }
  for (const l of S.lobs) {
    const k = Math.min(1, l.t / l.dur), ty = cellCY(l.row) - 20;
    const shell = l.kind === 'shell';
    const lx = l.sx + (l.tx - l.sx) * k, ly = l.sy + (ty - l.sy) * k - Math.sin(k * Math.PI) * (shell ? 200 : 120);
    ell(lx, cellCY(l.row) + 30, 10 * (0.5 + k * 0.5), 4, 'rgba(0,0,0,.15)');
    g.save(); g.translate(lx, ly); g.rotate(k * 6);
    if (shell) {
      ell(0, 4, 13, 8, '#fffaf6', '#d77a93', 2); ell(0, -2, 9, 6, '#fffaf6', '#d77a93', 2); ell(0, -8, 5, 4, '#ffd1e1', '#d77a93', 1.5);
      ell(-4, 0, 3, 2, 'rgba(255,255,255,.9)');
    } else {
      ell(0, 0, 13, 12, '#ffc2cf', '#c2405e', 2);
      rr(-7, -6, 6, 6, 1.5); g.fillStyle = 'rgba(255,255,255,.85)'; g.fill(); rr(2, 0, 5, 5, 1.5); g.fill();
      ell(-4, -6, 3, 2, '#fff');
    }
    g.restore();
  }
  for (const ro of S.rollers) {
    ell(ro.x, cellCY(ro.row) + 34, 22, 6, 'rgba(120,60,80,.18)');
    g.save(); g.translate(ro.x, ro.y); g.rotate(ro.spin);
    donut(0, 0, 22, ro.kind === 'bombnut');
    g.restore();
  }
  for (const b of S.bees) {
    const flap = Math.sin(S.t * 60) * 3;
    ell(b.x - 2, b.y - 6, 5, 3 + flap * 0.3, 'rgba(255,255,255,.75)');
    ell(b.x + 3, b.y - 6, 5, 3 - flap * 0.3, 'rgba(255,255,255,.75)');
    ell(b.x, b.y, 7, 5, '#ffd23f', '#2b1d10', 1.5);
    line(b.x - 2, b.y - 4, b.x - 2, b.y + 4, '#2b1d10', 2); line(b.x + 2, b.y - 4, b.x + 2, b.y + 4, '#2b1d10', 2);
  }
  // 浓雾：盖住右边四列，闪电会暂时照亮
  if (CFG && CFG.fog && !S.demo) {
    const a = 0.88 * (1 - Math.min(1, S.fogClear));
    if (a > 0.01) {
      g.save(); g.globalAlpha = a;
      for (let r = 0; r <= ROWS; r++) for (let i = 0; i < 6; i++) {
        const fx = LX + CW * 5 - 20 + i * 70 + Math.sin(S.t * 0.4 + r + i) * 12, fy = TOP + r * CH + Math.cos(S.t * 0.3 + i) * 8;
