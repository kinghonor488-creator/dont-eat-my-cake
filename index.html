  let hint = '点卡片选小伙伴，再点餐桌放下';
  if (S.selected === 'shovel') hint = '锅铲：点一个小伙伴把它收回来';
  else if (S.selected === 'dart') hint = '牙签飞镖：点一下气球把它戳破（25 方糖）';
  else if (S.selected) hint = `${PLANTS[S.selected].name}：${PLANTS[S.selected].desc}`;
  if (!S.demo) g.fillText(hint, (210 + bx - 14) / 2, TOP / 2 + 1);
}

function bigText(text, x, y, size, fill, stroke, scale = 1) {
  g.save(); g.translate(x, y); g.scale(scale, scale);
  g.font = `${size}px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.lineWidth = size / 6; g.lineJoin = 'round'; g.strokeStyle = stroke; g.strokeText(text, 0, 0);
  g.fillStyle = fill; g.fillText(text, 0, 0);
  g.restore();
}

function drawFx(f) {
  const k = f.t / f.dur;
  if (f.type === 'boom' && f.big) {
    ell(f.x, f.y, 60 + k * 300, 40 + k * 200, `rgba(90,20,110,${0.7 * (1 - k)})`);
    ell(f.x, f.y, 40 + k * 200, 30 + k * 130, `rgba(255,120,30,${0.8 * (1 - k)})`);
    ell(f.x, f.y, 80 + k * 380, 55 + k * 250, null, `rgba(255,255,255,${0.8 * (1 - k)})`, 6);
    if (k < 0.7) bigText('轰！！', f.x, f.y - 30, 60, '#ffe36b', '#2a0a33', 1 + (1 - k) * 0.4);
  } else if (f.type === 'boom') {
    ell(f.x, f.y, 40 + k * 120, 30 + k * 85, `rgba(255,158,192,${0.7 * (1 - k)})`);
    ell(f.x, f.y, 20 + k * 75, 16 + k * 55, `rgba(255,250,240,${0.9 * (1 - k)})`);
    ell(f.x, f.y, 50 + k * 160, 35 + k * 110, null, `rgba(255,255,255,${0.8 * (1 - k)})`, 4);
    if (k < 0.6) bigText('啵！', f.x, f.y - 20, 40, '#fffaf4', '#e86a92', 1 + (1 - k) * 0.3);
  } else if (f.type === 'ice' && f.big) {
    g.fillStyle = `rgba(190,235,255,${0.45 * (1 - k)})`; g.fillRect(0, TOP, W, H - TOP);
    ell(f.x, f.y, 60 + k * 500, 40 + k * 330, null, `rgba(255,255,255,${1 - k})`, 6);
  } else if (f.type === 'ice') {
    ell(f.x, f.y, 30 + k * 150, 20 + k * 95, `rgba(160,220,255,${0.7 * (1 - k)})`, `rgba(255,255,255,${1 - k})`, 3);
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4, d = 20 + k * 90;
      line(f.x + Math.cos(a) * d * 0.5, f.y + Math.sin(a) * d * 0.35, f.x + Math.cos(a) * d, f.y + Math.sin(a) * d * 0.7, `rgba(255,255,255,${1 - k})`, 3);
    }
  } else if (f.type === 'fireline') {
    const a = 1 - k;
    g.fillStyle = `rgba(255,224,138,${0.3 * a})`; g.fillRect(LX, f.y - CH / 2, W - LX, CH);
    g.save(); g.globalAlpha = a;
    for (let i = 0; i < 26; i++) {
      const fx = LX + 14 + i * 30 + Math.sin(i * 7) * 8, fy = f.y + 20 - Math.abs(Math.sin(f.t * 10 + i)) * 40;
      ell(fx, fy, 8, 7, '#fff7d6', '#e0c48a', 1.2); ell(fx + 4, fy - 3, 5, 4, '#fffdf2');
    }
    g.restore();
    if (k < 0.5) bigText('啪啪啪！', W / 2, f.y - 20, 34, '#fffaf4', '#e8a21a');
  } else if (f.type === 'bolt') {
    const a = 1 - k;
    for (const [w, col] of [[14, `rgba(255,158,192,${0.35 * a})`], [7, `rgba(255,214,90,${0.7 * a})`], [3, `rgba(255,255,255,${a})`]]) {
      g.beginPath(); g.moveTo(f.pts[0][0], f.pts[0][1]);
      for (let i = 1; i < f.pts.length; i++) {
        const [x0, y0] = f.pts[i - 1], [x1, y1] = f.pts[i];
        for (let s = 1; s <= 4; s++) g.lineTo(x0 + (x1 - x0) * s / 4 + (s < 4 ? rnd(-10, 10) : 0), y0 + (y1 - y0) * s / 4 + (s < 4 ? rnd(-10, 10) : 0));
      }
      g.strokeStyle = col; g.lineWidth = w; g.lineJoin = 'round'; g.stroke();
    }
  } else if (f.type === 'clock') {
    const a = 1 - k;
    g.fillStyle = `rgba(255,214,90,${0.18 * a})`; g.fillRect(0, TOP, W, H - TOP);
    ell(f.x, f.y, 40 + k * 700, 30 + k * 480, null, `rgba(255,214,90,${0.9 * a})`, 8);
    ell(f.x, f.y, 30 + k * 520, 22 + k * 360, null, `rgba(255,255,255,${0.8 * a})`, 4);
    for (let i = 0; i < 12; i++) { const ang = i * Math.PI / 6; const rr3 = 60 + k * 420; line(f.x + Math.cos(ang) * rr3, f.y + Math.sin(ang) * rr3 * 0.7, f.x + Math.cos(ang) * (rr3 + 24), f.y + Math.sin(ang) * (rr3 + 24) * 0.7, `rgba(255,107,107,${a})`, 4); }
    g.save(); g.globalAlpha = a; g.translate(f.x, f.y - 40);
    ell(0, 0, 26, 26, '#fff3d1', '#5b3a8a', 3);
    line(0, 0, 0, -18, '#5b3a8a', 3); line(0, 0, Math.cos(k * 12) * 14, Math.sin(k * 12) * 14, '#5b3a8a', 3);
    g.restore();
  } else if (f.type === 'shellboom') {
    ell(f.x, f.y, 20 + k * 60, 14 + k * 36, `rgba(255,140,40,${0.8 * (1 - k)})`);
    ell(f.x, f.y, 30 + k * 80, 20 + k * 50, null, `rgba(255,255,255,${0.8 * (1 - k)})`, 3);
    if (k < 0.6) bigText('砰！', f.x, f.y - 30, 28, '#ffe36b', '#4a1405', 1 + (1 - k) * 0.2);
  } else if (f.type === 'flash') {
    g.save(); g.globalAlpha = 1 - k;
    ell(f.x, f.y, 16 + k * 12, 12 + k * 8, f.color);
    ell(f.x, f.y, 8, 6, '#ffffff');
    g.restore();
  } else if (f.type === 'ring') {
    const rr2 = f.r || 34;
    ell(f.x, f.y, 8 + k * rr2, 8 + k * rr2, null, f.color, 5 * (1 - k) + 0.5);
    ell(f.x, f.y, 4 + k * rr2 * 0.55, 4 + k * rr2 * 0.55, null, 'rgba(255,255,255,.85)', 2.5 * (1 - k));
  } else if (f.type === 'mist') {
    const a = 0.55 * (1 - k);
    for (let i = 0; i < 6; i++) { const ang = i * Math.PI / 3 + f.t; ell(f.x + Math.cos(ang) * f.r * 0.35 * k, f.y + Math.sin(ang) * f.r * 0.2 * k, f.r * (0.3 + k * 0.4), f.r * (0.18 + k * 0.25), `rgba(${f.color},${a})`); }
  } else if (f.type === 'shock') {
    ell(f.x, f.y, 20 + k * f.r, 14 + k * f.r * 0.62, null, `rgba(255,255,255,${0.9 * (1 - k)})`, 8 * (1 - k) + 1);
    ell(f.x, f.y, 10 + k * f.r * 0.7, 8 + k * f.r * 0.45, null, `rgba(255,158,192,${0.8 * (1 - k)})`, 5 * (1 - k) + 1);
  } else if (f.type === 'star') {
    g.save(); g.globalAlpha = 1 - k; g.translate(f.x, f.y); g.rotate(k * 2); g.scale(0.4 + k * 1.2, 0.4 + k * 1.2);
    g.fillStyle = '#ffd56a';
    g.beginPath(); for (let i = 0; i < 10; i++) { const a = i * Math.PI / 5 - Math.PI / 2, r2 = i % 2 ? 9 : 22; g.lineTo(Math.cos(a) * r2, Math.sin(a) * r2); } g.closePath(); g.fill();
    g.restore();
  } else if (f.type === 'laser') {
    const a = 1 - k;
    g.save(); g.globalAlpha = a;
    // 彩虹光束：五色叠在一起，越往外越淡
    const cols = ['#ff6b8a', '#ffd56a', '#7fe0a8', '#7fd3ff', '#b69cf0'];
    const wide = 34 * (1 - k * 0.4);
    for (let i = 0; i < 5; i++) line(f.x, f.y - wide / 2 + (i + 0.5) * wide / 5, W, f.y - wide / 2 + (i + 0.5) * wide / 5, cols[i], wide / 5 + 1);
    line(f.x, f.y, W, f.y, 'rgba(255,255,255,.9)', 4);
    for (let i = 0; i < 14; i++) ell(f.x + rnd(0, W - f.x), f.y + rnd(-wide / 2, wide / 2), 3, 3, '#ffffff');
    g.restore();
  } else if (f.type === 'magnet') {
    g.save(); g.globalAlpha = 1 - k;
    g.beginPath(); g.moveTo(f.x, f.y); g.quadraticCurveTo((f.x + f.x2) / 2, Math.min(f.y, f.y2) - 40, f.x2, f.y2);
    g.strokeStyle = '#ff5a5a'; g.lineWidth = 3; g.setLineDash([6, 6]); g.lineDashOffset = -k * 60; g.stroke(); g.setLineDash([]);
    g.restore();
  } else if (f.type === 'disco') {
    g.save(); g.globalAlpha = 0.55 * (1 - k);
    const cols = ['#ff6fd8', '#6fd6ff', '#ffe36b', '#9bff6f'];
    for (let i = 0; i < 4; i++) {
      const a2 = f.t * 4 + i * Math.PI / 2;
      g.beginPath(); g.moveTo(f.x, f.y - 140);
      g.lineTo(f.x + Math.cos(a2) * 120 - 20, f.y + 40); g.lineTo(f.x + Math.cos(a2) * 120 + 20, f.y + 40); g.closePath();
      g.fillStyle = cols[i]; g.fill();
    }
    g.restore();
  } else if (f.type === 'spray') {
    g.save(); g.globalAlpha = 0.5 * (1 - k);
    g.beginPath(); g.moveTo(f.x, f.y); g.lineTo(f.x + 60 + k * 160, f.y - 30 - k * 20); g.lineTo(f.x + 60 + k * 160, f.y + 30 + k * 20); g.closePath();
    g.fillStyle = '#c9a3b4'; g.fill(); g.restore();
  } else if (f.type === 'plant') {
    for (let i = 0; i < 5; i++) ell(f.x - 24 + i * 12, f.y - k * 10, 6 * (1 - k), 4 * (1 - k), `rgba(255,179,199,${1 - k})`);
  }
}

function draw() {
  g = ctx;
  const t = S.t + S.intro;
  g.save();
  if (S.shake > 0) g.translate(rnd(-S.shake, S.shake) * 0.5, rnd(-S.shake, S.shake) * 0.5);
  drawLawn();
  // 顶栏先画，第一排的团子和气球可以盖在顶栏上面，不会被挡住
  if (!S.demo) drawHUD();
  if (CFG && CFG.night && !S.demo) { g.fillStyle = 'rgba(16,24,64,.42)'; g.fillRect(0, TOP, W, CH * ROWS); }
  if (CFG && CFG.bowling && !S.demo) {
    g.fillStyle = 'rgba(227,38,58,.12)'; g.fillRect(LX, TOP, CW * 3, CH * ROWS);
    line(LX + CW * 3, TOP + 4, LX + CW * 3, TOP + CH * ROWS - 4, '#e3263a', 4);
  }
  for (const d of S.decals) ell(d.x, d.y, d.r, d.r * 0.32, `rgba(40,24,10,${0.45 * (1 - d.t / d.life)})`);
  for (const pl of S.pools) {
    const a = Math.min(1, pl.t * 4, (pl.life - pl.t) / 1.2), cy = cellCY(pl.row) + 26;
    g.save(); g.globalAlpha = a;
    rr(pl.x0, cy - 14, pl.x1 - pl.x0, 30, 15); g.fillStyle = '#6b3a24'; g.fill();
    rr(pl.x0 + 6, cy - 10, pl.x1 - pl.x0 - 12, 10, 5); g.fillStyle = 'rgba(200,106,58,.7)'; g.fill();
    for (let i = 0; i < 6; i++) { const bx = pl.x0 + 20 + i * (pl.x1 - pl.x0 - 40) / 5, k = (pl.t * 1.2 + i * 0.37) % 1; ell(bx, cy - k * 10, 3 + k * 3, 3 + k * 3, `rgba(232,140,80,${0.9 - k})`); }
    g.restore();
  }
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (S.graves[r][c]) drawGrave(cellCX(c), cellCY(r) + 30, S.graves[r][c] / 600);
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const left = S.craters[r][c];
    if (left > 0) {
      g.save(); g.globalAlpha = Math.min(1, left / 3);
      ell(cellCX(c), cellCY(r) + 24, 34, 14, '#3e2611', '#2a1a0c', 2);
      ell(cellCX(c), cellCY(r) + 22, 24, 8, '#24160a');
      g.restore();
    }
  }
  if (S.hover && S.selected && !S.over) {
    const { r, c } = S.hover;
    const replaceable = canReplace(S.plants[r][c], S.selected);
    const occupied = (!!S.plants[r][c] && !replaceable) || S.craters[r][c] > 0 || !!S.graves[r][c] || (CFG.bowling && c > 2);
    if (S.selected === 'shovel') {
      if (occupied) { g.fillStyle = 'rgba(255,80,60,.25)'; g.fillRect(LX + c * CW, TOP + r * CH, CW, CH); }
    } else {
      g.fillStyle = 'rgba(255,255,255,.12)';
      g.fillRect(LX, TOP + r * CH, CW * COLS, CH);
      g.fillStyle = occupied ? 'rgba(255,80,60,.22)' : 'rgba(255,255,255,.22)';
      g.fillRect(LX + c * CW, TOP + r * CH, CW, CH);
      if (replaceable) bigText('换新', cellCX(c), cellCY(r) - 34, 18, '#a8ecd1', '#3f9a74');
      else if (!occupied) { g.save(); g.globalAlpha = 0.45; drawPlant(S.selected, cellCX(c), cellCY(r) + 28, t, null); g.restore(); }
    }
  }
  S.mowers.forEach((m, r) => {
    if (m.state === 'done') return;
    const y = cellCY(r) + 16, jig = m.state === 'go' ? rnd(-1, 1) : 0;
    drawVacuum(m.x, y + jig, m.state === 'go');
  });
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const p = S.plants[r][c];
      if (p && !p.atk) {
        if (p.tier) drawTierAura(cellCX(c), cellCY(r) + 28, p.tier, t, false);
        drawPlant(p.type, cellCX(c), cellCY(r) + 28, t, p);
        if (p.tier) drawTierAura(cellCX(c), cellCY(r) + 28, p.tier, t, true);
      }
    }
    S.zombies.filter(z => z.row === r).sort((a, b) => a.x - b.x).forEach(z => drawZombie(z));
    for (let c = 0; c < COLS; c++) {
      const p = S.plants[r][c];
      if (p && p.atk) drawPlant(p.type, cellCX(c), cellCY(r) + 28, t, p);
    }
  }
  for (const p of S.peas) {
    if (p.kind === 'fire' && p.burn) {
      ell(p.x - 14, p.y, 14, 5, 'rgba(255,150,60,.45)');
      ell(p.x, p.y, 9, 9, '#ffb347', '#c2601e', 1.8);
      ell(p.x + 1, p.y - 1, 4.5, 4.5, '#fff1a8');
      if (Math.random() < 0.6) part({ x: p.x - 8, y: p.y + rnd(-3, 3), vx: rnd(-80, -30), vy: rnd(-40, 0), grav: -40, life: 0.25, size: rnd(2, 3.5), color: Math.random() < 0.5 ? '#ffb347' : '#ff7a59' });
    } else if (p.kind === 'fire') {
      ell(p.x - 11, p.y, 11, 5, 'rgba(255,143,181,.45)');
      ell(p.x, p.y, 8, 8, '#ff8fb5', '#c2406e', 1.5);
      ell(p.x - 2, p.y - 2, 2, 2, '#fff'); ell(p.x + 3, p.y + 1, 1.6, 1.6, '#ffe36b'); ell(p.x - 1, p.y + 3, 1.6, 1.6, '#7fd3ff');
    } else if (p.kind === 'ice') {
      ell(p.x - 9, p.y, 9, 4, 'rgba(168,236,209,.55)');
      ell(p.x, p.y, 8, 7, '#a8ecd1', '#4fae8a', 1.5);
      ell(p.x - 2, p.y - 2, 2.5, 2, '#fff');
    } else if (p.kind === 'spike') {
      line(p.x - 16, p.y, p.x - 4, p.y, 'rgba(201,231,122,.45)', 4);
      poly([p.x - 8, p.y - 3, p.x + 10, p.y, p.x - 8, p.y + 3], '#c9e77a', '#3f6b12', 1.5);
    } else if (p.kind === 'boomer') {
      g.save(); g.translate(p.x, p.y); g.rotate(p.spin);
      g.beginPath(); g.moveTo(-14, -4); g.quadraticCurveTo(0, -14, 14, -4); g.lineTo(10, 2); g.quadraticCurveTo(0, -6, -10, 2); g.closePath();
      g.fillStyle = '#9ccf3c'; g.fill(); g.strokeStyle = '#3f6b12'; g.lineWidth = 2; g.stroke();
      g.restore();
    } else if (p.kind === 'water') {
      ell(p.x - 14, p.y, 14, 4, 'rgba(79,195,232,.35)');
      g.beginPath(); g.moveTo(p.x + 10, p.y);
      g.quadraticCurveTo(p.x, p.y - 10, p.x - 8, p.y); g.quadraticCurveTo(p.x, p.y + 10, p.x + 10, p.y);
      g.fillStyle = '#6fd6f2'; g.fill(); g.strokeStyle = '#1f7fa6'; g.lineWidth = 1.5; g.stroke();
      ell(p.x - 1, p.y - 2, 2.5, 1.8, '#fff');
    } else {
      if (!p.c) p.c = ['#ff9ec0', '#7fd3ff', '#ffe36b', '#9be07a', '#d79bff'][Math.floor(Math.random() * 5)];
      ell(p.x - 10, p.y, 10, 3.5, 'rgba(255,200,220,.4)');
      g.save(); g.translate(p.x, p.y); g.rotate(-0.3);
      ell(0, 0, 8, 5.5, p.c, 'rgba(120,60,80,.35)', 1.2);
      ell(-2, -2, 3, 1.5, 'rgba(255,255,255,.75)');
      g.restore();
    }
  }
  for (const l of S.lobs) {
    const k = Math.min(1, l.t / l.dur), ty = cellCY(l.row) - 20;
    const shell = l.kind === 'shell';
    const lx = l.sx + (l.tx - l.sx) * k, ly = l.sy + (ty - l.sy) * k - Math.sin(k * Math.PI) * (shell ? 200 : 120);
    ell(lx, cellCY(l.row) + 30, 10 * (0.5 + k * 0.5), 4, 'rgba(0,0,0,.15)');
    g.save(); g.translate(lx, ly); g.rotate(k * 6);
    if (shell) {
      ell(0, 4, 13, 8, '#fffaf6', '#d77a93', 2); ell(0, -2, 9, 6, '#fffaf6', '#d77a93', 2); ell(0, -8, 5, 4, '#ffd1e1', '#d77a93', 1.5);
      ell(-4, 0, 3, 2, 'rgba(255,255,255,.9)');
    } else {
      ell(0, 0, 13, 12, '#ffc2cf', '#c2405e', 2);
      rr(-7, -6, 6, 6, 1.5); g.fillStyle = 'rgba(255,255,255,.85)'; g.fill(); rr(2, 0, 5, 5, 1.5); g.fill();
      ell(-4, -6, 3, 2, '#fff');
    }
    g.restore();
  }
  for (const ro of S.rollers) {
    ell(ro.x, cellCY(ro.row) + 34, 22, 6, 'rgba(120,60,80,.18)');
    g.save(); g.translate(ro.x, ro.y); g.rotate(ro.spin);
    donut(0, 0, 22, ro.kind === 'bombnut');
    g.restore();
  }
  for (const b of S.bees) {
    const flap = Math.sin(S.t * 60) * 3;
    ell(b.x - 2, b.y - 6, 5, 3 + flap * 0.3, 'rgba(255,255,255,.75)');
    ell(b.x + 3, b.y - 6, 5, 3 - flap * 0.3, 'rgba(255,255,255,.75)');
    ell(b.x, b.y, 7, 5, '#ffd23f', '#2b1d10', 1.5);
    line(b.x - 2, b.y - 4, b.x - 2, b.y + 4, '#2b1d10', 2); line(b.x + 2, b.y - 4, b.x + 2, b.y + 4, '#2b1d10', 2);
  }
  // 浓雾：盖住右边四列，闪电会暂时照亮
  if (CFG && CFG.fog && !S.demo) {
    const a = 0.88 * (1 - Math.min(1, S.fogClear));
    if (a > 0.01) {
      g.save(); g.globalAlpha = a;
      for (let r = 0; r <= ROWS; r++) for (let i = 0; i < 6; i++) {
        const fx = LX + CW * 5 - 20 + i * 70 + Math.sin(S.t * 0.4 + r + i) * 12, fy = TOP + r * CH + Math.cos(S.t * 0.3 + i) * 8;
        ell(fx, fy, 70, 48, i % 2 ? '#c9d1d6' : '#b8c2c8');
      }
      g.restore();
    }
  }
  for (const f of S.fx) drawFx(f);
  for (const p of S.parts) drawPart(p);
  for (const s of S.suns) {
    if (s.fly) {
      const k = Math.min(1, s.flyT / 0.5), e = 1 - (1 - k) * (1 - k);
      drawSun(s.sx + (20 - s.sx) * e, s.sy + (20 - s.sy) * e, t, 1 - k * 0.6);
    } else drawSun(s.x, s.y, t, s.life < 2 ? 0.4 + 0.6 * Math.abs(Math.sin(s.life * 8)) : 1);
  }
  g.restore();
  // 新团子提示：画在画面底部，半透明，点击会穿过它
  if (S.tip && !S.demo) {
    const a = Math.min(1, S.tip.t * 4, (5 - S.tip.t) * 2);
    g.save(); g.globalAlpha = Math.max(0, a) * 0.92;
    g.font = `15px ${FONT}`;
    const tw = Math.min(W - 40, g.measureText(S.tip.text).width + 32);
    rr(W / 2 - tw / 2, H - 46, tw, 30, 15); g.fillStyle = 'rgba(120,50,80,.78)'; g.fill();
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#fffaf4';
    g.fillText(S.tip.text, W / 2, H - 31, W - 60);
    g.restore();
  }

function drawIcon(canvas, kind, key, opt = {}) {
  const c2 = canvas.getContext('2d');
  const prev = g; g = c2;
  const s = canvas.width / 100;
  c2.setTransform(s, 0, 0, s, 0, 0);
  c2.clearRect(0, 0, 100, 100);
  if (kind === 'plant') {
    g.translate(46, 90); g.scale(1.05, 1.05);
    drawPlant(key, 0, 0, 0, null);
  } else if (kind === 'zombie') {
    const s = key === 'balloon' ? 0.78 : key === 'garg' ? 0.6 : key === 'zomboni' ? 0.8 : key === 'pole' ? 0.95 : 1.15;
    g.translate(key === 'zomboni' ? 66 : 52, key === 'balloon' ? 96 : 90); g.scale(s, s);
    const d = ZDEF[key];
    drawZombie({ type: key, hp: d.hp, maxHp: d.hp, armor: d.armor, maxArmor: d.armor, armorType: d.armorType, pole: !!d.pole, jumping: 0, frozen: 0, slow: 0, flash: 0, anim: 0, eating: false, dead: false,
      shield: d.shield || 0, fly: !!d.fly, thrown: false, smashT: 0, stop: 0, bounce: 0, landT: 0 }, 0, 0);
  } else if (kind === 'sun') {
    g.translate(50, 50); g.scale(1.05, 1.05); drawSun(0, 0, 0);
  } else if (kind === 'item') {
    drawItem(key);
  } else if (kind === 'dart') {
    // 牙签飞镖：牙签 + 粉色尾羽
    line(24, 78, 76, 26, '#e8c08a', 6);
    poly([76, 26, 86, 14, 80, 32], '#c9d6e3', '#7a8fa3', 2);
    poly([24, 78, 12, 74, 18, 90], '#ff9ec0', '#c2607e', 2);
    poly([24, 78, 28, 92, 14, 88], '#ffb3c7', '#c2607e', 2);
  } else if (kind === 'shovel') {
    line(30, 74, 64, 34, '#8a5a2e', 8);
    line(22, 82, 36, 66, '#3b3a35', 9);
    poly([58, 24, 84, 18, 80, 44, 64, 44], '#b8c0c4', '#4b5257', 3);
  }
  if (opt.locked) {
    c2.setTransform(1, 0, 0, 1, 0, 0);
    c2.globalCompositeOperation = 'source-atop';
    c2.fillStyle = '#4a3a24'; c2.fillRect(0, 0, canvas.width, canvas.height);
    c2.globalCompositeOperation = 'source-over';
  }
  g = prev;
}
function iconCanvas(kind, key, px, opt) {

}

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, '');
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null) e.append(kid);

}

    const r = node.getBoundingClientRect();
    let x, y;
    if (rotatedMQ.matches) { x = (e.clientY - r.top) / r.height - 0.5; y = (r.right - e.clientX) / r.width - 0.5; }
    else { x = (e.clientX - r.left) / r.width - 0.5; y = (e.clientY - r.top) / r.height - 0.5; }
    node.style.setProperty('--ry', (x * 20).toFixed(1) + 'deg');
    node.style.setProperty('--rx', (-y * 16).toFixed(1) + 'deg');
  });
  node.addEventListener('pointerleave', () => { node.style.setProperty('--ry', '0deg'); node.style.setProperty('--rx', '0deg'); });

function showLevels() {
  const n = LEVELS.length, gap = 118, pad = 96;
  const firstOpen = LEVELS.findIndex((L, i) => levelOpen(i) && !save.cleared.includes(i));
  const width = pad * 2 + gap * (n - 1);
  const xs = LEVELS.map((L, i) => pad + i * gap);
  const ys = LEVELS.map((L, i) => 52 + Math.sin(i * 1.15 + 0.4) * 24);
  const inner = el('div', { class: 'lmap-in', style: `width:${width}px` });
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', `0 0 ${width} 100`);
  svg.setAttribute('preserveAspectRatio', 'none');
  let dpath = `M ${xs[0]} ${ys[0]}`;
  for (let i = 1; i < n; i++) { const mx = (xs[i - 1] + xs[i]) / 2; dpath += ` C ${mx} ${ys[i - 1]}, ${mx} ${ys[i]}, ${xs[i]} ${ys[i]}`; }
  const path = (stroke, w, dash) => {
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('d', dpath); p.setAttribute('fill', 'none'); p.setAttribute('stroke', stroke); p.setAttribute('stroke-width', w);
    p.setAttribute('stroke-linecap', 'round'); p.setAttribute('vector-effect', 'non-scaling-stroke');
    if (dash) p.setAttribute('stroke-dasharray', dash);
    return p;
  };
  svg.append(path('rgba(255,255,255,.92)', 16), path('#f39ab5', 5, '1 13'));
  inner.append(svg, el('span', { class: 'chap' }, '第一章 · 甜蜜厨房'));
  LEVELS.forEach((L, i) => {
    const open = levelOpen(i), done = save.cleared.includes(i);
    inner.append(el('button', { class: 'lnode' + (done ? ' done' : '') + (i === firstOpen ? ' cur' : ''), style: `left:${xs[i]}px;top:${ys[i]}%`, disabled: !open,
      'aria-label': `${L.id} ${open ? L.name : '未解锁'}`, onclick: () => { sfx('select'); startFlow(advCfg(i)); } },
      el('span', { class: 'disc' }, open ? L.id : '', open ? null : el('span', { class: 'lock' }, '🔒'), done ? el('span', { class: 'ok' }, '✓') : null,
        el('span', { class: 'rwb', title: done ? `已获得${PLANTS[L.reward].name}` : '通关奖励' }, iconCanvas('plant', L.reward, 30, { locked: !done && i !== firstOpen }))),
      el('span', { class: 'lname' }, open ? L.name : '？？？')));
  });
  const map = el('div', { class: 'lmap' }, inner);
  map.addEventListener('wheel', e => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { map.scrollLeft += e.deltaY; e.preventDefault(); } }, { passive: false });
  openPage(page('冒险模式', showMenu, map, { bodyCls: 'flexcol' }), IMG.levels);
  const target = firstOpen === -1 ? n - 1 : firstOpen;
  requestAnimationFrame(() => { map.scrollLeft = Math.max(0, xs[target] - map.clientWidth / 2); });
}

// 关卡情报：这关会来哪些团子、各自特点、用谁克制（已解锁的克制小伙伴会标成"推荐"）
function intelBlock(cfg) {
  const types = [...new Set([...(cfg.flags && cfg.flags.length || cfg.flagEvery ? ['flag'] : []), ...cfg.pool])].filter(t => ZINFO[t]);
  const owned = new Set(cfg.plants);
  const rec = new Set();
  const rows = types.map(t => {
    const info = ZINFO[t];
    const counters = info.counters.filter(k => PLANTS[k]);
    counters.forEach(k => { if (owned.has(k)) rec.add(k); });
    return el('div', { class: 'intel-row' },
      iconCanvas('zombie', t, 46),
      el('div', { class: 'intel-txt' }, el('b', {}, ZDEF[t].name + (info.badge ? ` ·「${info.badge}」` : '')), el('span', {}, info.trait)),
      el('div', { class: 'intel-ctr' }, el('small', {}, '克制'),
        ...counters.slice(0, 4).map(k => { const c = iconCanvas('plant', k, 30, { locked: !plantUnlocked(k) && !owned.has(k) }); c.title = PLANTS[k].name; return c; })));
  });
  return { node: el('div', { class: 'intel' }, el('h2', {}, '关卡情报'), ...rows), rec };
}

  const have = TRAY_ITEMS.filter(k => save.items[k] > 0);

const rotatedMQ = window.matchMedia('(orientation:portrait) and (max-width:600px)');
function toWorld(e) {
  const r = cv.getBoundingClientRect();
  // 竖屏时整个游戏顺时针转了 90°：画布的 x 轴朝下，y 轴朝左
  if (rotatedMQ.matches) return { x: (e.clientY - r.top) / r.height * W, y: (r.right - e.clientX) / r.width * H };
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
function cellAt(x, y) {

/* ================= 尺寸与主循环 ================= */
function fit() {
  // 用布局尺寸（不受旋转影响）
  const r = { width: stage.clientWidth, height: stage.clientHeight };
  const scale = Math.max(0.1, Math.min(r.width / W, r.height / H));
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  cv.style.width = Math.floor(W * scale) + 'px';
  cv.style.height = Math.floor(H * scale) + 'px';
  cv.width = Math.round(W * scale * dpr);
  cv.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
new ResizeObserver(fit).observe(stage);
// 把真实可见区域写进 CSS 变量，竖屏旋转时用它定尺寸（iPhone 上 dvh 在主屏幕 App 里不可靠）
function measureScreen() {
  const w = document.body.clientWidth || window.innerWidth, h = document.body.clientHeight || window.innerHeight;
  document.documentElement.style.setProperty('--scr-w', w + 'px');
  document.documentElement.style.setProperty('--scr-h', h + 'px');
  // 游戏区域的高度：竖屏旋转时是屏幕宽度。界面字号按它缩放（不能用 vh，旋转后不对）
  const rot = window.matchMedia('(orientation:portrait) and (max-width:600px)').matches;
  document.documentElement.style.setProperty('--ah', (rot ? w : h) + 'px');
  document.documentElement.style.setProperty('--aw', (rot ? h : w) + 'px');
}
measureScreen();
window.addEventListener('resize', measureScreen);
window.addEventListener('orientationchange', () => setTimeout(() => { measureScreen(); fit(); }, 200));
if (window.visualViewport) window.visualViewport.addEventListener('resize', measureScreen);

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (S.demo) update(dt);
